body:
  text: 禮記集說卷二元陳澔撰檀弓上第三劉氏曰檀弓篇首言子游及篇內多言之疑是其門人所記公儀仲子之喪檀弓免焉仲子舍其孫而立其子檀弓曰何居我未之前聞也趨而就子服伯子於門右公儀氏仲子字魯之同姓也檀弓魯人之知禮者袒免本五世之服而朋友之死於他邦而無主者亦為之免其制以布廣一寸從項中而前交於額又卻向後而繞於髻也適子死立適孫為後禮也弓以仲子舍孫而立庶子故為過禮之免以弔而譏之何居怪之之辭猶言何故也此時未小斂主人未居阼階下猶在西階下受其弔故弓弔畢而就子服伯子於門右而問之也免音問居音姬亦為為去聲適音的舍上聲斂去聲曰仲子舍其孫而立其子何也伯子曰仲子亦猶行古之道也昔者文王舍伯邑考而立武王微子舍其孫腯而立衍也夫仲子亦猶行古之道也子游問諸孔子孔子曰否立孫曰弓之問也猶尚也亦猶擬議未定之辭伯邑考文王長子微子舍孫立衍或是殷禮文王之立武王先儒以為權或亦以為遵殷制皆未可知否則以德不以長亦如大王𫝊位季歷之意歟應氏曰檀弓默而不復言子游疑而復求正非夫子明辨以示之孰知舍孫立子之為非乎舍上聲腯徒本切長上聲大音泰復扶又切事親有隱而無犯左右就養無方服勤至死致喪三年事君有犯而無隱左右就養有方服勤至死方喪三年事師無犯無隱左右就養無方服勤至死心喪三年饒氏曰左右音佐佑非也左右即是方養不止飲食之養言或左或右無一定之方子之於親不分職守事事皆當理會無可推托事師如事父故皆無方有方言左不得越右右不得越左有一定之方臣之事君當各盡職守故曰有方在朱氏曰親者仁之所在故有隱而無犯君者義之所故有犯而無隱師者道之所在故無犯無隱也故劉氏曰隱皆以諌言父子主恩犯則為責善而傷恩幾諌而不可犯顔君臣主義隱則是畏威阿容而害義故匡救其惡勿欺也而犯之師生處恩義之閒而師者道之所在諫必不見拒不必犯也過則當疑問不必隱也隱非掩惡之謂若掩惡而不可揚於人則三者皆當然也惟秉史筆者不在此限就養近就而奉養之也致喪極其哀毁之節也方喪比方於親喪而以義並恩也心喪身無衰麻之服而心有哀戚之情所謂若喪父而無服也季武子成寢杜氏之葬在西階之下請合葬焉許之入宫而不敢哭武子曰合葬非古也自周公以來未之有改也吾許其大而不許其細何居命之哭劉氏曰成寢而夷人之墓不仁也不改葬而又請合焉亦非孝也許其合而又命之哭焉矯僞以文過也且寢者所以安其家乃處其家於人之冢上於汝安乎墓者所以安其先乃處其先於人之階下其能安乎皆不近人情非禮明矣葬才浪切文去聲子上之母死而不喪門人問諸子思曰昔者子之先君子喪出母乎曰然子之不使白也喪之何也子思曰昔者吾先君子無所失道道隆則從而隆道汚則從而汚伋則安能為伋也妻者是為白也母不為伋也妻者是不為白也母故孔氏之不喪出母自子思始也子上之母子思出妻也禮為出母齊衰杖期而為父後者無服心喪而已伯魚子上皆為父後禮當不服者而伯魚乃期而猶哭夫子聞之曰甚而後除之此賢者過之之事也子思不使白喪出母正欲用禮耳而門人以先君子之事為問則子思難乎言伯魚之過禮也故以聖人無所失道為對謂聖人之聽伯魚喪出母者以道揆禮而為之隆殺也惟聖人能於道之所當加隆者則從而隆之於道之所當降殺者則從而殺之汚猶殺也是於先王之禮有所斟酌而隨時隆殺以從於中道也我則安能如是哉但為我妻則白當為母服今既不為我妻則白為父後而不當服矣子思是欲守常禮而不欲使如伯魚之加隆也禮為為去聲殺去聲孔子曰拜而后稽顙頽乎其順也稽顙而后拜頎乎其至也三年之喪吾從其至者此言喪拜之次序也拜拜賔也稽顙者以頭觸地哀痛之至也拜以禮賔稽顙以自致謂之順者以其先加敬於人而后盡哀於己為得其序也頎者惻隱之發也謂之至者以其哀常在於親而敬暫施於人為極自盡之道也夫子從其至者亦與其易也寧戚之意向朱子曰拜而后稽顙先以兩手伏地如常然後引首前叩地也稽顙而后拜者開兩手而先以首叩地却交手如常也頎音懇易去聲孔子既得合葬於防曰吾聞之古也墓而不墳今丘也東西南北之人也不可以弗識也於是封之崇四尺孔子父墓在防故奉母喪以合葬墓塋域也封土為壟曰墳東西南北之人言其宦遊無定居也識記也為壟所以為記識一則恐人不知而誤犯一則恐己或忘而難尋故封之髙四尺也識音志孔子先反門人後雨甚句至句孔子問焉曰爾來何遲也曰防墓崩孔子不應三孔子泫然流涕曰吾聞之古不修墓雨甚而墓崩門人修築而後反孔子流涕者自傷其不能謹之於封築之時以致崩圯且言古人所以不修墓者敬謹之至無事於修也應三並去聲泫胡犬切孔子哭子路於中庭有人弔者而夫子拜之既哭進使者而問故使者曰醢之矣遂命覆醢子路死於孔悝之難遂為衛人所醢孔子哭之中庭師友之禮也聞使者之言而覆棄家醢蓋痛子路之禍而不忍食其似也朱子曰子路仕衛之失前輩論之多矣然子路却是見不到非知其非義而茍為也使去聲覆入聲難論並去聲曽子曰朋友之墓有宿草而不哭焉草根陳宿是期年之外可無哭矣子思曰喪三日而殯凡附於身者必誠必信勿之有悔焉耳矣三月而葬凡附於棺者必誠必信勿之有悔焉耳矣附於身者襲斂衣衾之具附於棺者明器用器之屬也生方氏曰必誠謂於死者無所欺必信謂於者無所疑喪三年以為極句亡則弗之忘矣故君子有終身之憂而無一朝之患故忌日不樂喪莫重於三年既葬曰亡中庸曰事亡如事存雖已葬而不忘其親所以為終身之憂而忌日不樂也祭義曰君子有終身之喪忌日之謂也冢宅崩毁出於不意所謂一朝之患惟其必誠必信故無一朝之患也或曰殯葬皆一時事於此一時而不謹則有悔惟其誠信故無此一時不謹之患音樂洛孔子少孤不知其墓殯於五父之衢人之見之者皆以為葬也其慎也蓋殯也問於郰曼父之母然後得合葬於防不知其墓者不知父墓所在也殯於五父之衢者殯母喪也禮無殯於外者今乃在衢先儒謂欲致人疑問或有知者告之也人見柩行於路皆以為葬然以引觀之殯引飾棺以輤葬引飾棺以柳翣此則殯引耳按家語孔子生三嵗而叔梁紇死是少孤也然顔氏之死夫子成立久矣聖人人倫之至豈有終母之世不尋求父葬之地至母殯而猶不知父墓乎且母死而殯於衢路必無室廬而死於道路者不得已之為耳聖人禮法之宗主而忍為之乎馬遷為野合之誣謂顔氏諱而不告鄭注因之以滋後世之惑且如堯舜瞽瞍之事世俗不勝異論非孟子辭而闢之後世謂何此經雜出諸子所記其閒不可據以為實者多矣孟子曰主癰疽與侍人瘠環何以為孔子愚亦謂終身不知父墓何以為孔子乎其不然審矣此非細故不得不辨去少去聲父音甫慎引聲郰音鄒曼音萬鄰有喪舂不相里有殯不巷歌說見曲禮見相去聲見音現後凡某書倣此喪冠不緌冠必有筓以貫之以紘繫筓順頤而下結之曰纓垂其餘於前者謂之緌喪冠不緌蓋去飾也緌如追切與蕤音同有虞氏瓦棺夏后氏堲周殷人棺椁周人牆置翣瓦棺始不衣薪也堲周或謂之土周堲者火之餘燼蓋治土為甎而四周於棺之坎也殷世始為棺椁周人又為飾棺之具蓋彌文矣牆柳衣也栁者聚也諸飾之所聚也以此障柩猶垣牆之障家故謂之牆翣如扇之狀有畫為黼者有畫為黻者有畫雲氣者多寡之數隨貴賤之等如凡夏后華夏肆夏之夏上聲唯春夏之夏字堲音稷翣音歃周人以殷人之棺椁葬長殤以夏后氏之堲周葬中殤下殤以有虞氏之瓦棺葬無服之喪十六至十九為長殤十二至十五為中殤八嵗至十一為下殤七嵗以下為無服之殤生未三月不為殤長上聲夏后氏尚黑大事斂用昏戎事乘驪牲用𤣥殷人尚白大事斂用日中戎事乘翰牲用白周人尚赤大事斂用日出戎事乘騵牲用騂禹以治水之功得天下故尚水之色湯以征伐得天下故尚金之色周之尚赤取火之勝金也大事喪事也驪黑色翰白色易曰白馬翰如騵赤馬而黑鬛尾也騵音元穆公之母卒使人問於曾子曰如之何對曰申也聞諸申之父曰哭泣之哀齊斬之情饘粥之食自天子達布幕衛也縿幕魯也穆公魯君申參之子也厚曰饘稀曰粥幕所以覆於殯棺之上衛以布為幕諸侯之禮也魯以縿為幕蓋僭天子之禮矣齊音咨饘音旃縿音綃晉獻公將殺其世子申生公子重耳謂之曰子蓋言子之志於公乎世子曰不可君安驪姬是我傷公之心也此事詳見左傳重耳申生異母弟即文公也蓋何不也明其讒則姬必誅是使君失所安而傷其心也下重平聲蓋音盍節同傳去聲曰然則蓋行乎世子曰不可君謂我欲弒君也天下豈有無父之國哉吾何行如之重耳又勸其奔他國而申生不從也何行如之言行將何往也使人辭於狐突曰申生有罪不念伯氏之言也以至于死申生不敢愛其死雖然吾君老矣子少國家多難伯氏不出而圖吾君伯氏茍出而圖吾君申生受賜而死再拜稽首乃卒是以為恭世子也狐突申生之𫝊辭猶將去而告違蓋與之永訣也申生自經而死陷父於不義不得為孝但得諡恭而已之疏曰注云伯氏狐突别氏者狐是總氏伯仲是兄弟字字伯者謂之伯氏字仲者謂之仲氏故傳云叔氏其忘諸乎又此下文云叔氏專以禮許人是一人之身字則别為氏也少難並去聲傳去聲魯人有朝祥而莫歌者子路笑之夫子曰由爾責於人終無已夫三年之喪亦已久矣夫子路出夫子曰又多乎哉踰月則其善也朝祥旦行祥祭之禮也朝祥莫歌固為非禮特以禮教衰廢之時而此人獨能行三年之喪故夫子抑子路之笑然終非正禮恐學者致疑故俟子路出乃正言之其意若曰名為三年之喪實則二十五月今已至二十四月矣此去可歌之日又豈多有日月乎哉但更踰月而歌則為善矣蓋聖人於此雖不責之以備禮亦未嘗許之以變禮也莫音暮魯莊公及宋人戰于乘丘縣賁父御卜國為右馬驚敗績公隊佐車授綏公曰末之卜也縣賁父曰他日不敗績而今敗績是無勇也遂死之圉人浴馬有流矢在白肉公曰非其罪也遂誄之士之有誄自此始也乘丘魯地戰在莊公十年縣卜皆氏也凡車右以勇力者為之大崩曰敗績公墮車而佐車授之綏以登是登佐車也佐車副車也綏挽以升車之索也末之卜者言卜國微未無勇也二人遂赴鬬而死圉人掌馬者及浴馬方見流矢中馬股閒之肉則知非二子之罪矣生無爵則死無諡殷大夫以上為爵士雖周爵卑不應諡莊公以義起遂誄其赴敵之功以為諡焉方氏曰誄之為義逹善之實而不欲飾者也諡則因誄之言而别之有誄則有諡矣列乘去聲縣音𤣥賁音奔父音甫隊音墜中去聲别必切曽子寢疾病樂正子春坐於牀下曽元曽申坐於足童子隅坐而執燭病者疾之甚也子春曽子弟子元與申曽子子也童子曰華而睆大夫之簀與子春曰止曽子聞之瞿然曰呼曰華而睆大夫之簀與曾子曰然斯季孫之賜也我未之能易也元起易簀曾元曰夫子之病革矣不可以變幸而至於旦請敬易之曽子曰爾之愛我也不如彼君子之愛人也以德細人之愛人也以姑息吾何求哉吾得正而斃焉斯已矣舉扶而易之反席未安而沒華者畫飾之美好睆者節目之平瑩簀簞也止使童子勿言也瞿然如有所驚也呼者歎而噓氣之聲曰童子再言也革急也變動也彼謂童子也童子知禮以為曽子未嘗為大夫豈可卧大夫之簀曽子識其意故然之且言此魯大夫季孫之賜耳於是必欲易之易之而沒可謂斃於正矣不朱子曰易簀結纓未須論優劣但看古人謹於禮法以死生之變易其所守如此便使人有行一不義殺一不辜而得天下不為之心此是緊要處又曰季孫之賜曾子之受皆為非禮或者因仍習俗嘗有是事而未能正耳但及其疾病不可以變之時一聞人言而必舉扶以易之則非大賢不能矣此事切要處正在此毫釐頃刻之閒睆呼板切簀音責瞿音屨呼音吁革音亟論去聲始死充充如有窮既殯瞿瞿如有求而弗得既葬皇皇如有望而弗至練而慨然祥而廓然疏曰事盡理屈為窮親始死孝子匍匐而哭之心形充屈如急行道極無所復去窮急之容也瞿瞿眼目速瞻之貌如有所失而求覓之不得然也皇皇猶栖栖也親歸草土孝子心無所依託如有望彼來而彼不至也至小祥但慨歎曰月若馳之速也至大祥則情意寥廓不樂而已焉方氏曰下篇述顔丁之居喪則言皇皇於始死言慨於既葬問喪則言皇皇於反哭所言不同者蓋君子有終身之喪思親之心豈有隆殺哉先王制禮略為之節而已故其所言不必同洛瞿音屨樂音殺去聲邾婁復之以矢蓋自戰於升陘始也魯僖公二十一年與邾人戰于升陘魯地也邾師雖勝而死傷者多軍中無衣復者用矢釋云邾人呼邾聲曰婁故曰邾婁夫以盡愛之道禱祠之心孝子不能自已冀其復生也疾而死行之可也兵刃之下肝腦塗地豈有再生之理復之用矢不亦誣乎婁音閭陘音形魯婦人之髽而弔也自敗於臺鮐始也吉時以纚韜髮凶則去纚而露其髻故謂之髽狐鮐之戰在魯襄公四年蓋為邾人所敗也髽不以弔時家家有喪故髽而相弔也喪方氏曰矢所以施於射非所以施於復髽所以施於非所以施於弔因之而弗改則非矣苔髽莊華切臺音狐鮐音南宫縚之妻之姑之喪夫子誨之髽曰爾毋從從爾爾毋扈扈爾蓋榛以為筓長尺而總八寸縚妻夫子兄女也姑死夫子教之為髽從從高也扈扈廣也言爾髽不可太高不可太廣又教以筓總之法筓即簪也吉筓尺二寸喪筓一尺斬衰之筓用箭竹竹之小者也婦為舅姑皆齊衰不杖則當用榛木為筓也束髮謂之總以布為之既束其本末而總之餘者垂於髻後其長八寸也縚音叨從音總扈音户長音仗婦為為去聲孟獻子禫縣而不樂比御而不入夫子曰獻子加於人一等矣孟獻子魯大夫仲孫蔑也禫祭名禫者淡淡然平安之意大祥後閒一月而禫故云中月而禫或云祥月之中者非小記云中一以上而祔亦謂閒一世也禮大夫判縣縣而不樂者但縣之而不作也比御而不入者雖比次婦人之當御者而猶不復寢也一說比及也親喪外除故夫子美之音禫大感切縣音𤣥比畀閒去聲孔子既祥五日彈琴而不成聲十日而成笙歌有子蓋既祥而絲屨組纓有子孔子弟子有若也禮既祥白屨無絇縞冠素紕組之文五采今方祥即以絲為屨之飾以組為冠之纓服之吉者也此二者皆譏其變吉之速然蓋者疑辭恐記者亦是得於傳聞故疑其辭也引孔子之事者以見餘哀未忘也絇音句又音拘死而不弔者三畏厭溺方氏曰戰陳無勇非孝也其有畏而死者乎君子不立巖牆之下其有厭而死者乎孝子舟而不游其有溺而死者乎三者皆非正命故先王制禮在所不弔應氏曰情之厚者豈容不弔但其辭未易致耳若為國而死於兵亦無不弔之理若齊莊公於把梁之妻未嘗不弔也知愚聞先儒言明理可以治懼見理不明者畏懼而不所出多自經於溝瀆此真為死於畏矣似難專指戰陳無勇也或謂鬭很亡命曰畏厭音壓陳音陳子路有姊之喪可以除之矣而弗除也孔子曰何弗除也子路曰吾寡兄弟而弗忍也孔子曰先王制禮行道之人皆弗忍也子路聞之遂除之行道之人皆有不忍於親之心然而遂除之者以先王之制不敢違也太公封於營丘比及五世皆反葬於周君子曰樂樂其所自生禮不忘其本古之人有言曰狐死正丘首仁也太公雖封於齊而留周為太師故死而遂葬於周子孫不敢忘其本故亦自齊而反葬於周以從先人之兆五世親盡而後止也樂生而敦本禮樂之道也生而樂於此豈可死而倍於此哉狐雖微獸丘其所窟藏之地是亦生而樂於此矣故及死而猶正其首以向丘不忘其本也倍本忘初非仁者之用心故以仁目之疏曰周公封魯其子孫不反葬於周者以有次子在周世守其采地春秋周公是也比音畀下樂音洛首去聲伯魚之母死期而猶哭夫子聞之曰誰與哭者門人曰鯉也夫子曰嘻其甚也伯魚聞之遂除之伯魚之母出而死父在為母期而有禫出母則無禫伯魚乃夫子為後之子則於禮無服期可無哭矣猶哭夫子所以歎其甚期音基與平聲嘻音希為母為去聲舜葬於蒼梧之野蓋三妃未之從也季武子曰周公蓋祔天子以四海為家南巡而崩故遂葬蒼梧之野疏云舜長妃娥皇無子次妃女英生商均次妃癸比生二女霄明燭光三妃後皆不從舜之葬此記者言合葬之事古人未有因引季武子之言謂自周公以來始祔葬也書陟方乃死蔡氏曰史記舜崩於蒼梧之野孟子言卒於鳴條未知孰是今零陵九嶷有舜冢云曽子之喪浴於爨室士喪禮浴於適室無浴爨室之文舊說曽子以曽元辭易簀矯之以謙儉然反席未安而沒未必有言及此使果曽子之命為人子者亦豈忍從非禮而賤其親乎此難以臆說斷之當闕之以俟知者玩適音的斷丁切大功廢業或曰大功誦可也業者身所習如學舞學射學琴瑟之類廢之者恐其忘哀也誦者口所習稍暫為之亦可然稱或曰亦未定之辭也子張病召申詳而語之曰君子曰終小人曰死吾今日其庶幾乎申詳子張子也終者對始而言死則澌盡無餘之謂也君子行成德立有始有卒故曰終小人與羣物同朽腐故曰死疾沒世而名不稱為是也子張至此亦自信其近於君子也語去聲幾平聲行為並去聲曾子曰始死之奠其餘閣也與始死以脯醢醴酒就尸牀而奠于尸東當死者之肩使神有所依也閣所以庋置飲食蓋以生時庋閣上所餘脯醢為奠也庋音已又音詭曽子曰小功不為位也者是委巷之禮也子思之哭嫂也為位婦人倡踊申詳之哭言思也亦然委曲也曲巷猶言陋巷細民居於陋巷不見禮儀而鄙朴無節文故譏小功不為位是曲巷中之禮也言思子游之子申詳妻之昆弟也馬氏曰凡哭必為位者所以叙親疏恩紀之差嫂叔疑於無服而不為位故曰無服而為位者帷嫂叔蓋無服者所以逺男女近似之嫌而為位者所以篤兄弟內喪之親子思哭嫂為位婦人倡踊以婦人有相為娣姒之義而不敢以己之無服先之也至於申詳之哭言思亦如子思蓋非禮矣妻之昆弟外喪也而既無服則不得為哭位之主矣記曰妻之昆弟為父後者死哭之適室子為主袒免哭踊夫入門右由是言之哭妻之昆弟以子為主異於嫂叔之喪也以子為主則婦人不當倡踊矣差楚宜切逺去聲為娣為去聲先去聲古者冠縮縫今也衡縫故喪冠之反吉非古也疏曰縮直也殷尚質吉凶冠皆直縫直縫者辟積褶少故一一前後直縫之衡橫也周尚文冠多辟積不一一直縫但多作褶而并橫縫之若喪冠質猶疏辟而直縫是與吉冠相反時人因言古喪冠與吉冠反故記者釋之云非古也止是周世如此耳古則吉凶冠同直縫也音衡音橫辟襞也音璧褶輒并去聲曽子謂子思曰伋吾執親之喪也水漿不入於口者七日子思曰先王之制禮也過之者俯而就之不至焉者跂而及之故君子之執親之喪也水漿不入於口者三日杖而后能起三日中制也七日則幾於滅性矣有扶而起者有杖而起者有面垢而已者跂音弃幾平聲曽子曰小功不稅則是逺兄弟終無服也而可乎稅者日月已過始聞其死追而為之服也大功以上則然小功輕故不稅曽子據禮而言謂若是小功之服不稅則再從兄弟之死在逺地者聞之恆後時則終無服矣其可乎者疏曰此據正服小功也小記曰降而在緦小功則稅之其餘則否稅他外切伯高之喪孔氏之使者未至冉子攝束帛乘馬而將之孔子曰異哉徒使我不誠於伯高攝貸也十箇為束每束五兩蓋以四十尺帛從兩頭吾卷至中則每卷二丈為一箇束帛是十箇二丈今之五匹也乘馬四馬也徒空也伯高不知何人意必與孔子厚者冉子知以財而行禮不知聖人之心則于其誠不于其物也雖若自責之言而實則深責冉子矣使乘並去聲卷音捲伯高死於衛赴於孔子孔子曰吾惡乎哭諸兄弟吾哭諸廟父之友吾哭諸廟門之外師吾哭諸寢朋友吾哭諸寢門之外所知吾哭諸野於野則已疏於寢則已重夫由賜也見我吾哭諸賜氏遂命子貢為之主曰為爾哭也來者句拜之知伯高而來者勿拜也告死曰赴與訃同已太也於馬氏曰兄弟出於祖而內所親者故哭之廟父友聨父而外所親者故哭之廟門外師以成己之德而其親視父故哭諸寢友以輔己之仁而其親視兄弟故哭諸寢門之外至於所知又非朋友之比有相趨者有相揖者有相問者有相見者皆泛交之者也孔子哭伯高以野為太疏而以子貢為主君子行禮其審詳於哭泣之位如此者是其所以表微者歟方氏曰伯高之於孔子非特所知而已由子貢而見故哭於子貢之家且使之為主以明恩之有所由也為子貢而來則弔生之禮在子貢知伯高而來則傷死之禮在伯高或拜或不拜凡以稱其情耳故夫子誨之如此石梁王氏曰為爾哭也來者一句惡音烏為爾為去聲稱去聲曽子曰喪有疾食肉飲酒必有草木之滋焉以為薑桂之謂也喪有疾居喪而遇疾也以其不嗜故加草木之味以為薑桂之謂一句乃記者釋草木之滋亦或曽子稱禮書之言而自釋之歟子夏喪其子而喪其明曽子弔之曰吾聞之也朋友喪明則哭之曽子哭子夏亦哭曰天乎豫之無罪也曽子怒曰商女何無罪也吾與女事夫子於洙泗之閒退而老於西河之上使西河之民疑女於夫子爾罪一也喪爾親使民未有聞焉爾罪二也喪爾子喪爾明爾罪三也而曰爾何無罪與子夏投其杖而拜曰吾過矣吾過矣吾離羣而索居亦已久矣以哭甚故喪明也洙泗魯二水名西河子夏所居索散也久不親友故有罪而不自知張子曰子夏喪明必是親喪之時尚强壯其子之喪氣漸衰故喪明然而曽子之責安得辭也疑女於夫子者子夏不推尊夫子使人疑夫子無以異於子夏非如曽子推尊夫子使人知尊聖人也方氏曰子夏不尊於師而尊於己不隆於親而隆於子猶以為無罪此曽子所以怒之也然君子以友輔仁子夏之至於三罪者亦由離朋友之羣而散居之久耳以離羣故散居也音而喪喪明喪爾之喪去聲餘如字女汝離去聲夫晝居於內問其疾可也夜居於外弔之可也是故君子非有大故不宿於外非致齊也非疾也不晝夜居於內內者正寢之中外謂中門外也晝而居內似有疾夜而居外似有喪宎應氏曰致齊居內非在房闥之中蓋亦端居深處於奧之內耳宎齊音齊音窈高子臯之執親之喪也泣血三年未嘗見齒君子以為難子臯名柴孔子弟子由疏曰人涕淚必因悲聲而出血出則不聲也子臯悲無聲其涕亦出如血之出故云泣血人大笑則露齒本中笑則露齒微笑則不見齒見音現衰與其不當物也寧無衰齊衰不以邊坐大功不以服勤疏曰物謂升縷及法制長短幅數也邊坐偏倚也喪服宜敬坐起必正不可著衰而偏倚也齊衰輕既不倚斬重不言可知大功雖輕亦不可著衰服而為勤勞之事也衰馬氏曰衰不當物則亂先王之制而後世疑其傳無則禮雖不行而其制度定于一猶可以識之故曰與其不當物也寧無衰衰音催當去聲齊音咨著音勺孔子之衛遇舊館人之喪入而哭之哀出使子貢說驂而賻之子貢曰於門人之喪未有所說驂說驂於舊館無乃已重乎夫子曰豫鄉者入而哭之遇於一哀而出涕豫惡夫涕之無從也小子行之舊館人舊時舍館之主人也駕車者中兩馬為服馬兩旁各一馬為驂馬遇一哀而出涕情亦厚矣情厚者禮不可薄故解脫驂馬以為之賻凡以稱情而已客行無他財貨故也惡夫涕之無從者從自也今若不賻則是於死者無故舊之情而此涕為無自而出矣惡其如此所以必當行賻禮也舊說孔子遇主人一哀而出涕謂主人見孔子來而哀甚是以厚恩待孔子故孔子為之賻然上文既曰入而哭之哀則又何必迂其說而以為遇主人之哀乎說音脫鄉去聲惡去聲稱去聲為之為去聲孔子在衛有送葬者而夫子觀之曰善哉為喪乎足以為法矣小子識之子貢曰夫子何善爾也曰其往也如慕其反也如疑子貢曰豈若速反而虞乎子曰小子識之我未之能行也往如慕反如疑此孝子不死其親之至情也子貢以為如疑則反遲不若速反而行虞祭之禮是知其禮之常而不察其情之至矣夫子申言小子識之且曰我未之能行則此豈易言哉聲識音志易去顔淵之喪饋祥肉孔子出受之入彈琴而后食之彈琴而後食者蓋以和平之聲散感傷之情也孔子與門人立拱而尚右二三子亦皆尚右孔子曰二三子之嗜學也我則有姊之喪故也二三子皆尚左吉事尚左陽也凶事尚右隂也此蓋拱立而右手在上也孔子蚤作負手曳杖消搖於門歌曰泰山其頽乎梁木其壞乎哲人其萎乎既歌而入當户而坐子貢聞之曰泰山其頽則吾將安仰梁木其壞哲人其萎則吾將安放夫子殆將病也遂趨而入作起也負手曳杖反手卻後以曳其杖也消搖寬縱自適之貌泰山為衆山所仰梁木亦衆木所仰而放者猶哲人為衆人所仰望而放效也放上聲夫子曰賜爾來何遲也夏后氏殯於東階之上則猶在阼也殷人殯於兩楹之閒則與賔主夾之也周人殯於西階之上則猶賔之也而丘也殷人也豫疇昔之夜夢坐奠於兩楹之閒夫明王不興而天下其孰能宗豫豫殆將死也蓋寢疾七日而沒猶在阼猶賔之者孝子不忍死其親殯之於此示猶在阼階以為主猶在西階以為賔客也在兩楹閒則是主與賔夾之故言與而不言猶也孔子其先宋人成湯之後故自謂殷人疇發語之辭昔之夜猶言昨夜也夢坐於兩楹之閒而見饋奠之事知是凶徵者以殷禮殯在兩楹閒孔子以殷人而享殷禮故知將死也又自解夢奠之占云今日明王不作天下誰能尊己而使南面坐於尊位乎此必殯之兆也自今觀之萬世王祀亦其應矣孔子之喪門人疑所服子貢曰昔者夫子之喪顔淵若喪子而無服喪子路亦然請喪夫子若喪父而無服以後章二三子絰而出言之此所謂無服蓋謂弔服加麻也疏云士弔服疑衰麻謂環絰也五服絰皆兩股惟環絰一股後章從母之夫疏云凡弔服不得稱服方氏曰若喪父而無服所謂心喪也從去聲孔子之喪公西赤為志焉飾棺牆置翣設披周也設崇殷也綢練設旐夏也公西氏赤名字子華孔子弟子也三疏曰孔子之喪公西赤以飾棺榮夫子故為盛禮備王之制以章明志識焉於是以素為禇禇外加牆車邉置翣恐柩車傾虧而以繩左右維持之此皆周之制也其送葬乘車所建旌旗刻繒為崇牙之飾此則殷制又綢盛旌旗之竿以素錦於杠首設長尋之旐此則夏禮也詩虡業維樅疏云懸鐘磬之處以采色為大牙其狀隆然謂之崇牙練素錦也緇布廣終幅長八尺旐之制也披彼義切綢音叨旐直小切識音志虡音巨樅音蹤子張之喪公明儀為志焉褚幕丹質蟻結于四隅殷士也疏曰褚者覆棺之物若大夫以上其形似幄士則無褚公明儀尊其師故特為褚不得為幄但似幕形故云褚幕以丹質之布而為之也又於褚之四角畫蚍蜉之形交結往來故云蟻結于四隅此殷禮士葬飾也覆云聲子夏問於孔子曰居父母之仇如之何夫子曰寢苫枕干不仕弗與共天下也遇諸市朝不反兵而鬭不反兵者不反而求兵言恆以兵器自隨苫詩占切枕去聲朝音潮曰請問居昆弟之仇如之何曰仕弗與共國銜君命而使雖遇之不鬭曰請問居從父昆弟之仇如之何曰不為魁主人能則執兵而陪其後疏曰朝在宫門之內閽人掌中門之禁兵器但不得入中門耳其大詢衆庶在臯門之內則得入也設朝或在野外或在縣鄙鄉遂但有公事之處皆謂之朝兵者亦謂佩刀以上不必要是矛㦸也云方氏曰市朝猶不反兵則無所往而不執兵矣曲禮兄弟之讎不反兵此言遇之不鬬者彼據不仕者言之耳使從並去聲孔子之喪二三子皆絰而出羣居則絰出則否弔服如麻者出則變之今出外而不免絰所以隆師也羣者諸弟子相為朋友之服也儀禮注云朋友雖無親有同道之恩相為服緦之絰帶亦弔服也故出則免之易墓非古也疏曰易謂芟治草木不使荒穢古者殷以前墓而不墳不易治也易音異子路曰吾聞諸夫子喪禮與其哀不足而禮有餘也不若禮不足而哀有餘也祭禮與其敬不足而禮有餘也不若禮不足而敬有餘也有其禮而無其財則禮或有所不足哀敬則可自盡也此夫子反本之論亦寧戚之意曽子弔於負夏主人既祖填池推柩而反之降婦人而后行禮從者曰禮與曽子曰夫祖者且也且胡為其不可以反宿也劉氏曰負夏衛地也葬之前一日曽子往弔時主人已祖奠而婦人降在兩階之閒矣曽子至主人榮之遂徹奠推柩而反向內以受弔示死者將出行遇賔至而為之暫反也亦事死如事生之意然非禮矣柩既反則婦人復升堂以避柩至明日乃復還柩向外降婦人於階閒而反行遣奠之禮故從者見柩初已遷而復推反之婦人已降而又升堂皆非禮故問之而曽子答之云祖者且也是且遷柩為將行之始未是實行又何為不可復反越宿至明日乃還柩遣奠而遂行乎疏謂其見主人榮已不欲指其錯失而紿說答從者此以衆人之心窺大賢也事之有無不可知其義亦難强解或記者有遺誤也所以徹奠者奠在柩西欲推柩反之故必先徹而後可旋轉也婦人降階閒亦以奠在車西故立車後今柩反故亦升避也填音奠池音徹推他回切從去聲與平聲復遣並去聲從者又問諸子游曰禮與子游曰飯於牖下小斂於户內大斂於阼殯於客位祖於庭葬於墓所以即逺也故喪事有進而無退曽子聞之曰多矣乎豫出祖者從者疑曽子之言故又請問於子游也飯於牖下者尸沐浴之後以米及貝實尸之口中也時尸在西室牖下南首也士喪禮小斂衣十九稱大斂三十稱斂者包裹斂藏之也小斂在户之內大斂出在東階未忍離其為主之位也主人奉尸斂于棺則在西階矣掘肂於西階之上肂陳也謂陳尸於坎也置棺于肂中而塗之謂之殯及啓而將葬則設祖奠於祖廟之中庭而後行自牖下而户內而阼而客位而庭而墓皆一節逺於一節此謂有進而往無退而還也豈可推柩而反之乎多矣乎豫出祖者多猶勝也曽子聞之方悟已說之非乃言子游所說出祖之事勝於我之所說出祖也飯上聲首稱離並去聲曽子襲裘而弔子游裼裘而弔曽子指子游而示人曰夫夫也為習於禮者如之何其裼裘而弔也主人既小斂袒括髮子游趨而出襲裘帶絰而入曽子曰我過矣我過矣夫夫是也疏曰凡弔喪之禮主人未變服之前弔者吉服吉服者羔裘𤣥冠緇衣素裳又袒去上服以露裼衣此裼裘而弔是也主人既變服之後弔者雖著朝服而加武以絰武吉冠之卷也又掩其上服若是朋友又加帶此襲裘帶絰而入是也吉方氏曰曽子徒知喪事為凶而不知始死之時尚從此所以始非子游而終善之也下夫如字下同子夏既除喪而見豫之琴和之而不和彈之而不成聲作而曰哀未忘也先王制禮而弗敢過也子張既除喪而見豫之琴和之而和彈之而成聲作而曰先王制禮不敢不至焉均為除喪而琴有和不和之異者蓋子夏是過之者俯而就之出於勉强故餘哀未忘而不能成聲子張是不至者跂而及之故哀已盡而能成聲也和見音現豫上聲上和去聲下如字下同强上聲司冦惠子之喪子游為之麻衰牡麻絰文子辭曰子辱與彌牟之弟游又辱為之服敢辭子游曰禮也惠子衛將軍文子彌牟之弟惠子廢適子虎而立庶子故子游特為非禮之服以譏之亦檀弓免公儀仲子之意也麻衰以吉服之布為衰也牡麻絰以雄麻為絰也麻衰乃吉服十五升之布輕於弔服弔服之絰一股而環之今用牡麻絞絰與齊衰絰同矣鄭注云重服指絰而言也文子初言辱為之服敢辭者辭其服也為去聲適嫡同文子退反哭子游趨而就諸臣之位文子又辭曰子辱與彌牟之弟游又辱為之服又辱臨其喪敢辭子游曰固以請文子退扶適子南面而立曰子辱與彌牟之弟游又辱為之服又辱臨其喪虎也敢不復位子游趨而就客位次言敢辭者辭其立於臣位也此時尚未喻子游之意及子游言固以請則文子覺其譏矣於是扶適子正喪主之位焉而子游之志達矣趨就客位禮之正也東疏曰大夫之賔位在門東近北家臣位亦在門而南近門並皆北向適嫡同將軍文子之喪既除喪而后越人來弔主人深衣練冠待于廟垂涕洟子游觀之曰將軍文氏之子其庶幾乎亡於禮者之禮也其動也中將軍文子即彌牟也主人文子之子也禮無弔人於除喪之後者亦無除喪後受人之弔者深衣吉凶可以通用小祥練服之冠不純吉亦不純凶廟者神主之所在待而不迎受弔之禮也不哭而垂涕哭之時已過而哀之情未忘也庶幾近也子游善其處禮之變故曰文氏之子其近于禮乎雖無此禮而為之禮其舉動皆中節矣曰疏曰深衣即閒傳所言麻衣也制如深衣緣之以布麻衣緣之以素曰長衣緣之以采曰深衣練冠者祭前之冠若祥祭則縞冠也始死至練祥來弔是有文之禮祥後來弔是無文之禮言文氏之子庶幾堪行乎無於禮文之禮也動舉也中當於禮之變節也亡無通中去聲幼名冠字五十以伯仲死諡周道也疏曰凡此之事皆周道也又殷以上有生號仍為死後之稱更無別諡堯舜禹湯之例是也周則死後别立諡朱子曰儀禮賈公彥疏云少時便稱伯某甫至五十乃去某甫而專稱伯仲此說為是如今人於尊者不敢字之而曰幾丈之類冠去聲絰也者實也麻在首在要皆曰絰分言之則首曰絰要曰帶絰之言實明孝子有忠實之心也首絰象緇布冠之缺項要絰象大帶又有絞帶象革帶齊衰以下用布朱子曰首絰大一扼是拇指與第二指一圍要絰較小絞帶又小於要絰要絰象大帶兩頭長垂下絞帶象革帶一頭有彄子以一頭串於中而束之扼要平聲於革切掘中霤而浴毁竈以綴足疏曰中霤室中也死而掘室中之地作坎以床架坎上尸於牀上浴令浴汁入坎也死人冷强足辟戾不可著屨故用毁竈之甓連綴死人足令直可著屨也綴音拙及葬毁宗躐行出于大門殷道也學者行之疏曰毁宗毁廟也殷人殯於廟至葬柩出毁廟門西邊牆而出于大門行神之位在廟門西邊當所毁宗之外生時出行則為壇幣告行神告竟車躐行壇上而出使道中安穩如在壇今向毁宗處出仍得躐行此壇如生時之出也學於孔子者行之效殷禮也子柳之母死子碩請具子柳曰何以哉子碩曰請粥庶弟之母子柳曰如之何其粥人之母以葬其母也不可既葬子碩欲以賻布之餘具祭器子柳曰不可吾聞之也君子不家於喪請班諸兄弟之貧者子柳魯叔仲皮之子子碩之兄也具謂喪事合用之器物也何以哉言何以為用乎謂無其財也鄭云粥謂嫁之也妾賤取之曰買布錢也不家於喪惡因死者而為利也班猶分也不粥庶弟之母者義也班兄弟之貧者仁也夫欲粥庶母以治葬則乏於財可知矣而不家於喪之言確然不易古人之安貧守禮蓋如此惡粥音育去聲君子曰謀人之軍師敗則死之謀人之邦邑危則亡之應氏曰衆死而義不忍獨生焉得而不死國危而身不可獨存焉得而不亡公叔文子升於瑕丘蘧伯玉從文子曰樂哉斯丘也死則我欲葬焉蘧伯玉曰吾子樂之則瑗請前二子皆衛大夫文子名拔伯玉名瑗子劉氏曰伯玉之請前蓋始從行於文子之後及聞文之言而惡其將欲奪人之地自為身後計遂譏之曰吾子樂此則我請前行以去子矣示不欲與聞其事也可謂長於風喻者矣從去聲樂音洛瑗于願切辨人有其母死而孺子泣者孔子曰哀則哀矣而難為繼也夫禮為可傳也為可繼也故哭踊有節辨地名孺子泣者其聲若孺子無長短高下之節也聖人制禮期於使人可傳可繼故哭踊皆有其節若無節則不可傳而繼矣叔孫武叔之母死既小斂舉者出句尸出户句袒句且投其冠括髮子游曰知禮禮始死將斬衰者筓纚將齊衰者素冠小斂畢而徹帷主人括髮袒于房婦人髽于室舉者出舉尸以出也括髮當在小斂之後尸出堂之前主人為將奉尸故袒而括髮耳今武叔待尸出户然後袒而去冠括髮失禮節矣故注以子游知禮之言為嗤之也馮氏曰經文作户出户上户字乃尸字之訛也鄭注云尸出户乃變服義甚明然注文尸亦訛為户遂解不通為將為去聲奉去並上聲扶君卜人師扶右射人師扶左君薨以是舉君疾時僕人之長扶其右體射人之長扶其左體此二人皆平日贊正服位之人故君既薨遇遷尸則仍用此人也方氏釋師為衆應氏以卜人為卜筮之人卜讀為僕從母之夫舅之妻二夫人相為服君子未之言也或曰同爨緦從母母之姊妹舅母之兄弟從母夫於舅妻無服所以禮經不載故曰君子未之言時偶有甥至外家見此二人相依同居者有喪而無文可據於是或人為同爨緦之說以處之此亦原其情之不可已而極禮之變焉耳或問從母之夫舅之妻皆無服何也朱子曰先王制禮父族四故由父而上為族曾祖父緦麻姑之子姊妹之子女子子之子皆由父而推之也母族三母之父母之母母之兄弟恩止於舅故從母之夫舅之妻皆不為服推不去故也妻族二妻之父妻之母乍看似乎雜亂無紀子細看則皆有義存焉為從去聲上夫如字下夫音扶為去聲處上聲為服去聲喪事欲其縱縱爾吉事欲其折折爾故喪事雖遽不陵節吉事雖止不怠故騷騷爾則野鼎鼎爾則小人君子蓋猶猶爾縱縱給於趨事之貌折折從容中禮之貌喪事雖急遽而不可陵躐其節次吉事雖有立而待事之時而不可失於怠惰若騷騷而太疾則鄙野矣鼎鼎而太舒則小人之為矣猶猶而得緩急之中君子行禮之道也從縱音總折音提遽其據切平聲中去聲喪具君子恥具一日二日而可為也者君子弗為也喪具棺衣之屬君子恥於早為之而畢具者嫌不以久生期其親也然六十嵗制七十時制八十月制九十日修蓋慮夫倉卒之變也一日二日可辦之物則君子不豫為之所謂絞襟衾冒死而后制者也卒音猝絞音爻襟音琴喪服兄弟之子猶子也蓋引而進之也嫂叔之無服也蓋推而逺之也姑姊妹之薄也蓋有受我而厚之者也方氏曰兄弟之子雖異出也然在恩為可親故引而進之與子同服嫂叔之分雖同居也然在義為可嫌故推而逺之不相為服姑姊妹在室與兄弟姪皆不杖期出適則皆降服大功而從輕者蓋有受我者服為之重故也言其夫受之而服為之杖期以厚之故於本宗相為皆降一等也為推他回切逺去聲分音問相為服為並去聲食於有喪者之側未嘗飽也應氏曰食字上疑脫孔子字曽子與客立於門側其徒趨而出曽子曰爾將何之曰吾父死將出哭於巷曰反哭於爾次曽子北面而弔焉其徒門弟子也次其人所寓之館舍也士喪禮主人西面賔在門東北面此曽子所以北面而弔之也孔子曰之死而致死之不仁而不可為也之死而致生之不知而不可為也是故竹不成用瓦不成味木不成斫琴瑟張而不平竽笙備而不和有鐘磬而無簨虡其曰明器神明之也劉氏曰之往也之死謂以禮往送於死者也往於死者而極以死者之禮待之是無愛親之心為不仁故不可行也往於死者而極以生者之禮待之是無燭理之明為不知故亦不可行也此所以先王為明器以送死者竹器則無縢緣而不成其用瓦器則粗質而不成其黑光之沫木器則朴而不成其雕斫之文琴瑟則雖張絃而不平不可彈也竽笙雖備具而不和不可吹也雖有鐘磬而無懸挂之簨虡不可擊也凡此皆不致死亦不致生而以有知無知之閒待死者故備物而不可用也備物則不致死不可用則亦不致生其謂之明器者蓋以神明之道待之也知去聲味音沫簨音筍虡音巨緣去聲有子問於曾子曰問喪於夫子乎曰聞之矣喪欲速貧死欲速朽有子曰是非君子之言也曾子曰參也聞諸夫子也有子又曰是非君子之言也曾子曰參也與子游聞之有子曰然然則夫子有為言之也曾子以斯言告於子游子游曰甚哉有子之言似夫子也昔者夫子居於宋見桓司馬自為石椁三年而不成夫子曰若是其靡也死不如速朽之愈也死之欲速朽為桓司馬言之也仕而失位曰喪桓司馬即桓魋靡侈也問音聞喪為並去聲南宫敬叔反必載寶而朝夫子曰若是其貨也喪不如速貧之愈也喪之欲速貧為敬叔言之也敬叔魯大夫孟僖子之子仲孫閲也嘗失位去魯後得反載寶而朝欲行賂以求復位也曽子以子游之言告於有子有子曰然吾固曰非夫子之言也曽子曰子何以知之有子曰夫子制於中都四寸之棺五寸之椁以斯知不欲速朽也昔者夫子失魯司寇將之荆蓋先之以子夏又申之以冉有以斯知不欲速貧也定公九年孔子為中都宰制棺椁之法制也四寸五寸厚薄之度將適楚而先使二子繼往者蓋欲觀楚之可仕與否而謀其可處之位歟陳莊子死赴於魯魯人欲勿哭繆公召縣子而問焉縣子曰古之大夫束修之問不出竟雖欲哭之安得而哭之大夫訃於他國之君曰君之外臣寡大夫某死莊子齊大夫名伯齊强魯弱不容略其赴縣子名知禮故召問之修脯也十脡為束問遺也為人臣者無外交不敢二君也故雖束修微禮亦不以出竟縣音𤣥竟音境遺去聲今之大夫交政於中國雖欲勿哭焉得而弗哭且臣聞之哭有二道有愛而哭之有畏而哭之公曰然然則如之何而可縣子曰請哭諸異姓之廟於是與哭諸縣氏交政於中國言當時君弱臣强大夫專盟㑹之事以與國君相交接也此變禮之由也愛之哭出於不能已畏之哭出於不得已哭伯高於賜氏義之所在也哭莊子於縣氏勢之所迫也仲憲言於曽子曰夏后氏用明器示民無知也殷人用祭器示民有知也周人兼用之示民疑也曽子曰其不然乎其不然乎夫明器鬼器也祭器人器也夫古之人胡為而死其親乎仲憲孔子弟子原憲也示民無知者使民知死者之無知也為其無知故以不堪用之器送之為其有知故以祭器之可用者送之疑者不以為有知亦不以為無知也然周禮惟大夫以上得兼用二器士惟用鬼器也曽子以其言非乃曰其不然乎再言之者甚不然之也蓋明器祭器固是人鬼之不同夏殷所用不同者各是時王之制文質之變耳非謂有知無知也若如憲言則夏后氏何為而忍以無知待其親乎其石梁王氏曰三代送葬之具質文相異故所用不同意不在於無知有知及示民疑也仲憲之言皆非曽子非之末獨譏其說夏后明器蓋舉其失之甚者也為其為去聲公叔木有同母異父之昆弟死問於子游子游曰其大功乎狄儀有同母異父之昆弟死問於子夏子夏曰我未之前聞也魯人則為之齊衰狄儀行齊衰今之齊衰狄儀之問也公叔木衛公叔文子之子同父母之兄弟期則此同母而異父者當降而為大功也禮經無文故子游以疑辭答之魯人齊衰三月之服行之久矣故子夏舉以答狄儀而記者云因狄儀此問而今皆行之也此記二子言禮之不同鄭氏曰大功是木式樹切子思之母死於衛柳若謂子思曰子聖人之後也四方於子乎觀禮子蓋慎諸子思曰吾何慎哉吾聞之有其禮無其財君子弗行也有其禮有其財無其時君子弗行也吾何慎哉柳若衛人伯魚卒其妻嫁於衛有其禮謂禮所得為者然無財則不可為禮時為大有禮有財而時不可為則亦不得為之也蓋音盍縣子瑣曰吾聞之古者不降上下各以其親滕伯文為孟虎齊衰其叔父也為孟皮齊衰其叔父也縣子名瑣禮疏曰古者殷時也周以貴降賤以適降庶惟不降正耳而殷世以上雖貴不降賤也上下各以其親不降之事也上謂旁親族曽祖從祖及伯叔之班下謂從子從孫之流彼雖賤不以己尊降之猶各隨本屬之親輕重而服之故云上下各以其親滕國之伯名文為孟虎著齊衰之服者虎是文之叔父也又為孟皮著齊衰之服者文是皮之叔父也言滕伯上為叔父下為兄弟之子皆著齊衰也為去聲從去聲后木曰喪吾聞諸縣子曰夫喪不可不深長思也買棺外內易我死則亦然后木魯孝公子惠伯鞏之後內馮氏曰此條重在不可不深長思一句買棺之時外皆要精好此是孝子當為之事非是父母豫所屬託而曰我死則亦然記禮者譏失言也易音異屬音燭曽子曰尸未設飾故帷堂小斂而徹帷仲梁子曰夫婦方亂故帷堂小斂而徹帷始死去死衣用斂衾覆之以俟浴既復之後楔齒綴足畢具脯醢之奠事雖小定然尸猶未襲斂也故曰未設飾於是設帷於堂者不欲人褻之也故小斂畢乃徹帷仲梁子謂夫婦方亂者以哭位未定也二子各言禮意鄭云斂者動搖尸帷堂為人褻之言方亂非也仲梁子魯人去上聲覆去聲楔音屑為去聲小斂之奠子游曰於東方曽子曰於西方斂斯席矣小斂之奠在西方魯禮之末失也疏曰儀禮小斂之奠設於東方奠又無席魯之衰末奠於西方而又有席曽子見時如此將以為禮故云小斂於西方斯此也其斂之時於此席上而設奠矣故記者正之云小斂之奠所以在西方是魯人行禮末世失其義也今按儀禮布席于户內注云有司布斂席也在小斂之前及陳大斂衣奠則云奠席在饌北斂席在其東注云大斂奠而有席彌神之也據此則小斂奠無席縣子曰綌衰繐裳非古也方氏曰葛之粗而卻者謂之綌布之細而疏者謂之繐五服一以麻各有升數若以綌為衰以繐為裳則取其輕涼而已非古制也綌去逆切繐音嵗子蒲卒哭者呼滅子臯曰若是野哉哭者改之滅子蒲之名也復則呼名哭豈可呼名也野哉言其鄙野而不達於禮也子臯孔子弟子高柴杜橋之母之喪宫中無相以為沽也疏曰沽粗略也孝子喪親悲迷不復自知禮節事儀皆須人相導而杜橋家母死宫中不立相侍故時人謂其於禮為粗略也相去聲沽音古喪親喪去聲復去聲夫子曰始死羔裘𤣥冠者易之而已羔裘𤣥冠夫子不以弔疏曰養疾者朝服羔裘𤣥冠即朝服也始死則去朝服著深衣時有不易者又有小斂後羔裘弔者記者因引孔子行禮之事言之著朝音潮去上聲音勺子游問喪具夫子曰稱家之有亡子游曰有無惡乎齊夫子曰有毋過禮茍亡矣斂首足形還葬縣棺而封人豈有非之者哉喪具送終之儀物也惡乎齊言何以為厚薄之劑量也毋過禮不可以富而踰禮厚葬也還葬謂斂畢即葬不殯而待月日之期也縣棺而封謂以手縣繩而下之不設碑繂也人不非之者以無財則不可備禮也稱去聲亡如字下同惡音烏齊去聲還音旋縣音𤣥封音窆司士賁告於子游曰請襲於牀子游曰諾縣子聞之曰汰哉叔氏專以禮許人賁司士之名也禮始死廢牀而置尸於地及復而不生則尸復登牀襲者斂之以衣也沐浴之後商祝襲祭服褖衣蓋布於牀上也飯含之後遷尸於襲上而衣之襲於牀者禮也後世禮失而襲於地則褻矣司士知禮而請於子游子游不稱禮而答之以諾所以起縣子之譏也汰矜大也言凡有咨問禮事者當據禮答之子游專輒許諾則如禮自己出矣是自矜大也叔氏子游字切賁音奔縣音𤣥尸復復扶又褖音彖衣之衣去聲宋襄公葬其夫人醯醢百甕曽子曰既曰明器矣而又實之夏禮專用明器而實其半虛其半殷人全用祭器亦實其半周人兼用二器則實人器而虛鬼器孟獻子之喪司徒旅歸四布夫子曰可也疏曰送終既畢賻布有餘其家臣司徒承主人之意使旅下士歸還四方賻主人之泉布時人皆貪而獻子家獨能如此故夫子曰可也善其能廉左傳叔孫氏之司馬鬷戾是家臣亦有司徒司馬也傳去聲讀賵曽子曰非古也是再告也車馬曰賵賵所以助主人之送葬也既受則書其人名與其物於方版葬時柩將行主人之史請讀此方版所書之賵蓋於柩東當前東西面而讀之古者奠之而不讀周則既奠而又讀焉故曽子以為再告也成子高寢疾慶遺入請曰子之病革矣如至乎大病則如之何成子高齊大夫國伯高父諡成也遺慶封之族革與亟同急也大病死也諱之之辭遺去聲革音亟入聲子高曰吾聞之也生有益於人死不害於人吾縱生無益於人吾可以死害於人乎哉我死則擇不食之地而葬我焉不食之地謂不耕墾之土子夏問諸夫子曰居君之母與妻之喪居處言語飲食衎爾君母君妻雖皆小君皆服齊衰不杖期然恩義則淺矣故居其喪則自處如此衎爾和適之貌此章以文勢推之喪下當有如之何夫子曰字舊說謂記者之略亦或闕文歟又否則問當作聞旦處上聲衎苦切賔客至無所館夫子曰生於我乎館死於我乎殯生既館之死則當殯其應氏曰朋友以義合謂之賔客者以自逺方而來也國子高曰葬也者藏也藏也者欲人之弗得見也是故衣足以飾身棺周於衣椁周於棺土周於椁反壤樹之哉國子高即成子高也深疏曰子高之意人死可惡故備飾以衣衾棺椁欲其邃不使人知今乃反更封壤為墳而種樹以標之哉國子意在於儉非周禮孔子之喪有自燕來觀者舍於子夏氏子夏曰聖人之葬人與人之葬聖人也子何觀焉延陵季子之葬其子夫子尚往觀之今孔子之葬燕人來觀亦其宜也然子夏之意以為聖人葬人則事皆合禮人之葬聖人則未必皆合於禮也故語之曰子以為聖人之葬人乎乃人之葬聖人也又何觀焉蓋謙辭也聲燕與並平語去聲昔者夫子言之曰吾見封之若堂者矣見若坊者矣見若覆夏屋者矣見若斧者矣從若斧者焉馬鬛封之謂也今一日而三斬板而已封尚行夫子之志乎哉此言封土有此四者之形封築土為墳也若堂者如堂之基四方而髙也坊堤也若坊者上平旁殺而南北長也若覆夏屋者旁廣而卑也若斧者上狹如刃較之上三者皆用功力多而難成此則儉而易就故俗謂之馬鬛封馬鬃鬛之上其肉薄封形似之也今一日者謂今封築孔子之墳不假多時一日之閒三次斬板即封畢而已止矣其法側板於坎之兩旁而用繩以約板乃內土於內而築之土與板平則斬斷約板之繩而升此板於所築土之上又實土於其中而築之如此者三而墳成矣故云三斬板而已封也尚庶幾也乎哉疑辭亦謙不敢質言也音坊音防覆方救切去聲內土內納婦人不葛帶禮婦人之帶牡麻結本卒哭文夫去麻帶服葛帶而首絰不變婦人以葛為首絰以易去首之麻絰而麻帶不變所謂不葛帶也既練則男子除絰婦人除帶婦人輕首重要故也然此謂婦人居齊斬之服者如此若大功以下輕者至卒哭則並變為葛與男子同有薦新如朔奠朔奠者月朔之奠也未葬之時大夫以上朔望皆有奠士則朔而已如得時新之味或五穀新熟而薦之則其禮亦如朔奠之儀也既葬各以其服除三月而葬葬而虞虞而卒哭親重而當變麻衰者變之其當除者即自除之不俟主人卒哭之變也池視重霤疏曰池者栁車之池也重霤者屋之承霤也以木為之承於屋簷水霤入此木中又從木中而霤於地故云重霤也天子之屋四注四面皆有重霤諸侯四注而重霤去後大夫惟前後二士惟一在前生時屋有重霤故死時栁車亦象宫室而設池於車覆鱉甲之下牆帷之上蓋織竹為之形如籠衣以青布以承鱉甲名之曰池以象重霤也方面之數各視生時重霤重平聲君即位而為椑嵗一漆之藏焉疏曰君諸侯也人君無論少長體尊物備即位即造為親尸之棺蓋杝棺也漆之堅强甓甓然故名椑每年一漆示如未成也藏焉者其中不欲空虛如急有待故藏物於中一說不欲令人見故藏之椑音僻論少並去聲長上聲杝音移復楔齒綴足飯設飾帷堂並作始死招魂之後用角柶拄尸之齒令開得飯含時不閉又用燕几拘綴尸之兩足令直使著屨時不辟戾也飯者實米與貝于尸口中也設飾尸襲斂也帷堂堂上設帷也作起為也復至帷堂六事一時並起故云並作也儀禮亦總見一圖音楔音屑綴拙父兄命赴者疏曰生時與他人有恩識者今死則其家宜使人往相赴告士喪禮孝子自命赴者若大夫以上則父兄命之也君復於小寢大寢小祖大祖庫門四郊天子之郭門曰臯門明堂位言魯之庫門即天子臯門是庫門者郭門也疏曰君王侯也前曰廟後曰寢室有東西廂曰廟無東西廂有室曰寢小寢者高祖以下寢也王侯同大寢天子始祖之寢諸侯太祖之寢也小祖者高祖以下廟也王侯同大祖者天子始祖之廟諸侯太祖之廟也馬氏曰寢所居處之地祖所有事之地門所出入之地郊所嘗至之地君復必於此者蓋魂氣之往亦未離生時熟習之地也觀此則死生之說可知矣舊今按馬氏以小寢大寢為燕寢正寢與說異喪不剝奠也與祭肉也與剝者不巾覆也脯醢之奠不惡塵埃故可無巾覆凡覆之者必其有祭肉者也既殯旬而布材與明器材為椁之木也布者分列而暴乾之也殯後旬日即治此事禮獻材于殯門外注云明器之材此云材與明器者蓋二者之材皆乾之也暴入聲乾音干朝奠日出夕奠逮日逮日及日之未落也時方氏曰朝奠以象朝時之食夕奠以象夕之食孝子事死如事生也父母之喪哭無時使必知其反也未殯哭不絶聲殯後雖有朝夕哭之時然廬中思憶則哭小祥後哀至則哭此皆哭無時也使者受君之任使也小祥之後君有事使之不得不行然反必祭告俾親之神靈知其已反亦出必告反必面之義也必告告音谷練練衣黃裏縓緣疏曰練小祥也小祥而著練冠練中衣故曰練也練衣者以練為中衣黃裏者黃為中衣裏也正服不可變中衣非正服但承衰而已縓淺絳色緣謂中衣同領及褎之緣也縓七眷切緣去聲著音勺褎䄂葛要絰繩屨無絇小祥男子去首之麻絰惟餘要葛也故曰葛要絰繩屨者父母初喪菅屨卒哭受齊衰蒯藨屨小祥受大功繩麻屨也無絇謂無屨頭飾也朱子曰菅屨疏屨今不可考今略以輕重推之斬衰用今草鞋齊衰用麻鞋可也麻鞋今卒伍所著者要平聲角瑱瑱充耳也吉時君大夫士皆有之所以掩於耳君用玉為之初喪去飾故無瑱小祥後微飾故用角為之也瑱吐練切鹿裘衡長袪袪裼之可也疏曰冬時吉凶衣裏皆有裘吉則貴賤有異喪則同用鹿皮為之小祥之前裘狹而短袂又無袪小祥稍飾則更易作橫廣大者又長之又設其袪也裼者裘上之衣吉時皆有喪後凶質未有裼衣小祥後漸向吉故加裼可也按如此文明小祥時外有衰衰內有練中衣中衣內有裼衣裼衣內有鹿裘鹿裘內自有常著襦衣緣今按袪者袖口也此所謂袪則是以他物為袖口之既祛以為飾故裼之可也衡音橫章內並同有殯聞逺兄弟之喪雖緦必往非兄弟雖鄰不往三年之喪在殯不得出弔然於兄弟則恩義存焉故雖緦服兄弟之異居而逺者亦當往哭其喪若非兄弟則雖近不往所識其兄弟不同居者皆弔馮氏曰上二句既主生者出弔往哭為義則下一句文意當同所識當為句若所知之謂也死者既吾之所知識則其兄弟雖與死者不同居我皆當弔之所以成往來之情義也天子之棺四重水兕革棺被之其厚三寸杝棺一梓棺二四者皆周水牛兕牛之革耐濕故以為親身之棺二革合被為一重杝木亦耐濕故次於革即前章所謂椑也梓木棺二一為屬一為大棺杝棺之外有屬棺屬棺之外又有大棺四者皆周言四重之棺上下四方悉周匝也惟椁不周下有茵上有抗席故也重平聲兕音似杝音移棺束縮二衡三衽每束一古者棺不用釘惟以皮條直束之二道橫束之三道衽形如今之銀則子兩端大而中小漢時呼為小要不言何物為之其亦木乎衣之縫合處曰衽以小要連合棺與蓋之際故亦名衽先鑿木置衽然後束以皮每束處必用一衽故云衽每束一也柏椁以端長六尺天子以柏木為椁端猶頭也用柏木之頭為之其長六尺長去聲天子之哭諸侯也爵辨絰䊷衣諸侯薨而赴於天子天子哭之爵辨䊷衣本士之祭服爵辨辨之色如爵也䊷衣絲衣也天鄭氏曰絰衍字也周禮王弔諸侯辨絰緦衰疏曰子至尊不見尸柩不弔服此遙哭之故不服緦衰而服爵辨䊷衣也䊷音緇或曰使有司哭之鄭氏曰非也哀戚之事不可虗為之不以樂食疏曰此是記者之言非或人之說也為去聲天子之殯也菆塗龍輴以椁加斧於椁上畢塗屋天子之禮也疏曰菆叢也菆塗謂用木叢棺而四面塗之也龍輴殯時用輴車載柩而畫轅為龍也以椁者此叢木象椁之形也繡覆棺之衣為斧文先菆四面為椁使上與棺齊而上猶開以此棺衣從椁上入覆於棺故云加斧於椁上也畢盡也斧覆既竟又四注為屋以覆於上而下四面盡塗之也棺今按菆塗龍輴是輴車亦在殯中非脫去輴車而殯也菆才官切輴音春覆並去聲唯天子之喪有别姓而哭諸侯朝覲天子爵同則其位同今喪禮則分别同姓異姓庶姓使各相從而為位以哭也别必列切魯哀公誄孔丘曰天不遺耆老莫相豫位焉嗚呼哀哉尼父作諡者先列其生之實行謂之誄大聖之行豈容盡列但言天不留此老成而無有佐我之位者以寓其傷悼之意而已耳稱孔丘者君臣之辭此與左傳之言不同父鄭氏曰尼父因其字以為之諡也相去聲音甫行去聲國亡大縣邑公卿大夫士皆厭冠哭於大廟三日句君不舉或曰君舉而哭於后土厭冠喪冠也說見曲禮盛饌而以樂侑食曰舉后土社也應氏曰哭於大廟者傷祖宗基業之虧損哭於后土者傷土地封疆之朘削也不舉自貶損也曰君舉者非也厭于葉切大音泰孔子惡野哭者所知吾哭諸野夫子嘗言之矣蓋哭其所知必設位而帷之以成禮此所惡者或郊野之際道路之閒哭非其地又且倉卒行之使人疑駭故惡之也方氏說哭者呼滅子臯曰野哉孔子惡者以此恐未然惡去聲卒音猝未仕者不敢稅人如稅人則以父兄之命稅人以物遺人也未仕者身未尊顯故內則不可專家財外則不可私恩惠也或有情義之所不得已而當遺者則稱尊者之命而行之遺去聲士備入而后朝夕踊國君之喪諸臣有朝夕哭踊之禮哭雖依次居位踊必相視為節不容有先後也士卑其入恆後士皆入則無不在者矣故舉士入為畢而後踊焉祥而縞是月禫徙月樂疏曰祥大祥也縞謂縞冠大祥日著之之馬氏曰祥禫之制施於三年之喪則其月同施於期喪則其月異雜記曰十一月而練十三月而祥十五月而禫此期之喪也父在為母有所屈三年所以為極而至於二十五月者其禮不可過以三年之愛而斷於期者其情猶可伸在禫月而樂者聽於人也在徙月而樂者作於己也為母為去聲斷音短君於士有賜帟帟幕之小者置之殯上以承塵也大夫以上則有司供之士卑又不得自為故君於士之殯以帟賜之也帟音亦檀弓下第四君之適長殤車三乘公之庶長殤車一乘大夫之適長殤車一乘此言送殤遣車之禮君謂國君亦或有地大夫通得稱君也公專言五等諸侯也十六至十九為長殤葬此殤時柩朝廟畢將行設遣奠以奠之牲體分折包裹用此車載之以遣送死者故名遣車車制甚小以置之椁內四隅不容大為之也禮中殤從上君適長三乘則中亦三乘下則一乘也公庶長一乘則中亦一乘下則無也大夫適長一乘則中亦一乘下殤及庶殤並無也適音的長上聲乘遣並去聲公之喪諸達官之長杖方氏曰受命於君者其名達於上故謂之達官若府史而下皆長官自辟除則不可謂之達矣受命於君者其恩厚故公之喪惟達官之長杖今按凡官皆有長二此以長言則不及二也長上聲君於大夫將葬弔於宫及出命引之三步則止如是者三君退句朝亦如之哀次亦如之弔於宫於其殯宫也出柩已行也孝子攀號不忍君命引之奪其情也引者三步即止君又命引之如是者三柩車遂行君即退去君來時不必恆在殯宫或當柩朝廟之時亦如之或已出大門至平日待賔客次舍之處孝子哀而暫停柩車則亦如之五十無車者不越疆而弔人始衰之年不可以筋力為禮也季武子寢疾蟜固不說齊衰而入見曰斯道也將亡矣士唯公門說齊衰武子曰不亦善乎君子表微及其喪也曾㸃倚其門而歌季武子魯大夫季孫夙也蟜固人姓名㸃字晳曾子父也武子寢疾之時蟜固適有齊衰之服遂衣凶服而問疾且曰大夫之門不當釋凶服惟君門乃說耳此禮將亡我之凶服以來欲以救此將亡之禮也武子善之言失禮之顯著者人皆可知若失禮之微細者惟君子乃能表明之也武子執政人所尊畏固之為此欲以易時人之觀瞻據禮而行武子雖憾不得而罪之也若倚門而歌則非禮矣其亦狂之一端歟記者蓋善蟜固之存禮譏曽㸃之廢禮也蟜音矯說音脫遂衣衣去聲大夫弔當事而至則辭焉弔於人是日不樂婦人不越疆而弔人行弔之日不飲酒食肉焉大夫弔弔於士也大夫雖尊然當主人有小斂大斂或殯之事而至則殯者以其事告之辭猶告也若非當事之時則孝子下堂迎之婦人無外事故不越疆而弔是日不樂不飲酒食肉皆為餘哀未忘也為去聲弔於葬者必執引若從柩及壙皆執紼引引柩車之索也紼引棺索也故鄭氏曰示助之以力疏曰弔葬本為助執事必相助引柩車凡執引用人貴賤有數數足則餘人皆散行從柩至下棺窆時則不限人數皆悉執紼也引者長逺之名故在車車行逺也紼是撥舉之義故在棺棺惟撥舉不長逺也引去聲壙上聲為相並去聲喪公弔之必有拜者雖朋友州里舍人可也弔曰寡君承事主人曰臨此謂國君弔其諸臣之喪弔後主人當親往拜謝喪家若無主後必使以次疏親往拜若又無疏親則死者之朋友及同州同里及喪家典舍之人往拜亦可也寡君承事言來承助喪事此君語擯者傳命以入之辭主人曰臨者謝辱臨之重也臨如字君遇柩於路必使人弔之蕢尚畫宫受弔不如杞梁之妻知禮而此言弔於路何也蓋有爵者之喪當以禮弔此謂臣民之微賤者耳禮不下庶人也言必使人弔者是泛言衆人之喪也大夫之喪庶子不受弔大夫之喪適子為主拜賔或以他故不在則庶子不敢受弔不敢以卑賤為有爵者之喪主也妻之昆弟為父後者死哭之適室子為主袒免哭踊夫入門右使人立於門外告來者狎則入哭父在哭於妻之室非為父後者哭諸異室此聞妻兄弟之喪而未往弔時禮也父在己之父也為父後妻之父也門外之人以來弔者告若是交游習狎之人則徑入哭之情義然也正疏曰女子子適人者為昆弟之為父後者不降以其故也故姊妹之夫為之哭於適室之中庭子為主者甥服舅緦故命己子為主受弔拜賔也袒免哭踊者冠尊不居肉袒之上必先去冠而加免故凡哭哀則踊踊必先袒袒必先免故袒免哭踊也夫入門右者謂此子之父即哭妻兄弟者弟適音的免音問夫如字為昆之為去聲有殯聞逺兄弟之喪哭于側室無側室哭于門內之右同國則往哭之側室者燕寢之旁室也門內大門之內也上篇言有殯聞逺兄弟之喪雖緦必往其亦謂同國歟方氏曰哭于側室欲其逺殯宫也于門內之右者不居主位示為之變也同國則往者以其不逺也逺殯逺為之為並去聲子張死曾子有母之喪齊衰而往哭之或曰齊衰不以弔曾子曰我弔也與哉以喪母之服而哭朋友之喪踰禮已甚故或人止之而曽子之意則曰我於子張之死豈常禮之弔而已哉今詳此意但以友義隆厚不容不往哭之又不可釋服而往但往哭而不行弔禮耳故曰我弔也與哉練劉氏曰曽子嘗問三年之喪弔乎夫子曰三年之喪不羣立不旅行君子禮以飾情三年之喪而弔哭不亦虛乎既聞此矣而又以母喪弔友必不然也凡經中言曾子失禮之事不可盡信此亦可見與平聲有若之喪悼公弔焉子游擯由左悼公魯君哀公之子擯贊相禮事也立者尊右子游由公之左則公在右為尊矣少儀云詔辭自右者謂傳君之詔命則詔命為尊故傳者居右時相喪禮者亦多由右故子游正之也齊穀王姬之喪魯莊公為之大功或曰由魯嫁故為之服姊妹之服或曰外祖母也故為之服穀讀為告齊襄公夫人王姬卒在魯莊之二年赴告於魯其初由魯而嫁故魯君為之服出嫁姊妹大功之服禮也或人既不知此王姬乃莊公舅之妻而以為外祖母又不知外祖母服小功而以大功為外祖母之服其亦妄矣是鄭氏曰春秋周女由魯嫁卒則服之如內女服姊妹也天子為之無服嫁於王者之後乃服之穀音告為去聲晉獻公之喪秦穆公使人弔公子重耳且曰寡人聞之亡國恆於斯得國恆於斯雖吾子儼然在憂服之中喪亦不可久也時亦不可失也孺子其圖之獻公薧時重耳避難在狄故穆公使人往弔之弔為正禮故以且曰起下辭寡人聞之者此使者傳穆公之言也恆於斯言常在此死生交代之際也儼然端靜持守之貌喪失位也喪不可久時不可失者勉其奔喪反國以謀襲位故言孺子其圖之也此時秦已有納之之志矣重平聲喪去聲下並同難去聲使者使去聲以告舅犯舅犯曰孺子其辭焉喪人無寶仁親以為寶父死之謂何又因以為利而天下其孰能說之孺子其辭焉舅犯重耳舅狐偃字子犯也公子既聞使者之言入以告之子犯犯言當辭而不受可也失位去國之人無以為寶惟仁愛思親乃其寶也父死謂是何事正是凶禍大事豈可又因此凶禍以為反國之利而天下之人孰能解說我為無罪乎此所以不當受其相勉反國之命也說如字公子重耳對客曰君惠弔亡臣重耳身喪父死不得與於哭泣之哀以為君憂父死之謂何或敢有他志以辱君義稽顙而不拜哭而起起而不私公子既聞子犯之言乃出而答客惠弔亡臣重耳謝其來弔也不得與哭泣之哀言出亡在外不得居喪次也以為君憂者致君憂慮我也他志謂求位之志辱君義者辱君惠弔之義也不私不再與使者私言也與去聲子顯以致命於穆公穆公曰仁夫公子重耳夫稽顙而不拜則未為後也故不成拜哭而起則愛父也起而不私則逺利也鄭注用國語知使者為公子縶字子韅故讀顯謂韅也喪禮先稽顙後拜謂之成拜為後者成拜所以謝弔禮之重今公子以未為後故不成拜也愛父猶言哀痛其父也不私與使者言是無反國之意是逺利也愛父逺利皆仁者之事故稱之曰仁夫公子重耳聲顯去聲逺去帷殯非古也自敬姜之哭穆伯始也禮朝夕哭殯之時必褰開其帷敬姜哭其夫穆伯之殯乃以也避嫌而不復褰帷自此以後人皆效之故記者云非古穆伯魯大夫季悼子之子公甫靖也喪禮哀戚之至也節哀順變也君子念始之者也孝子之哀發於天性之極至豈可止遏聖人制禮以節其哀蓋順以變之也言順孝子之哀情以漸變而輕減也始猶生也生我者父母也毁而滅性是不念生我者矣復盡愛之道也有禱祠之心焉望反諸幽求諸鬼神之道也北面求諸幽之義也行禱五祀而不能回其生又為之復是盡其愛親之道而禱祠之心猶未忘於復之時也望反諸幽望其自幽而反也鬼神處幽暗北乃幽陰之方故求諸鬼神之幽者必向北也拜稽顙哀戚之至隱也稽顙隱之甚也隱痛也稽顙者以頭觸地無復禮容就拜與稽顙言之皆為至痛而稽顙則尤其痛之甚者也飯用米貝弗忍虛也不以食道用美焉爾實米與貝于死者口中不忍其口之虛也此不是用飲食之道但用此美潔之物以實之焉爾銘明旌也以死者為不可别已故以其旗識之愛之斯録之矣敬之斯盡其道焉耳士喪禮銘曰某氏某之柩初置于簷下西階上及為重畢則置于重殯而卒塗始樹於肂坎之東疏云士長三尺大夫五尺諸侯七尺天子九尺若不命之士則以緇長半幅赬末長終幅廣三寸半幅一尺也終幅二尺也是總長三尺夫愛之而録其名敬之而盡其道曰愛曰敬非虛文也志别必列切識式志切重平聲肂羊切赬敕貞切重主道也殷主綴重焉周主重徹焉禮注云士重木長三尺始死作重以依神雖非主而有主之道故曰主道也殷禮始殯時置重于殯廟之庭暨成虞主則綴此重而懸於新死者所殯之廟周人虞而作主則徹重而埋之也音重平聲綴拙奠以素器以生者有哀素之心也唯祭祀之禮主人自盡焉爾豈知神之所饗亦以主人有齊敬之心也鄭氏曰哀素言哀痛無飾也凡物無飾曰素哀則以素敬則以飾禮由人心而已方氏曰士喪禮有素俎士虞禮有素几皆其哀而不文故也喪葬凶禮故若是至於祭祀之吉禮則必自盡以致其文焉故曰唯祭祀之禮主人自盡焉爾然主人之自盡亦豈知神之所享必在於此乎且以表其心而已耳齊音齊辟踊哀之至也有算為之節文也疏曰撫心為辟跳躍為踊是哀痛之至極若不裁限恐傷其性故有算以為之準節每一踊三跳三踊九跳為一節士三日有三次踊大夫四日五踊諸侯六日七踊天子八日九踊故云為之節文也辟婢亦切袒括髮變也愠哀之變也去飾去美也袒括髮去飾之甚也有所袒有所襲哀之節也疏曰袒衣括髮形貌之變也悲哀愠恚哀情之變也去其尋常吉時之服飾是去其華美也去飾雖多端惟袒而括髮又去飾之中最甚者也理應常袒何以有袒時有襲時蓋哀甚則袒哀輕則襲哀之限節也去上聲辨絰葛而葬與神交之道也有敬心焉周人辨而葬殷人冔而葬居喪時冠服皆純凶至葬而吾親託體地中則當以禮敬之心接於山川之神也於是以絹素為辨如爵辨之制以葛為環絰在首以送葬不敢以純凶之服交神者示敬也故曰有敬心焉冔火羽切啜主人主婦室老為其病也君命食之也疏曰親喪啜粥之時主人亡者之子主婦亡者之妻無則主人之妻也室老家之長相此三人並是大夫之家貴者為其啜粥病困之故君必命之食疏飯也若士喪君不命也喪大記言主婦食疏食謂既殯之後此主婦啜者謂未殯前為去聲食音嗣反哭升堂反諸其所作也主婦入于室反諸其所養也此堂與室皆謂廟中也卒窆而歸乃反哭於祖廟其二廟者則先祖後禰所作者平生祭祀冠昏所行禮之處也所養者所饋食供養之處也養去聲冠去聲反哭之弔也哀之至也反而亡焉失之矣於是為甚賔之弔者升自西階曰如之何主人拜稽顙當此之時亡矣失矣不可復見吾親矣哀痛於是為甚也賔弔畢而出主人送于門外遂適殯宫即先時所殯正寢之堂也殷既封而弔周反哭而弔孔子曰殷己慤吾從周殷之禮窆畢賔就墓所弔主人周禮則俟主人反哭而後弔孔子謂殷禮太質慤者蓋親之在土固為可哀不若求親於平生居止之所而不得其哀為尤甚也故弔於墓者不如弔於家者之情文為兼盡故欲從周也封音窆葬於北方北首三代之達禮也之幽之故也北方國之北也殯猶南首未忍以鬼神待其親也葬則終死事矣故葬而北首三代通用此禮也南方昭明北方幽暗之幽釋所以北首之義首去聲既封主人贈而祝宿虞尸柩行至城門公使宰夫贈𤣥纁束既窆則用此𤣥纁贈死者於墓之野此時祝先歸而肅虞祭之尸矣宿讀為肅進也虞猶安也葬畢迎精而反日中祭之於殯宫以安之也男則男子為尸女則女子為尸尸之為言主也不見親之形容心無所係故立尸而使之著死者之服所以使孝子之心主於此也禫祭以前男女異尸異几祭於廟則無女尸而几亦同矣少牢禮云某妃配是男女共尸著直略切少去聲既反哭主人與有司視虞牲有司以几筵舍奠於墓左反日中而虞士之禮虞牲特豕几所以依神筵坐神之席也席敷陳曰筵孝子先反而視牲别令有司釋奠以禮地神為親之託體於此也舍讀為釋奠者置也釋置此祭饌也墓道向南以東為左待此有司之反即於日中時虞祭也舍音釋敷敷同為親為去聲葬日虞弗忍一日離也鄭氏曰弗忍其無所歸離去聲是日也以虞易奠卒哭曰成事始死小斂大斂朝夕朔月朝祖賵遣之類皆喪奠也此日以虞祭代去喪奠故曰以虞易奠也卒哭曰成事者蓋祝辭曰哀薦成事也祭以吉為成卒哭之祭乃吉祭故也是日也以吉祭易喪祭明日祔于祖父吉祭卒哭之祭也喪祭虞祭也卒哭在虞之後故云以吉祭易喪祭也袝之為言附也祔祭者告其祖父以當遷他廟而告新死者以當入此廟也禮云明日以其班祔明日者卒哭之次日也卒哭時告于新主曰哀子某來日隮祔爾于爾皇祖某甫及時則奉新主入祖之廟而并告之曰適爾皇祖某甫以隮祔爾孫某甫孫必祔祖者昭穆之位同所謂以其班也畢事虞主復于寢三年喪畢遇四時之吉祭而後奉新主入廟也虞祭閒一日而卒哭與祔則不閒日聲并閒並去其變而之吉祭也比至於祔必於是日也接不忍一日末有所歸也上文所言皆據正禮此言變者以其變易常禮也所以有變者以有他故未及葬期而即葬也據士禮速葬速虞之後卒哭之前其日尚賖不可無祭之往也虞往至吉祭其禮如何曰虞後比至於祔遇剛日而連接其祭若丁日葬則己日再虞後虞改用剛日則庚日三虞也此後遇剛日則祭至祔而後止此孝子不忍使其親一日無所依歸也比音畀殷練而祔周卒哭而祔孔子善殷孝經曰為之宗廟以鬼享之孔子善殷之祔者以不急於鬼其親也君臨臣喪以巫祝桃茢執戈惡之也所以異於生也喪有死之道焉先王之所難言也桃性辟惡鬼神畏之王莽惡高廟神靈以桃湯灑其壁茢苕帚也所以除穢巫執桃祝執茢小臣執戈蓋為其有凶邪之氣可惡故以此三物辟祓之也臨生者則惟執戈而已今加以桃茢故曰異於生也君使臣以禮死而惡之豈禮也哉然人死斯惡之矣故喪禮實有惡死之道焉先王之所不忍言也茢音列惡難並去聲辟音闢喪之朝也順死者之孝心也其哀離其室也故至於祖考之廟而后行殷朝而殯於祖周朝而遂葬子之事親出必告反必面今將葬而奉柩以朝祖固為順死者之孝心然求之死者之心亦必自哀其違離寢處之居而永棄泉壤之下亦欲至祖考之廟而訣别也殷尚質敬鬼神而逺之故大斂之後即奉柩朝祖而遂殯於廟周人則殯於寢及葬則朝廟也孔子謂為明器者知喪道矣備物而不可用也此孔子善夏之用明器從葬從去聲哀哉死者而用生者之器也不殆於用殉乎哉此孔子非殷人用祭器從葬以人從死曰殉殆幾也用其器則近於用人其曰明器神明之也塗車芻靈自古有之明器之道也孔子謂為芻靈者善謂為俑者不仁不殆於用人乎哉謂之明器者是以神明之道待之也塗車以泥為車也束草為人形以為死者之從衛謂之芻靈略似人形而已亦明器之類也中古為木偶人謂之俑則有面目機發而太似人矣故孔子惡其不仁知末流必有以人殉葬者趙氏曰以木人送葬設機而能踊跳故名之曰俑穆公問於子思曰為舊君反服古與子思曰古之君子進人以禮退人以禮故有舊君反服之禮也今之君子進人若將加諸膝退人若將隊諸淵毋為戎首不亦善乎又何反服之禮之有穆公魯君哀公之曾孫為舊君服見儀禮齊衰章孟子言三有禮則為之服寇讎何服之有與此章意似隊諸淵言置之死地也戎首為寇亂之首也為舊為去聲與平聲隊音墜悼公之喪季昭子問於孟敬子曰為君何食敬子曰食粥天下之逹禮也悼公魯哀公之子昭子康子之曾孫名强敬子武伯之子名捷吾三臣者之不能居公室也四方莫不聞矣勉而為瘠則吾能毋乃使人疑夫不以情居瘠者乎哉我則食食三臣仲孫叔孫季孫之三家也敬子言我三家不能居公室而以臣禮事君者四方皆知之矣勉强食粥而為毁瘠之貌我雖能之然豈不使人疑我非以哀戚之真情而處此瘠乎不若違禮而食食也應氏曰季子之問有君子補過之心而孟氏之對可謂小人之無忌憚者矣食上如字下音嗣衛司徒敬子死子夏弔焉主人未小斂絰而往子游弔焉主人既小斂子游出絰反哭子夏曰聞之也與曰聞諸夫子主人未改服則不絰司徒以官為氏也主人未小斂則未改服故弔者不絰子夏絰而往弔非也其時子游亦弔俟其小斂後改服乃出而加絰反哭之則中於禮矣與平聲中去聲曾子曰晏子可謂知禮也已恭敬之有焉有若曰晏子一狐裘三十年遣車一乘及墓而反晏子齊大夫曽子稱其知禮謂禮以恭敬為本也有若之言則曰狐裘貴在輕新乃三十年而不易是儉於己也遣車一乘儉其親也禮窆後有拜賔送賔等禮晏子窆訖即還儉於賔也此三者皆以其儉而失禮者也遣乘並去聲下節同國君七個遣車七乘大夫五個遣車五乘晏子焉知禮遣車之數天子九乘諸侯七乘大夫五乘天子之士三乘諸侯之士無遣車也大夫以上皆太牢士少牢個包也凡包牲皆取下體每一牲取三體前脛折取臂臑後脛折取骼少牢二牲則六體分為三個太牢三牲則九體大夫九體分為十五假三假為一包凡五包諸侯分為二十一假凡七包天子分為二十七假凡九包每遣車一乘則載一包也曽子曰國無道君子恥盈禮焉國奢則示之以儉國儉則示之以禮曽子主權有子主經是以二端之論不合國昭子之母死問於子張曰葬及墓男子婦人安位子張曰司徒敬子之喪夫子相男子西鄉婦人東鄉國昭子齊大夫葬其母以子張相禮故問之夫子孔子也主人家男子皆西鄉婦人皆東向而男賔在衆主人之南女賔在衆婦之南禮也相鄉並去聲曰噫毋曰我喪也斯沾爾專之賔為賔焉主為主焉婦人從男子皆西鄉昭子聞子張之言歎息而止之言我為大夫齊之顯家今行喪禮人必盡求覘視當有所更改以示人豈宜一循舊禮爾當專主其事使賔自為賔主自為主可也於是昭子家婦人既與男子同居主位而西鄉而女賔亦與男賔同居賔位而東鄉矣斯盡也沾讀為覘此記禮之變毋無同斯去聲沾覘同更平聲穆伯之喪敬姜晝哭文伯之喪晝夜哭孔子曰知禮矣哭夫以禮哭子以情中節矣故孔子美之中去聲文伯之喪敬姜據其牀而不哭曰昔者吾有斯子也吾將以為賢人也吾未嘗以就公室今及其死也朋友諸臣未有出涕者而內人皆行哭失聲斯子也必多曠於禮矣夫以為賢人必知禮矣故凡我平日出入公室未嘗與俱而觀其所行蓋信其賢而知禮也至死而覺其曠禮故歎恨之鄭氏曰季氏魯之宗卿敬姜有㑹見之禮季康子之母死陳䙝衣敬姜曰婦人不飾不敢見舅姑將有四方之賔來䙝衣何為陳於斯命徹之敬姜康子之從祖母也語應氏曰敬姜森然法度之見音現從去聲有子與子游立見孺子慕者有子謂子游曰豫一不知夫喪之踊也豫欲去之久矣情在於斯其是也夫有子言喪禮之有踊我常不知其何為而然一者專一之義猶常也我久欲除去之矣今見孺子之號慕若此則哀情之在於此踊亦如此孺子之慕也夫去上聲子游曰禮有微情者有以故興物者有直情而徑行者戎狄之道也禮道則不然子游言先王制禮使賢者俯而就之不肖者企而及之慮賢者之過於情也故立為哭踊之節所以殺其情故曰禮有微情者微猶殺也慮不肖者之不及情也故為之興起衰絰之物使之睹服思哀故曰有以故興物者此二者皆制禮者酌人情而為之也若直肆己情徑率行之或哀或不哀漫無制節則是戎狄之道矣中國禮義之道則不如是也人喜則斯陶陶斯咏咏斯猶猶斯舞舞斯愠愠斯戚戚斯歎歎斯辟辟斯踊矣品節斯斯之謂禮此言樂極生哀之情但舞斯愠一句終是可疑今且據疏劉氏欲於猶斯舞之下增一矣字而刪舞斯愠三字今亦未敢從疏曰喜者外境會心之謂斯語助也陶謂鬱陶心初悅而未暢之意鬱陶之情暢則口歌咏之也咏歌不足漸至動搖身體乃至起舞足蹈手揚樂之極也外境違心之謂愠凡喜怒相對哀樂相生若舞無節形疲厭倦事與心違所以怒生愠怒之生由於舞極故曲禮云樂不可極也此凡九句首末各四句是哀樂相對中間舞斯愠一句是哀樂相生愠斯戚者怒來觸心憤恚之餘轉為憂戚憂戚轉深因發歎息歎恨不泄遂至撫心撫心不泄乃至跳踊奮擊亦哀之極也故夷狄無禮朝殯夕歌童兒任情倐啼歘笑今若品節此二塗使踊舞有數則能久長故云斯之謂禮品階格也節制斷也孫氏曰當作人喜則斯陶陶斯咏咏斯猶猶斯舞舞斯蹈矣人悲則斯愠愠斯戚戚斯歎歎斯辟辟斯踊矣蓋自喜至蹈凡六變自悲至踊亦六變此所謂孺子慕者之直情也舞蹈辟踊皆本此情聖人於是為之節猶音搖辟婢亦切樂音洛人死斯惡之矣無能也斯倍之矣是故制絞衾設蔞翣為使人勿惡也以其死而惡之以其無能而倍之恐太古無禮之時人多如此於是推原聖人所以制禮之初意止為使人勿惡勿倍而已絞衾以飾其體蔞翣以飾其棺則不見死者之可惡矣柳惡去聲絞音爻蔞音為去聲始死脯醢之奠將行遣而行之既葬而食之未有見其饗之者也自上世以來未之有舍也為使人勿倍也故子之所刺於禮者亦非禮之訾也始死即為脯醢之奠將葬則有包裹牲體之遣既葬則有虞祭之食何嘗見死者享之乎然自上世制禮以來未聞有舍而不為者為此則報本反始之思自不能已矣豈復有倍之之意乎先王制禮其深意蓋如此今子刺喪之踊而欲去之者亦不足以為禮之疵病也遣去聲食去聲舍上聲為去聲刺音次訾音疵復扶又切吳侵陳斬祀殺厲師還出竟陳大宰嚭使於師夫差謂行人儀曰是夫也多言盍嘗問焉師必有名人之稱斯師也者則謂之何魯哀公元年吳師侵陳斬祀伐祠祀之木也殺厲殺疫病之人也大宰行人皆官名夫差吳子名是夫猶言此人指嚭也多言猶能言也盍何不也嘗試也師必有名者言出師伐人必得彼國之罪以顯我出師之名也今衆人稱我此師謂之何名乎還音旋竟音境大音泰嚭普彼切使去聲夫差音扶叉是夫夫如字大宰嚭曰古之侵伐者不斬祀不殺厲不獲二毛今斯師也殺厲與其不謂之殺厲之師與曰反爾地歸爾子則謂之何曰君王討敝邑之罪又矜而赦之師與有無名乎二毛斑白之人也子謂所獲臣民也還其侵略之地縱其俘獲之民是矜而赦之矣豈可又以無名之師議之乎此言嚭善於辭令故能救敗亡之禍石梁王氏曰是時吳亦有大宰嚭如何與並平聲顔丁善居喪始死皇皇焉如有求而弗得及殯望望焉如有從而弗及既葬慨焉如不及其反而息顔丁魯人皇皇猶栖栖也望望往而不顧之貌慨感悵之意始死形可見也既殯柩可見也葬則無所見矣如有從而弗及似有可及之處也葬後則不復如有所從矣故但言如不及其反又云而息者息猶待也不忍決忘其親猶且行且止以待其親之反也蓋葬者往而不反然孝子於迎精而反之時猶如有所疑也復去聲子張問曰書云髙宗三年不言言乃歡有諸仲尼曰胡為其不然也古者天子崩王世子聽於冢宰三年言乃歡者命令所布人心喜悅也知悼子卒未葬平公飲酒師曠李調侍鼓鐘杜蕢自外來聞鐘聲曰安在曰在寢杜蕢入寢歷階而升酌曰曠飲斯又酌曰調飲斯又酌堂上北面坐飲之降趨而出知悼子晉大夫名罃平公晉侯彪也凡三酌者既罰二子又自罰也知去聲蕢音快飲去聲平公呼而進之曰蕢曩者爾心或開豫是以不與爾言爾飲曠何也曰子卯不樂知悼子在堂斯其為子卯也大矣曠也太師也不以詔是以飲之也言爾之初入我意爾必有所諫教開發於我我是以不先與爾言乃三酌之後竟不言而出爾之飲曠何說也蕢言桀以乙卯日死紂以甲子日死謂之疾日故君不舉樂在堂在殯也況君於卿大夫比葬不食肉比卒哭不舉樂悼子在殯而可作樂燕飲乎桀紂異代之君悼子同體之臣故以為大於子卯也詔告也罰其不告之罪也爾飲調何也曰調也君之褻臣也為一飲一食忘君之疾是以飲之也言調為近習之臣貪於一飲一食而忘君違禮之疾故罰之也飲去聲爾飲何也曰蕢也宰夫也非刀匕是共又敢與知防是以飲之也非猶不也宰夫職在刀匕今乃不專供刀匕之職而敢與知諫爭防間之事是侵官矣故自罰也共音供與去聲爭音諍平公曰寡人亦有過焉酌而飲寡人杜蕢洗而揚觶公謂侍者曰如我死則必毋廢斯爵也至于今既畢獻斯揚觶謂之杜舉揚觶舉觶也盥洗而後舉致潔敬也平公自知其過既命蕢以酌又欲以此爵為後世戒故記者云至今晉國行燕禮之終必舉此觶謂之杜舉者言此觶乃昔者杜蕢所舉也春秋傳作屠蒯文亦不同觶音志公叔文子卒其子戍請諡於君曰日月有時將葬矣請所以易其名者文子衛大夫名拔君靈公也大夫士三月而葬有時猶言有數也死則諱其名故為之諡所以代其名也戍音庶君曰昔者衛國凶饑夫子為粥與國之餓者是不亦惠乎昔者衛國有難夫子以其死衛寡人不亦貞乎夫子聽衛國之政修其班制以與四鄰交衛國之社稷不辱不亦文乎故謂夫子貞惠文子魯昭公二十年盜殺衛侯之兄縶時齊豹作亂公如死鳥此衛國之難也班者尊卑之次制者多寡之節因舊典而修舉之也據先後則惠在前論小大則貞為重故不曰惠貞而曰貞惠也此三字為諡而惟稱文子者鄭云文足以兼之難去聲石駘仲卒無適子有庶子六人卜所以為後者曰沐浴佩玉則兆五人者皆沐浴佩玉石祁子曰孰有執親之喪而沐浴佩玉者乎不沐浴佩玉石祁子兆衛人以龜為有知也駘仲衛大夫曰沐浴佩玉則兆卜人之言也兆方氏曰兆亦有凶卜者以求吉為主故經以言吉也駘音苔適音的陳子車死於衛其妻與其家大夫謀以殉葬定而后陳子亢至以告曰夫子疾莫養於下請以殉葬子車齊大夫子亢其兄弟即孔子弟子子禽也疾時不在家家人不得以致其養故云莫養於下也於是欲殺人以殉葬定謂已議定所殺之人也養亢音剛去聲子亢曰以殉葬非禮也雖然則彼疾當養者孰若妻與宰得已則吾欲己不得已則吾欲以二子者之為之也於是弗果用宰即家大夫也二子謂妻與宰也子亢若但言非禮未必能止之今以當養者為當殉則不期其止而自止矣子路曰傷哉貧也生無以為養死無以為禮也孔子曰啜菽飲水盡其歡斯之謂孝斂首足形還葬而無椁稱其財斯之謂禮世固有三牲之養而不能歡者亦有厚葬以為觀美而不知陷於僭禮之罪者知此則孝與禮可得而盡矣又何必傷其貧乎還葬說見上篇音養去聲還旋稱去聲衛獻公出奔反於衛及郊將班邑於從者而后入柳莊曰如皆守社稷則孰執羈靮而從如皆從則孰守社稷君反其國而有私也毋乃不可乎弗果班獻公以魯襄十四年奔齊二十六年歸衛羈所以絡獨馬靮所以鞚馬莊之意謂居者行者均之為國不當賞從者以示私恩從去聲靮音的衛有大史曰栁莊寢疾公曰若疾革雖當祭必告公再拜稽首請於尸曰有臣柳莊也者非寡人之臣社稷之臣也聞之死請往不釋服而往遂以襚之與之邑裘氏與縣潘氏書而納諸棺曰世世萬子孫毋變也以衣服贈死者曰禭裘縣潘二邑名萬子孫謂莊之後世也莊之疾公嘗命其家若當疾亟之時我雖在祭事亦必入告及其死也果當公行事之際遂不釋祭服而往因釋以禭之又賜之二邑此雖見國君尊賢之意然棄祭事而不終以諸侯之命服而襚大夫書封邑之劵而納諸棺皆非禮矣大音泰革音亟入聲縣音𤣥陳乾昔寢疾屬其兄弟而命其子尊己曰如我死則必大為我棺使吾二婢子夾我陳乾昔死其子曰以殉葬非禮也況又同棺乎弗果殺屬如周禮屬民讀法之屬猶合也聚也記者善尊己守正而不從其父之亂命乾音干屬音燭仲遂卒于垂壬午猶繹萬入去籥仲尼曰非禮也卿卒不繹仲遂魯莊公子東門襄仲也為魯卿垂齊地名祭宗廟之明日又設祭禮以尋繹昨日之祭謂之繹殷謂之肜言壬午則正祭辛巳日也萬舞執干以舞也籥舞吹籥以舞也萬入去籥者言此繹祭時以仲遂之卒但用無聲之干舞以入去有聲之籥舞而不用也繹陳氏曰春秋之法當祭而卿卒則不用樂明日則不故叔弓之卒昭公去樂卒事君子以為禮仲遂之卒宣公猶繹而萬入去籥聖人以為非禮舞詩記曰萬舞二舞之總名也干舞者武舞之别名籥者文舞之别名文舞又謂之羽舞鄭氏據公羊以萬舞為干舞誤也春秋書萬入去籥言文武二舞皆入去其有聲者故去籥焉公羊乃以萬舞為武舞與籥舞對言之失經意矣若萬舞止為武舞則此詩何為獨言萬舞而不及文舞左傳考仲子之宫將萬焉婦人之廟亦不應獨用武舞也然則萬舞為二舞之總名明矣出詩緝簡兮注而愚按左傳楚令尹子元欲蠱文夫人為館於其宫側振萬焉夫人聞之泣曰先君以是舞也習戎備也今令尹不尋諸仇讎而於未亡人之側不亦異乎據此則萬舞信為武舞矣吕氏豈偶忘之耶去上聲肜音融何為為去聲季康子之母死公輸若方小斂般請以機封將從之公肩假曰不可夫魯有初公輸氏若名為匠師方小年尚幼也斂下棺於椁也般若之族素多技巧見若掌斂事而年幼欲代之而試用其巧技也機窆謂以機關轉動之器下棺不用碑與繂也魯有初言魯國自有故事也般音班封音窆斂去聲公室視豐碑三家視桓楹豐碑天子之制桓楹諸侯之制為疏曰凡言視者比擬之辭豐大也謂用大木碑穿鑿去碑中之木使之空於空閒著鹿盧兩頭各入碑木以紼之一頭係棺緘以一頭繞鹿盧既訖而人各背碑負紼末頭聽鼓聲以漸却行而下之也桓楹不似碑形如大楹耳通而言之亦曰碑說文桓郵亭表也如今之橋旁表柱也諸侯二碑兩柱為一碑而施鹿盧故鄭云四植也下空去聲著音勺般爾以人之母嘗巧則豈不得以其母以嘗巧者乎則病者乎噫弗果從疏曰嘗試也言爾欲以人母嘗試己之巧事誰有强逼於爾而為此乎豈不得休已者哉又語之云其無以人母嘗試己巧則於爾病者乎言不得嘗巧豈於爾有所病假言畢乃更噫而傷嘆於是衆人遂止一說則豈不得以其母以嘗巧者乎作一句言爾以他人母試巧而廢其當用之禮則亦豈不得自以己母試巧而不用禮乎則於爾心亦有所病而不安乎蓋使之反求諸心以己度人而知其不可也應氏曰周衰禮廢而諸侯僭天子故公室之窆棺視豐碑大夫僭諸侯故三家之窆棺視桓楹其陵替承襲之弊有自來矣强上聲戰于郎公叔禺人遇負杖入保者息曰使之雖病也任之雖重也君子不能為謀也士弗能死也不可我則既言矣與其鄰重汪踦往皆死焉魯人欲勿殤重汪踦問於仲尼仲尼曰能執干戈以衛社稷雖欲勿殤也不亦可乎戰于郎魯哀公十一年齊伐魯也禺人昭公子公為也遇魯人之避齊師而入保城邑者疲倦之餘負其杖而息于塗禺人乃歎之曰徭役之煩雖不能堪也稅斂之數雖過於厚也若上之人協心以禦寇難猶可塞責也今卿大夫不能畫謀䇿士不能捐身以死難豈人臣事君之道哉甚不可也我既出此言矣可不思踐吾言乎於是與其鄰之童子汪踦者皆往鬭而死於敵魯人以踦有成人之行欲以成人之喪禮葬之而孔子善其權禮之當也數禺音遇重通作童踦音紀斂去聲入聲子路去魯謂顔淵曰何以贈我曰吾聞之也去國則哭于墓而后行反其國不哭展墓而入謂子路曰何以處我子路曰吾聞之也過墓則式過祀則下哭墓哀墓之無主也不忍丘壟之無主則必有返國之期故為行者言之墓與祀人所易忽也而能加之敬則無往而不用吾敬矣敬則無適而不安故為居者言之也方氏曰凡物展之則可省而視故省謂之展處上聲為去聲省悉井切工尹商陽與陳弃疾追吳師及之陳弃疾謂工尹商陽曰王事也子手弓而可句手弓句子射諸射之斃一人韔弓又及謂之又斃二人每斃一人掩其目止其御曰朝不坐燕不與殺三人亦足以反命矣孔子曰殺人之中又有禮焉工尹楚官名追吳師事在魯昭公十二年子手弓而可為句使之執弓也手弓商陽之弓在手也韔弓衣也謂之再告之也掩目而不忍視止御而不忍驅有惻隱之心焉商陽自言位卑禮薄如此亦可以稱塞矣孔子謂其有禮以敗北之師本易窮而商陽乃能節制其縱殺之心是仁意與禮節並行非事君之禮止於是也特取其善於追敗者亦非謂臨敵未決而不忍殺人也立疏曰朝與燕皆在寢若路門外正朝則大夫以下皆若燕朝在於路寢則大夫坐於上如孔子攝齊升堂是也升堂則坐矣燕亦在寢燕禮獻卿大夫之後西階上獻士無升堂之文是士立於下也鄭注射者在左戈盾在右御在中央謂兵車參乘之法此謂凡常戰士若是元帥則在中央鼓下御者在左戈盾亦在右若天子諸侯親將亦居鼓下若非元帥則皆在左御者在中若非兵車則尊者在左易射音石韔音暢朝音潮與去聲稱並去聲齊音咨乘將並去聲諸侯伐秦曹桓公卒于㑹諸侯請含使之襲曹伯之卒魯成公十三年也襲賤者之事諸侯從之不知禮也聲含去襄公朝于荆康王卒荆人曰必請襲魯人曰非禮也荆人强之巫先拂柩荆人悔之荆禹貢州名楚立國之本號魯僖公元年始稱楚魯襄公以二十八年朝楚適遭楚子昭之喪魯人知襲之非禮而不能違於是以君臨臣喪之禮先之及其覺之而悔已無及矣此其適權變之宜足以雪恥强上聲滕成公之喪使子叔敬叔弔進書子服惠伯為介及郊為懿伯之忌不入惠伯曰政也不可以叔父之私不將公事遂入滕成公之喪在魯昭公之三年敬叔魯桓公七世孫惠伯則桓公六世孫也於世次敬叔稱惠伯為叔父懿伯則惠伯之叔父而敬叔之五從祖進書奉進魯君之弔書也介副也欲劉氏曰左傳注云忌怨也敬叔先有怨於懿伯故不入滕以惠伯之言而入傳言叔弓之有禮也此疏云敬叔嘗殺懿伯為其家所怨恐惠伯殺已故不敢先入惠伯知其意而開釋之記惠伯之知禮也二說不同而皆可疑如彼注言禮椒為之避仇怨則當自受命之日辭行以禮之不當及郊而後辭入也如此疏言恐惠伯殺已而難之則魯之遣使而使其仇為之副不恤其相仇以棄命害事亦非善處也且叔弓為正使得仇怨為介而不請易之非計之得也又同使共事而常以仇敵備之而往反於魯滕之路亦難言也使椒果欲報仇則其言雖善安知非誘我耶而遂入又非通論也按左傳云及郊遇懿伯之忌此作為二字雖異而皆先言及郊而後言忌可見是及郊方遇忌也或者忌字只是忌日懿伯是敬叔從祖適及滕郊而遇此日故欲緩至次日乃入故惠伯以禮曉之曰公事有公利無私忌乃先入而叔弓亦遂入焉此說固可通然亦未知然否闕之可也哀公使人弔蕢尚遇諸道辟於路畫宫而受弔焉哀公魯君辟於路辟讀為闢謂除闢道路以畫宫室之位而受弔也音辟音闢畫獲曾子曰蕢尚不如杞梁之妻之知禮也齊莊公襲莒于奪杞梁死焉其妻迎其柩於路而哭之哀魯襄公二十三年齊侯襲莒襲者以輕兵掩其不備而攻之也左傳言杞殖華還載甲夜入且于之隧且于莒邑名隧狹路也鄭云或為兑故讀奪為兑梁即殖以戰死故妻迎其柩奪音兌華去聲且音雎莊公使人弔之對曰君之臣不免於罪則將肆諸市朝而妻妾執君之臣免於罪則有先人之敝廬在君無所辱命肆陳尸也妻妾執拘執其妻妾也左傳言齊侯弔諸其室孺子䵍之喪哀公欲設撥問於有若有若曰其可也君之三臣猶設之顔柳曰天子龍輴而椁幬諸侯輴而設幬為榆沈故設撥三臣者廢輴而設撥竊禮之不中者也而君何學焉䵍哀公之少子舊說以撥為紼未知是否三臣魯之三家也顔柳言天子之殯用輴車載柩而畫轅為龍椁幬者叢木為椁形而覆幬其上前言加斧于椁上是也諸侯輴而設幬則有輴而無龍有幬而無椁也榆沈以水浸榆白皮之汁以播地取其引車不澀滯也今三家廢輴不用而猶設撥是徒有竊禮之罪而非有中用之實者也方氏曰為輴之重也故為榆沈以滑之欲榆沈之散也故設撥以發之無輴則無所用沈無所用沈則無所用撥三臣既知輴之可廢而不知撥之不必設是竊禮之不中者也撥雖無所經見然以文考之為榆沈故設撥則是以手撥榆沈而灑於道也先儒以為紼失之矣切今按方說如此亦未知其是否闕之可也䵍他昆撥半末切輴音春幬音道為去聲榆音于沈音審中去聲悼公之母死哀公為之齊衰有若曰為妾齊衰禮與公曰吾得已乎哉魯人以妻我以妻我以為我妻也此哀公溺情之舉文過之辭子諸侯絶旁期於妾無服惟大夫為貴戚緦疏曰天為去聲文去聲季子臯葬其妻犯人之禾申祥以告曰請庚之子臯曰孟氏不以是罪豫朋友不以是弃豫以吾為邑長於斯也買道而葬後難繼也劉氏曰季子臯孔子弟子髙柴也夫子嘗曰柴也愚觀家語所稱及此經所記泣血三年及成人為衰之事觀之賢可知矣此葬妻犯禾亦為成宰時事有無固不可知然曰孟氏不以是罪豫朋友不以是弃豫者以犯禾之失小而買道之害大也何也以我為邑宰尚買道而葬則後必為例而難乎為繼者矣此亦愚而過慮之一端然出於誠心非文飾之辭也鄭注謂其恃寵虐民而方氏又加以不仁不恕之說則甚矣豈有賢如子臯而有是哉文去聲仕而未有祿者君有饋焉曰獻使焉曰寡君違而君薨弗為服也王制云位定然後祿之此蓋初試為士未賦廩祿者有饋於君則稱獻出使他國則稱寡君此二事皆與羣臣同獨違離之後而君薨則不為舊君服此則與羣臣異所以然者後以其未嘗食君之祿也方氏曰湯之於伊尹學焉而臣之方其學也賔之而弗臣此所謂仕而未有祿者若孟子之在齊是也惟其賔之而弗臣故有饋焉不曰賜而曰獻將命之使不曰君而曰寡君蓋獻為貢上之辭而寡則自謙之辭故也以其有賔主之道而無君臣之禮故違而君薨弗為服也其曰違則居其國之時固服之矣使為並去聲虞而立尸有几筵未葬之前事以生者之禮葬則親形已藏故虞祭則立尸以象神也筵席也大斂之奠雖有席而無几此時則設几與筵相配也卒哭而諱生事畢而鬼事始已卒哭而諱其名蓋事生之禮已畢事鬼之事始矣已語辭既卒哭宰夫執木鐸以命于宫曰舍故而諱新自寢門至於庫門周禮大喪小喪宰夫掌其戒令故卒哭後使宰夫執金口木舌之鐸振之以命令于宫也其令之之辭曰舍故而諱新故謂髙祖之父當遷者諱多則難避故使之舍舊諱而諱新死者之名也以其親盡故可不諱庫門自外入之第一門亦曰臯門舍上聲二名不偏諱夫子之母名徵在言在不稱徵言徵不稱在二名二字為名也此記避諱之禮軍有憂則素服哭于庫門之外赴車不載櫜韔櫜甲衣韔弓衣甲不入櫜弓不入韔示再用也服方氏曰戰勝而還謂之愷則敗謂之憂宜矣素哭以喪禮處之也必於庫門之外者以近廟也師出受命于祖無功則於祖命辱矣赴車告赴於國之車凡告喪曰赴車以告敗為名與素服同義櫜音髙有焚其先人之室則三日哭故曰新宫火亦三日哭先人之室宗廟也魯成公三年焚宣公之廟神主初入故曰新宫春秋書二月甲子新宫災三日哭注云書其得禮此言故曰者謂春秋文也孔子過泰山側有婦人哭於墓者而哀夫子式而聽之使子路問之曰子之哭也一似重有憂者而曰然昔者吾舅死於虎吾夫又死焉今吾子又死焉夫子曰何為不去也曰無苛政夫子曰小子識之苛政猛於虎也聞其哭式而聽之與見齊衰者雖狎必變之意同聖人敬心之所發蓋有不期然而然者一似重有憂者言甚似重叠有憂苦者也而曰乃曰也虎之殺人出於倉卒之不免苛政之害雖未至死而朝夕有愁思之苦不如速死之為愈此所以猛於虎也為人上者可不知此哉音重平聲識音志卒猝魯人有周豐也者哀公執摯請見之而曰不可公曰我其已夫使人問焉曰有虞氏未施信於民而民信之夏后氏未施敬於民而民敬之何施而得斯於民也對曰墟墓之閒未施哀於民而民哀社稷宗廟之中未施敬於民而民敬殷人作誓而民始畔周人作會而民始疑茍無禮義忠信誠慤之心以涖之雖固結之民其不解乎周豐必賢而隱者故哀公屈己見之乃曰不可者蓋古者不為臣不見故不敢當君之臨見也我其已夫已止也不强其所不願也有心之固結不若無心之感孚其言甚正但大禹征苗已嘗誓師誓非始於殷也禹㑹諸侯於塗山㑹亦不始於周也此言誓之而畔㑹之而疑則始於殷周耳切摯音至解佳買强上聲喪不慮居毁不危身喪不慮居為無廟也毁不危身為無後也劉氏曰喪禮稱家之有無不可勉為厚葬而致有敗家之慮家廢則宗廟不能以獨存矣毁不滅性不可過為哀毁而致有亡身之危以死傷生則君子謂之無子矣此二者皆所以防賢者之過禮為去聲稱去聲延陵季子適齊於其反也其長子死葬於嬴博之閒孔子曰延陵季子吳之習於禮者也往而觀其葬焉吳公子札讓國而居延陵故曰延陵季子嬴博齊二邑名其坎深不至於泉其斂以時服既葬而封廣輪掩坎其高可隱也既封左袒右還其封且號者三曰骨肉歸復于土命也若魂氣則無不之也無不之也而遂行孔子曰延陵季子之於禮也其合矣乎不至於泉謂得淺深之宜也時服隨死時之寒暑所衣也封築土為墳也橫曰廣直曰輪下則僅足以掩坎上則才至於可隱皆儉制也左袒以示陽之變右還以示隂之歸骨肉之歸土隂之降也魂氣之無不之陽之升也隂陽氣也命者氣之所鍾也季子以骨肉歸復于土為命者此精氣為物之有盡謂魂氣則無不之者此遊魂為變之無方也壽夭得於有生之初可以言命魂氣散於既死之後不可以言命也再言無不之也者愍傷離訣之至情而冀其魂之隨己以歸也不惟適旅葬之節而又且通幽明之故宜夫子之善之也然為疑辭而不為決辭者蓋季子乃隨時處中之道稱其有無而不盡拘乎禮者也故夫子不直曰季子之於禮也合矣而必加其乎二字使人由辭以得意也讀者詳之石梁王氏曰還與環周聲深去聲封如字廣隱並去聲號平處上聲稱去聲邾婁考公之喪徐君使容居來弔含曰寡君使容居坐含進侯玉其使容居以含考公之喪徐國君使其臣容居者來弔且致珠玉之含言寡君使我親坐而行含以進侯玉於邾君侯玉者徐自擬天子以邾君為己之諸侯言進侯氏以玉也其使容居以含者容居求即行含禮也疏曰凡行含禮未斂之前士則主人親含大夫以上即使人含若斂後至殯葬有來含者親自致璧於柩及殯上者謂之親含若但致命以璧授主人主人受之謂之不親含石梁王氏曰坐當訓跪婁音閭含去聲使去聲有司曰諸侯之來辱敝邑者易則易于則于易于雜者未之有也邾之有司拒之言諸侯之辱來邾國者人臣來而其事簡易則行人臣簡易之禮人君來而其事廣大則行人君廣大之禮于猶迂也有廣逺之意今人臣來而欲行人君之禮是易于相雜矣我國未有此也易音異容居對曰容居聞之事君不敢忘其君亦不敢遺其祖昔我先君駒王西討濟於河無所不用斯言也容居魯人也不敢忘其祖容居又答言事君者不敢忘其君我奉命如此今不能行是忘吾君也為人子孫當守先世之訓故亦不敢遺吾祖也居蓋徐之公族耳且言昔者我之先君駒王濟河而西討無一處不用此稱王之言自言其疆土廣大久已行王者之禮也又自言我非譎詐者乃魯鈍之人是以不敢忘吾祖欲邾人之信其言也此著徐國君臣之僭且明邾有司不能終正當時之僭也子思之母死於衛赴於子思子思哭於廟門人至曰庶氏之母死何為哭於孔氏之廟乎子思曰吾過矣吾過矣遂哭於他室伯魚卒其妻嫁於衛之庶氏嫁母與廟絶族故不得哭之於廟天子崩三日祝先服五日官長服七日國中男女服三月天下服疏曰祝大祝商祝也服服杖也是喪服之數故呼杖為服祝佐含斂先病故先杖也故子亦三日而杖官長大夫士也病在祝後故五日國中男女謂畿內民及庶人在官者服齊衰三月而除必待七日者天子七日而殯殯後嗣王成服故民得成服也三月天下服者謂諸侯之大夫為王繐衰既葬而除近者亦不待三月今據逺者為言耳何以知其或杖服或衰服按喪大記及喪服四制云云然四制云七日授士杖此云五日士杖者崔氏云此據朝廷之士四制言邑宰之士也大音泰為王為去聲虞人致百祀之木可以為棺椁者斬之不至者廢其祀刎其人虞人掌山澤之官也天子之棺四重而椁周焉亦奚以多木為哉畿內百縣之祀其木可用者悉斬而致之無乃太多乎畿內之美材固不乏矣奚獨於祠祀斬之乎廢其祀刎其人又何法之峻乎禮制若此未詳其說一云必命虞人致木不用命者然後國有常刑虞人非一未必盡命之也齊大饑黔敖為食於路以待餓者而食之有餓者蒙袂輯屨貿貿然來黔敖左奉食右執飲曰嗟來食揚其目而視之曰豫唯不食嗟來之食以至於斯也從而謝焉終不食而死曾子聞之曰微與其嗟也可去其謝也可食蒙袂以袂蒙面也輯屨輯斂其足言困憊而行蹇也貿貿垂頭喪氣之貌嗟來食歎閔之而使來食也從就也微與猶言細故未節謂嗟來之言雖不敬然亦非大過故其嗟雖可去而謝焉則可食矣與食之食音嗣餘並如字輯音集貿音茂奉上聲平聲喪去聲邾婁定公之時有弒其父者有司以告公瞿然失席曰是寡人之罪也曰寡人嘗學斷斯獄矣臣弒君凡在官者殺無赦子弒父凡在宫者殺無赦殺其人壞其室汙其宫而豬焉蓋君踰月而后舉爵瞿然驚怪之貌在官者諸臣也在宫者家人也天下之惡無大於此者是以人皆得以誅之無赦之之理惟父有此罪則子不可討之也君不舉爵以人倫大變亦教化不明所致故傷悼而自貶耳父疏曰豬是水聚之名石梁王氏曰注疏本作子弒凡在宫者殺無赦為是壞瞿音屨斷丁玩切音怪汙音烏晉獻文子成室晉大夫發焉張老曰美哉輪焉美哉奐焉歌於斯哭於斯聚國族於斯文子曰武也得歌於斯哭於斯聚國族於斯是全要領以從先大夫於九亰也北面再拜稽首君子謂之善頌善禱晉獻舊說謂晉君獻之謂賀也然君有賜於臣豈得言獻疑獻文二字皆趙武諡如貞惠文子之類諸大夫發禮往賀記者因述張老之言輪輪囷高大也奐奐爛衆多也歌祭祀作樂也哭死喪哭泣也聚國族燕集國賔聚會宗族也頌者美其事而祝其福禱者祈以免禍也張老之言善於頌武子所答善於禱也鄭氏曰晉卿大夫之墓地在九原父疏曰領頸也古者罪重腰斬罪輕頸刑先大夫文子祖也石梁王氏曰歌於斯謂祭祀歌樂也大夫祭無樂春秋時或有之要平聲亰古原字仲尼之畜狗死使子貢埋之曰吾聞之也敝帷不弃為埋馬也敝蓋不弃為埋狗也丘也貧無蓋於其封也亦豫之席毋使其首陷焉狗馬皆有力於人故特示恩也聲畜許六切為去聲封音窆豫上路馬死埋之以帷謂君之乘馬死則特以帷埋之不用敝帷也方氏曰魯昭公乘馬塹而死以帷裹之季孫之母死哀公弔焉曾子與子貢弔焉閽人為君在弗內也曾子與子貢入於其廄而修容焉子貢先入閽人曰鄉者已告矣曾子後入閽人辟之鄉者已告言先已告於主人矣為去聲內入聲鄉去聲辟音避涉內霤卿大夫皆辟位公降一等而揖之君子言之曰盡飾之道斯其行者逺矣內霤門屋後簷也行者逺猶言感動之大也門劉氏曰此章可疑二子弔卿母之喪必自盡禮以造不當待閽者拒而後修容盡飾也且既至而閽人辭或當再請於閽若終不得通退可也何必以威儀悚動之以求入耶其入而君卿大夫敬之者以平日知其賢也非素不相知創見其容飾之美而加敬也而君子乃曰盡飾之道斯其行者逺則是二子之德行不足以行逺惟區區之外飾乃足以行逺耶辟音避造七到切陽門之介夫死司城子罕入而哭之哀晉人之覘宋者反報於晉侯曰陽門之介夫死而子罕哭之哀而民說殆不可伐也陽門宋之國門名介夫甲士之守衛者宋武公諱司空改其官名為司城子罕樂喜也戴公之後覘窺視也說音悅孔子聞之曰善哉覘國乎詩云凡民有喪扶服救之雖微晉而已天下其孰能當之孔子善之以其識治體也詩邶風谷風之篇扶服致力之義微無也夫子引詩而言宋國雖以子罕得人心可無晉憂而已然天下亦孰能當之甚言人心之足恃也一說微弱也雖但弱晉之强使不敢伐而已然推此意則民既悅服必能親其上死其長而舉天下莫能當之矣前說為是音扶服匍匐魯莊公之喪既葬而絰不入庫門士大夫既卒哭麻不入莊公為子般所弒而慶父作亂閔公時年八嵗絰葛絰也諸侯辨絰葛而葬葬畢閔公即除凶服於庫門之外而以吉服嗣位故云絰不入庫門也士大夫則仍麻絰直俟卒哭乃不以麻絰入庫門蓋閔公既吉服不與虞與卒哭之祭故羣臣至卒哭而除記禍亂恐迫禮所由廢為去聲般音斑父音甫不與與去聲孔子之故人曰原壤其母死夫子助之沐椁原壤登木曰久矣豫之不託於音也歌曰貍首之斑然執女手之卷然夫子為弗聞也者而過之從者曰子未可以已乎夫子曰丘聞之親者毋失其為親也故者毋失其為故也或問朱子原壤登木而歌夫子為弗聞而過之待之自好及其夷俟則以杖叩脛莫太過否曰這說却差如壤之歌乃是大惡若要理會不可但已只得且休至其夷俟之時不可不教誨故直責之復叩其脛自當如此若如今說則是不要管他却非朋友之道矣胡氏曰數其母死而歌則壤當絶叩其夷踞之脛則壤猶故人耳盛德中禮見乎周旋此亦可見以馮氏曰母死而歌惡有大於此者乎宜絶而不絶蓋平生之素而事有出於一時之不意者如此善乎朱子之言曰若要理㑹不可但已只得且休其有以深得聖人之處其所難處者矣而劉氏曰原壤母卒夫子助之治椁壤登已治之椁木言久矣我之不託興於詠歌之音也如貍首之斑言木文之華也卷與拳同如執女手之拳言沐椁之滑膩也壤之廢敗禮法甚矣夫子佯為不聞而過去以避之從者見其無禮疑夫子必當已絶其交故問曰子未當已絶之乎夫子言為親戚者雖有非禮未可遽失其親戚之情也為故舊者雖有非禮未可遽失其故舊之好也此聖人隱惡全交之意卷音拳從去聲數上聲中去聲見乎見音現處上聲興去聲趙文子與叔譽觀乎九原文子曰死者如可作也吾誰與歸文子晉大夫名武叔譽叔向也言卿大夫之死而葬於此者多矣假令可以再生而起吾於衆大夫誰從乎文子蓋設此說欲與叔向共論前人賢否也令平聲叔譽曰其陽處父乎文子曰行并植於晉國不沒其身其知不足稱也處父晉襄公之傅并者兼衆事於己是專權也植者剛强自立之意所行如此故為狐射姑所殺不得善終其身是不智也處上聲并去聲植直吏切知去聲射音亦其舅犯乎文子曰見利不顧其君其仁不足稱也叔譽又稱子犯可歸文子言子犯從文公十九年于外及反國危疑之時當輔之入以定其事乃及河而授璧以辭此蓋為他日高爵重祿之計故以此言要君求利也豈顧其君之安危哉是不仁也為去聲要平聲我則隨武子乎利其君不忘其身謀其身不遺其友晉人謂文子知人文子自言我所願歸者惟隨武子乎武子士㑹也食邑於隨左傳言夫子之家事治言於晉國無隱情蓋不忘其身而謀之知也利其君不遺其友皆仁也文子其中退然如不勝衣其言呐呐然如不出諸其口中身也見儀禮鄉射記退然謙卑怯弱之貌呐呐聲低而語緩也如不出諸其口似不能言者勝平聲呐如劣切所舉於晉國管庫之士七十有餘家生不交利死不屬其子焉管鍵也即今之鎖庫之藏物以管為開閉之限管庫之士賤職也知其賢而舉之即不遺友之實雖有舉用之恩於其人而生則不與之交利將死亦不以其子屬託之廉潔之至屬音燭叔仲皮學子柳叔仲皮死其妻魯人也衣衰而繆絰叔仲衍以告請繐衰而環絰曰昔者吾喪姑姊妹亦如斯未吾禁也退使其妻繐衰而環絰繆絞也謂兩股相交五服之絰皆然惟弔服之環絰一股疏曰言叔仲皮教訓其子子栁而子栁猶不知禮叔仲皮死子柳妻雖是魯鈍婦人猶知為舅著齊衰而首服繆絰衍是皮之弟子栁之叔見當時婦人好尚輕細告子柳云汝妻何以著非禮之服子柳見時皆如此亦以為然乃請於衍令其妻身著繐衰首服環絰衍又答云昔者吾喪姑姊妹亦如此繐衰環絰無人相禁止也子柳得衍此言退使其妻著繐衰而環絰學音效衣音咨繆音樛繐音嵗成人有其兄死而不為衰者聞子臯將為成宰遂為衰成人曰蠶則績而蟹有匡范則冠而蟬有緌兄則死而子臯為之衰成魯邑名匡背殼似匡也范蜂也朱氏曰絲之績者必由乎匡之所盛然蟹之有匡非為蠶之績也為背而已首之冠者必資乎緌之所飾然蟬之有緌非為范之冠也為喙而已兄死者必為之服衰然成人之服衰非為兄之死也為子臯而已蓋以上二句喻下句也緌而追切盛平聲注中為並去聲樂正子春之母死五日而不食曰吾悔之自吾母而不得吾情吾惡乎用吾情子春曽子弟子矯為過制之禮而不用其實情於母則他無所用其實情矣此所以悔也嵗旱穆公召縣子而問然曰天久不雨吾欲暴尩而奚若左傳注云尩者瘠病之人其面上向暴之者冀天哀之而雨也同雨去聲暴步卜切下二節尩音汪曰天則不雨而暴人之疾子句虐句毋乃不可與此言酷虐之事非所以感天與平聲然則吾欲暴巫而奚若巫能接神冀神閔之而雨曰天則不雨而望之愚婦人句於以求之毋乃已疏乎於以求之猶言於此求之也已疏言甚迂濶也徙市則奚若曰天子崩巷市七日諸侯薨巷市三日為之徙市不亦可乎徙移也言徙市又言巷市者謂徙交易之物於巷也此庶人為國之大喪憂戚罷市而日用所須又不可缺故徙市於巷也今旱而欲徙市者行喪君之禮以自責也縣子以其求之已而不求諸人故可其說然豈不聞僖公以大旱欲焚巫尩聞臧文仲之言而止縣子不能舉其說以對穆公而謂徙市為可則亦已疏矣為去聲孔子曰衛人之祔也離之魯人之祔也合之善夫生既同室死則同穴故善魯於疏曰祔合葬也離之謂以一物隔二棺之閒椁中也魯人則合並兩棺置椁中無别物隔之全朱子曰古者椁合衆材為之故大小隨人所為今用木則無許大木可以為椁故合葬者只同穴而各用椁也禮記集說卷二
