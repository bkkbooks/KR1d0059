body:
  text: 禮記集說卷四元陳澔撰曽子問第七曽子問曰君薨而世子生如之何孔子曰卿大夫士從攝主北面於西階南大祝裨冕執束帛升自西階盡等不升堂命毋哭攝主上卿之代主國事者也裨冕者天子諸侯六服大裘為上其餘為裨服裨衣而著冕故云禆冕也等即階也裨音皮毋音無著入聲祝聲三告曰某之子生敢告升奠幣于殯東几上哭降衆主人卿大夫士房中皆哭不踊盡一哀反位遂朝奠小宰升舉幣祝為噫歆之聲者三以警動神聽乃告之也噫是歎恨之聲歆者欲其歆饗之義也某夫人之氏也房中婦人也升舉幣舉而埋之兩階之閒也三去聲三日衆主人卿大夫士如初位北面大宰大宗大祝皆裨冕少師奉子以衰祝先子從宰宗人從入門哭者止子升自西階殯前北面祝立于殯東南隅祝聲三曰某之子某從執事敢見子拜稽顙哭祝宰宗人衆主人卿大夫士哭踊三者三降東反位皆袒子踊房中亦踊三者三襲衰杖奠出大宰命祝史以名遍告于五祀山川如初位者如初告子生之位次也少師主養子之官奉子以衰以衰服承藉而捧之也告曰夫人某氏之子某從執事宰宗人等敢見子名則大宰所立也告訖捧子之人拜而稽顙且哭凡踊三度為一節如此者三故云三者三降東反位者堂上人皆從西階降而反東在下者亦皆東而反其朝夕之哭位也踊而襲衰杖成其為子之禮也奠出朝奠畢而出也大宰大宗大祝大音泰少去聲奉上聲衰音催從去聲三去聲見音現曽子問曰如已葬而世子生則如之何孔子曰大宰大宗從大祝而告于禰三月乃名于禰以名遍告及社稷宗廟山川告于禰告其主也此時神主在殯宫因見禰而立其名故云乃名于禰也孔子曰諸侯適天子必告于祖奠于禰冕而出視朝命祝史告于社稷宗廟山川乃命國家五官而后行道而出告者五日而遍過是非禮也凡告用牲幣反亦如之告于祖亦告于禰奠于禰亦奠于祖也奠者奠幣為禮而告之也視朝聽事之後即遍告羣祀戒命五大夫之職事使無廢弛也諸侯有三卿五大夫道而出者祖祭道神而后出行也五祀之行神則在宫內月令冬祀行是也喪禮毁宗躐行則行神之位在廟門外西方若祭道路之行神謂之軷於城外委土為山之形伏牲其上祭告禮畢乘車轢之而遂行也其神曰纍其牲天子犬諸侯羊卿大夫酒脯而已長一丈八尺為制幣牲音制諸侯相見必告于禰朝服而出視朝命祝史告于五廟所過山川亦命國家五官道而出反必親告于祖禰乃命祝史告至于前所告者而后聽朝而入上章言冕而出視朝此言朝服而出視朝者按覲禮侯氏裨冕今敬君欲豫習其禮故冕服以視朝諸侯相朝非君臣也故但朝服而已諸侯朝服𤣥冠緇衣素裳而聘禮云諸侯相聘皮辨服則相朝亦皮辨服矣天子以皮辨服視朝故謂之朝服也曽子問曰並有喪如之何何先何後孔子曰葬先輕而後重其奠也先重而後輕禮也自啓及葬不奠行葬不哀次反葬奠而后辭於殯遂修葬事其虞也先重而後輕禮也曽子問同時有父母或祖父母之喪先後之次如何孔子言葬則先母而後父奠則先父而後母自從也從啓母殯之後及至葬柩欲出之前惟設母啓殯之奠朝廟之奠及祖奠遣奠而已不於殯宫為父設奠故云自啓及葬不奠謂不奠父也次者大門外之右平生待賔客之處柩至此則孝子悲哀柩車暫停今為父喪在殯故行葬母之時孝子不得為母伸哀於所次之處故柩車不暫停也及葬母而反即於父殯設奠告語於賔以明日啓父殯之期賔出之後孝子遂修營葬父之事也葬是奪情之事故先輕奠是奉養之事故先重也虞祭亦奠之類故亦先重殯音賔朝晉潮遣為養並去聲孔子曰宗子雖七十無無主婦非宗子雖無主婦可也宗子領宗男於外宗婦領宗女於內禮不可缺故雖七十之年猶必再娶然此謂大宗之無子或子幼者若有子有婦可傳繼者則七十可不娶矣曽子問曰將冠子冠者至揖讓而入聞齊衰大功之喪如之何孔子曰內喪則廢外喪則冠而不醴徹饌而掃即位而哭如冠者未至則廢冠者賔與贊禮之人也此人已及門而與主人揖讓以入矣主人忽聞齊衰大功之喪何以處之夫子言若是大門內之喪則廢而不行以冠禮行之於廟廟在大門之內吉凶不可同處也若是大門外之喪喪在他處可以加冠但冠禮三加之後設醴以禮新冠之人今值凶事止三加而止不醴之也初欲迎賔之時醴及饌具皆陳設今悉徹去又掃除冠之舊位使淨潔更新乃即位而哭如賔與贊者未至則廢也冠掃並去聲如將冠子而未及期日而有齊衰大功小功之喪則因喪服而冠除喪不改冠乎孔子曰天子賜諸侯大夫冕辨服於大廟歸設奠服賜服於斯乎有冠醮無冠醴父沒而冠則已冠掃地而祭於禰已祭而見伯父叔父而后饗冠者未及期日在期日之前也因喪服而冠者因著喪之成服而加喪冠也此是孔子之言曽子又問他日除喪之後不更改易而行吉冠之禮乎孔子答云諸侯及大夫有幼弱未冠總角從事至當冠之年因朝天子天子於大廟中賜冕服辨服其受賜者榮君之命歸即設奠告廟服所賜之服矣於此之時惟有冠之醮無冠之醴醮是以酒為燕飲醴則獨禮受服之人也其禮如此安得有除喪改冠之禮乎父沒而冠謂除喪之後以吉禮禮冠者蓋齊衰以下可因喪服而冠斬衰不可謂疏曰吉冠是吉時成人之服喪冠是喪時成人之服之醮者酌而無酬酢曰醮醴重而醮輕者醴是古之酒故為重醮之所以異於醴者三加之後總一醴之醮則每一加而行一醮也大廟大音泰掃去聲見音現曽子問曰祭如之何則不行旅酬之事矣孔子曰聞之小祥者主人練祭而不旅奠酬於賔賔弗舉禮也昔者魯昭公練而舉酬行旅非禮也孝公大祥奠酬弗舉亦非禮也曽子問祭而不行旅酬之禮何祭為然孔子言惟小祥練祭為然不旅者不旅酬也奠酬於賔奠其酬爵於賔前也賔弗舉者賔不舉以旅也言此祭主人得致爵於賔賔不可舉此爵而行旅酬此禮也大祥則可旅酬矣孝公隱公之祖子朱子曰旅衆也酬導飲也旅酬之禮賔弟子兄弟之各舉觶於其長而衆相酬蓋宗廟之中以有事為榮故逮及賤者使亦得以伸其敬也又曰主人酌以獻賔賔酢主人曰酢主人又自飲而復飲賔曰酬主人自飲者是導賔使飲也但賔受之却不飲奠於席前至旅時亦不舉又自别舉爵曽子問曰大功之喪可以與於饋奠之事乎孔子曰豈大功耳自斬衰以下皆可禮也曽子曰不以輕服而重相為乎孔子曰非此之謂也天子諸侯之喪斬衰者奠大夫齊衰者奠士則朋友奠不足則取於大功以下者不足則反之饋奠奠於殯也大夫朔望皆有殷奠士惟月朔其禮盛故執事者衆曽子問己有大功之喪可與他人饋奠之事乎孔子將謂曽子問己有大功之喪得為大功者饋奠否故答云豈但大功自斬衰以下皆可禮也言身有斬衰所為者斬衰身有齊衰所為者齊衰皆可與其饋奠孔子是據所服者言之曽子又不悟此㫖將謂言他人乃曰不太輕己之服而重於相為乎孔子又答云非此為他人之謂也謂於所為服者也凡喪奠主人以悲哀不暇執事故不親奠天子諸侯之喪諸臣皆斬衰故云斬衰者奠大夫則兄弟之服齊衰者奠士不以齊衰者奠避大夫也故朋友奠人不充數則取大功以下又不足則及取大功以上也之疏曰反之者反取前人執事者充與為並去聲曽子問曰小功可以與於祭乎孔子曰何必小功耳自斬衰以下與祭禮也曽子曰不以輕喪而重祭乎孔子曰天子諸侯之喪祭也不斬衰者不與祭大夫齊衰者與祭士祭不足則取於兄弟大功以下者大㫖與上章同但此問與於祭則是虞與卒哭之祭曽子問曰相識有喪服可以與於祭乎孔子曰緦不祭又何助於人所知識之人有祭事而已有喪服可以助為之執事否夫子言己有緦麻之服服之輕者也尚不得自祭己之宗廟何得助他人之祭乎曽子問曰廢喪服可以與於饋奠之事乎孔子曰說衰與奠非禮也以擯相可也廢猶除也饋奠在殯之奠也不問吉祭而問喪奠曽子之意謂方除喪服決不可與吉禮疑可與饋奠也夫子言方說衰即與奠是忘哀太速故言非禮也擯相事輕亦或可耳說音脫相去聲曽子問曰昏禮既納幣有吉日女之父母死則如之何孔子曰壻使人弔如壻之父母死則女之家亦使人弔父喪稱父母喪稱母父母不在則稱伯父世母壻已葬壻之伯父致命女氏曰某之子有父母之喪不得嗣為兄弟使某致命女氏許諾而弗敢嫁禮也壻免喪女之父母使人請壻弗取而后嫁之禮也有吉日者期日已定也彼是父喪則此稱父之名弔之彼是母喪則此稱母之名弔之父母或在他所則稱伯父伯母名如無伯父母則用叔父母名可知壻雖已葬其親而喪期尚逺不欲使彼女失嘉禮之時故使人致命使之别嫁他人某之子此某字是伯父之名不得嗣為兄弟者言繼此不得為夫婦也夫婦同等有兄弟之義亦親之之辭不曰夫婦者未成昏嫌也使某致命此某字是使者之名致如致仕之致謂致還其許昏之命也女氏雖許諾而不敢以女嫁於他人禮也及壻祥禫之後女之父母使人請壻成昏壻終守前說而不取而后此女嫁於他族禮也取如字女之父母死壻亦如之女之父母死女之伯父致命於男氏曰某之子有父母之喪不得嗣為兄弟使某致命男氏許諾而不敢娶女免喪壻之父母使人請女家不許壻然後别娶也曽子問曰親迎女在塗而壻之父母死如之何孔子曰女改服布深衣縞總以趨喪女在塗而女之父母死則女反嫁服士妻褖衣大夫妻展衣卿妻鞠衣改服更其嫁服也衣與裳相連而前後深邃故曰深衣縞生白絹也總束髮也長八寸布為深衣縞為總婦人始喪未成服之服也故服此以奔舅姑之喪女子在室為父三年父卒亦為母三年已嫁則期今既在塗非在室矣則止用奔喪之禮而服期改服亦布深衣縞總也迎去聲褖音彖更平聲如壻親迎女未至而有齊衰大功之喪則如之何孔子曰男不入改服於外次女入改服於內次然後即位而哭曽子問曰除喪則不復昏禮乎孔子曰祭過時不祭禮也又何反於初此齊衰大功之喪謂壻家也改服改其親迎之服而服深衣於門外之次也女謂婦也入門內之次而以深衣更其嫁服也此特問齊衰大功之喪者以小功及緦輕不廢昏禮禮畢乃哭耳若女家有齊衰大功之喪女亦不反歸也曽子又問除喪之後豈不復更為昏禮乎孔子言祭重而昏輕重者過時尚廢輕者豈可復行乎然此亦止謂四時常祭耳禘祫大祭過時猶追也孔子曰嫁女之家三夜不息燭思相離也取婦之家三日不舉樂思嗣親也三月而廟見稱來婦也擇日而祭於禰成婦之義也思相離則不能寢寐故不滅燭思嗣親則不無感傷故不舉樂此昏禮所以不賀也成昏而舅姑存者明日婦見舅姑若舅姑已歿則成昏三月乃見於廟祝辭告神曰某氏來婦來婦言來為婦也蓋選擇吉日而行此禮廟見祭禰即是一事非見廟之後更擇日而祭也成婦之義者成盥饋之禮之義也離取並去聲見音現曽子問曰女未廟見而死則如之何孔子曰不遷於祖不附於皇姑壻不杖不菲不次歸葬于女氏之黨示未成婦也不遷於祖不遷柩而朝於壻之祖廟也不附於皇姑以未廟見故主不得祔姑之廟也壻齊衰期但不杖不草屨不别處哀次耳女之父母自降服大功菲扶畏切曽子問曰取女有吉日而女死如之何孔子曰壻齊衰而弔既葬而除之夫死亦如之若夫死女以斬衰往弔既葬而除也取去聲曽子問曰喪有二孤廟有二主禮與孔子曰天無二日土無二王嘗禘郊社尊無二上未知其為禮也二孤二主當時有之曽子疑其非禮故問夫子言天猶不得有二日土猶不得有二王嘗禘郊社祭之重者各有所尊不可混并而祭之喪可得有二孤廟可得有二主乎非禮明矣與平聲并去聲昔者齊桓公亟舉兵作僞主以行及反藏諸祖廟廟有二主自桓公始也師行而載遷廟之主于齊車示有所尊奉也既作僞主又藏於廟是二主矣喪之二孤則昔者衛靈公適魯遭季桓子之喪衛君請弔哀公辭不得命公為主客入弔康子立於門右北面公揖讓升自東階西鄉客升自西階弔公拜興哭康子拜稽顙於位有司弗辨也今之二孤自季康子之過也國君弔鄰國之臣尊卑不等衛君弔而哀公為主禮也禮大夫既殯而君來弔主人門右北面哭拜稽顙今既哀公為主主則拜賔康子但當哭踊而已乃拜而稽顙於位是二孤矣當時有司不能論而正之遂至循襲為常變禮之失由於康子上章言自桓公始此不言始而言過者孔子康子同時也靈公先桓子卒經訛為靈公實出公也曽子問曰古者師行必以遷廟主行乎孔子曰天子巡守以遷廟主行載于齊車言必有尊也今也取七廟之主以行則失之矣遷廟主謂新祧廟之主也齊車金路也又名曰公禰皆守去聲齊側切當七廟五廟無虛主虛主者惟天子崩諸侯薨與去其國與祫祭於祖為無主耳吾聞諸老􅖫曰天子崩國君薨則祝取羣廟之主而藏諸祖廟禮也卒哭成事而后主各反其廟崩薧而羣主皆聚祖廟以喪三年不祭且象生者為凶事而聚集也此馮氏曰鄭注老􅖫古夀考者之稱石梁先生曰老􅖫非作五千言者􅖫音貪君去其國太宰取羣廟之主以從禮也去國而羣廟之主皆行不敢棄其先祖也去從聲祫祭於祖則祝迎四廟之主主出廟入廟必蹕老􅖫云諸侯五廟祫祭則迎高曽祖禰入太祖之廟主出入而蹕止行人不欲其瀆也曽子問曰古者師行無遷主則何主孔子曰主命問曰何謂也孔子曰天子諸侯將出必以幣帛皮圭告于祖禰遂奉以出載于齊車以行每舍奠焉而后就舍反必告設奠卒斂幣玉藏諸兩階之閒乃出蓋貴命也既以幣玉告于祖廟則奉此幣玉猶奉祖宗之命也故曰主命每舍必奠神之也反則設奠以告而埋藏之不敢褻也子游問曰喪慈母如母禮與孔子曰非禮也古者男子外有傅內有慈母君命所使教子也何服之有妾之無子者養妾子之無母者謂之慈母然天子諸侯不為庶母服大夫妾子父在為其母大功士之妾子父在為其母期是與己母同也何服之有謂天子諸侯也故下文舉國君之事證之喪平聲為去聲昔者魯昭公少喪其母有慈母良及其死也公弗忍也欲喪之有司以聞曰古之禮慈母無服今也君為之服是逆古之禮而亂國法也若終行之則有司將書之以遺後世無乃不可乎公曰古者天子練冠以燕居公弗忍也遂練冠以喪慈母喪慈母自魯昭公始也良善也古者周以前也天子諸侯之庶子為天子諸侯者為其母緦春秋有以小君之禮服之者以子貴而伸也然必適小君沒若適小君在則其母厭屈故練冠也此言練冠以燕居謂庶子之為王者為其母耳壓少喪並去聲下喪並如字為如字厭音曽子問曰諸侯旅見天子入門不得終禮廢者幾孔子曰四請問之曰大廟火日食后之喪雨霑服失容則廢如諸侯皆在而日食則從天子救日各以其方色與其兵大廟火則從天子救火不以方色與兵旅衆也色衣之色也東方諸侯衣青南方諸侯衣赤餘倣此東方用㦸南方矛西方弩北方楯中央鼓日食是隂侵陽故正五行之方色以厭勝之救火不關此義也大見音現幾如字音泰厭音壓曽子問曰諸侯相見揖讓入門不得終禮廢者幾孔子曰六請問之曰天子崩大廟火日食后夫人之喪雨霑服失容則廢大廟本國之大廟也夫人小君也曽子問曰天子嘗禘郊社五祀之祭簠簋既陳天子崩后之喪如之何孔子曰廢嘗禘宗廟之祭郊社天地之祭此言五祀而祭法言七祀先儒已言祭法不足據矣曽子問曰當祭而日食大廟火其祭也如之何孔子曰接祭而已矣如牲至未殺則廢接捷也速疾之義此言宗廟之祭遇此變異則減略節文務在速畢無迎尸於奧及迎尸入坐等禮矣坊本廢上有曰字天子崩未殯五祀之祭不行既殯而祭其祭也尸入三飯不侑酳不酢而已矣自啓至于反哭五祀之祭不行已葬而祭祝畢獻而已天子諸侯之祭禮亡不可聞其詳矣先儒以大夫士祭禮推之士祭尸九飯大夫祭尸十一飯則知諸侯十三飯天子十五飯也五祀外神不可以己私喪久廢其祭若當祭之時而天子崩則止而不行俟殯訖乃祭然其禮則殺矣侑勸也尸入迎尸而入坐也三飯不侑者尸三飯告飽則止祝更不勸侑其食使滿足當飯之數也酳食畢而以酒漱口也說見曲禮按特牲禮尸九飯畢主人酌酒酳尸尸飲卒爵酢主人主人受酢飲畢酌獻祝祝飲畢主人又酌獻佐食今云酳不酢者無酢主人以下等事也此是言殯後祭五祀之禮又言自啓殯往葬及葬畢反哭其間亦不祭五祀直待葬後乃祭其禮又不同蓋葬後哀稍殺漸向吉故祝侑尸食至十五飯攝主酳尸尸飲卒爵而酢攝主攝主飲畢酌而獻祝祝受而飲畢則止無獻佐食以下之事故云祝畢獻而已已止也酳以刃切曽子問曰諸侯之祭社稷俎豆既陳聞天子崩后之喪君薨夫人之喪如之何孔子曰廢自薨比至于殯自啓至于反哭奉帥天子比及也曽子所問如此孔子曰廢又言自薨至殯自啓至反哭皆帥循天子之禮者謂諸侯既殯而祭社稷或五祀者亦如天子殯後祭五祀之禮也其葬後而祭社稷五祀者亦如天子葬後祭五祀之禮也比音畀帥入聲曽子問曰大夫之祭鼎俎既陳籩豆既設不得成禮廢者幾孔子曰九請問之曰天子崩后之喪君薨夫人之喪君之大廟火日食三年之喪齊衰大功皆廢外喪自齊衰以下行也其齊衰之祭也尸入三飯不侑酳不酢而已矣大功酢而已矣小功緦室中之事而已矣士之所以異者緦不祭所祭於死者無服則祭此言大夫宗廟之祭外喪在大門之外也三飯不侑酳不酢說見上章大功酢而已者大功服輕祭禮稍備十一飯之後主人酌酒酳尸尸酢主人即止也室中之事者凡尸在室之奧祝在室中北廂南面佐食在室中戶西北面但主人主婦及賔獻尸及祝佐食等三人畢則止也若平常之祭十一飯畢主人酳尸尸卒爵酢主人主人獻祝及佐食畢次主婦獻尸尸酢主婦主婦又獻祝及佐食畢次賔長獻尸尸得賔長獻爵則止不舉蓋奠其爵于薦之左也待致爵之後尸乃舉爵今以喪服殺禮故止於賔之獻也士卑於大夫雖緦服亦不祭所祭於死者無服謂如妻之父母母之兄弟姊妹已雖有服而已所祭者與之無服則可祭也今按致爵之禮賔獻尸三爵而止尸止爵之後執事者為主人設席于户內主婦酌爵而致于主人主人拜受爵主婦拜送爵主人卒爵拜主婦答拜受爵以酌而酢執爵拜主人答拜主人降洗爵以酌而致于主婦主婦之席在房中南面主婦拜受爵主人西面答拜而更爵自酌以酢此所謂致爵也祭統曰酢必易爵詳見特牲饋食禮曽子問曰三年之喪弔乎孔子曰三年之喪練不羣立不旅行君子禮以飾情三年之喪而弔哭不亦虛乎練小祥也旅衆也羣立旅行言及他事則為忘哀況於弔乎先王因人情而制禮隨其哀樂之情皆有以飾之苴衰絰杖為至痛飾也居重喪而弔哭於人哀彼則忘吾親哀在親則弔為矯僞矣非虛而何曽子既聞夫子此言矣而檀弓篇乃記其以喪母之齊衰而往哭於子張得非好事者為之辭歟曽子問曰大夫士有私喪可以除之矣而有君服焉其除之也如之何孔子曰有君喪服於身不敢私服又何除焉於是乎有過時而弗除也君之喪服除而后殷祭禮也君重親輕以義斷恩也若君服在身忽遭親喪則不敢為親制服初死尚不得成服終可行除服之禮乎此所以雖過時而不除也殷祭盛祭也君服除乃得為親行二祥之祭以伸孝心以其禮大故曰殷也假如此月除君服即次月行小祥之祭又次月行大祥之祭若親喪小祥後方遭君喪則他時君服除後惟行大祥祭也然此皆謂適子主祭而居官者若庶子居官而行君服適子在家自依時行親喪之禮他日庶子雖除君服無追祭矣曽子問曰父母之喪弗除可乎孔子曰先王制禮過時弗舉禮也非弗能勿除也患其過於制也故君子過時不祭禮也曽子之意以為適子仕者除君服後猶得追祭二祥庶子仕者雖除君服不復追祭是終身不除父母之喪矣可乎孔子言先王制禮各有時節過時不復追舉禮也今不追除服者不是不能除也患其踰越聖人之禮制也且如四時之祭當春祭時或以事故阻廢至夏則惟行夏時之祭不復追補春祭矣故過時不祭禮之常也惟禘祫大事則不然曽子問曰君薨既殯而臣有父母之喪則如之何孔子曰歸居于家有殷事則之君所朝夕否殷盛之事謂朔望及薦新之奠也君有此事則往適君所朝夕則不往哭曰君既啓而臣有父母之喪則如之何孔子曰歸哭而反送君啓啓殯也歸哭哭親喪也反送君復往送君之葬也此二節皆對言君親之喪若臣有父母之喪既殯而後有君喪則歸君所父母喪有殷事則來歸家朝夕亦恆在君所也若父母之喪既啓而有君之喪則亦往哭於君所而反送父母之葬也下文君未殯而臣有父母之喪亦與父母之喪未殯而有君喪互推之曰君未殯而臣有父母之喪則如之何孔子曰歸殯反于君所有殷事則歸朝夕否大夫室老行事士則子孫行事大夫內子有殷事亦之君所朝夕否室老家相之長也室老子孫行事者以大夫士在君所殷事之時或朝夕恆在君所則親喪朝夕之奠有缺然奠不可廢也大夫尊故使室老攝行其事士卑則子孫攝也內子卿大夫之適妻也為夫之君如為舅姑服齊衰故殷事亦之君所為去聲賤不誄貴幼不誄長禮也唯天子稱天以誄之諸侯相誄非禮也誄之為言纍也纍舉其平生實行為誄而定其諡以稱之也稱天以誄之者天子之尊無二惟天在其上故假天以稱之也人君之事多稱天不獨誄也長上聲曽子問曰君出疆以三年之戒以椑從君薨其入如之何孔子曰共殯服則子麻辨絰疏衰菲杖入自闕升自西階如小斂則子免而從柩入自門升自阼階君大夫士一節也曽子問國君以事出疆必為三年之戒備恐未得即返也於是以親身之棺隨行慮或死於外也若死於外則入之禮如何孔子言於時大斂之後主人從柩而歸則其國有司供主人殯時所著之服謂布深衣苴絰散帶垂也此時主人從柩在路未成服惟著麻辨絰疏衰而藨屨且杖也麻辨布辨也布辨之上加環絰也柩入之時毀殯宫門西邊牆而入其處空缺故謂之闕非門闕之闕也升自西階者以柩從外來有似賔客故就客階而升也如小斂而歸則子首不麻辨身不疏衰惟首著免布身著布深衣也入自門升自阼階者以親未在棺猶以事生之禮事之也凡君與大夫及士之卒於外者其禮皆一等無異制故云一節也音椑音劈從去聲下同共供菲扶畏切免音問曽子問曰君之喪既引聞父母之喪如之何孔子曰遂既封而歸不俟子遂遂送君柩也既窆而歸下棺而歸也不俟子不待孝子返而已先返也引去聲封音窆曽子問曰父母之喪既引及塗聞君薨如之何孔子曰遂既封改服而往遂遂送親柩也既窆之後改服而往者雜記云非從柩與反哭無免於堩此時孝子首著免乃去免而括髮徒跣布深衣而往不敢以私喪之服喪君也從去聲堩古鄧切曽子問曰宗子為士庶子為大夫其祭也如之何孔子曰以上牲祭於宗子之家祝曰孝子某為介子某薦其常事士特牲大夫少牢上牲少牢也庶子既為大夫當用上牲然必往就宗子家而祭者以廟在宗子家也孝子宗子也介子庶子也不曰庶而曰介者庶子卑賤之稱介則副二之義亦貴貴之道也薦其常事者薦其嵗之常事也為介為去聲少去聲若宗子有罪居於他國庶子為大夫其祭也祝曰孝子某使介子某執其常事攝主不厭祭不旅不假不綏祭不配介子非當主祭者故謂之攝主其禮略於宗子者有五焉若以祭禮先後之次言之當云不配不綏祭不假不旅不厭祭今倒言之者舊說攝主非正故逆陳以見義亦或記者之誤與今依次釋之不配者祭禮初行尸未入之時祝告神曰孝孫某來日丁亥用薦嵗事于皇祖伯某以某妃配某氏如姜氏子氏之類今攝主不敢備禮但言薦嵗事于皇祖伯某不言以某妃配也不綏祭者綏字當從周禮作隋減毁之名也尸與主人俱有隋祭主人減黍稷牢肉而祭之於豆閒尸則取葅及黍稷肺而祭於豆閒所謂隋祭也今尸自隋祭主人是攝主故不隋祭也不假者假字當作嘏福慶之辭也尸十一飯訖主人酳尸尸酢主人畢命祝嘏于主人曰皇尸命工祝承致多福無疆于女孝孫來女孝孫使女受祿于天宜稼于田眉夀萬年勿替引之主人再拜稽首今亦以避正主故不嘏也不旅不旅酬也詳見前章不厭祭者厭是饜飫之義謂神之歆享也厭有隂有陽隂厭者迎尸之前祝酌奠訖為主人釋辭於神勉其歆享此時在室奧陰靜之處故云陰厭也陽厭者尸謖之後佐食徹尸之薦俎設於西北隅得户明白之處故曰陽厭制禮之意不知神之所在於彼乎於此乎皆庶幾其享之而厭飫也此言不厭祭不為陽厭也以先後之次知之綏虛規切見音現隋音灰女音汝為主為去聲謖音速布奠於賔賔奠而不舉不歸肉其辭于賔曰宗兄宗弟宗子在他國使某辭主人酬賔之時賔在西廂東面主人布此奠爵於賔俎之北賔坐取此爵而奠於俎之南不舉之以酬兄弟此即不旅之事若宗子主祭則凡助祭之賔各歸之以俎肉今攝主故不歸俎肉於賔也非但祭不備禮其將祭之初告賔之辭亦異曰宗兄宗弟宗子在他國不得親祭故使某執其常事使某告也故云使某辭宗兄宗弟者於此攝主為兄或為弟也若尊卑不等或是祖父之列或是子孫之列則但謂之宗子矣曽子問曰宗子去在他國庶子無爵而居者可以祭乎孔子曰祭哉請問其祭如之何孔子曰望墓而為壇以時祭若宗子死告於墓而後祭於家宗子死稱名不言孝身沒而已子游之徒有庶子祭者以此若義也今之祭者不首其義故誣於祭也宗子無罪而去國則廟主隨行矣若有罪去國廟雖存庶子卑賤無爵不得於廟行祭禮但當祭之時即望墓為壇以祭也若宗子死則庶子告於墓而後祭於其家亦不敢稱孝子某但稱子某而已又非有爵者稱介子某之比也身沒而已者庶子身死其子則庶子之適子祭禰之時可稱孝也子游之門人有庶子祭者皆用此禮是順古義也今世俗庶子之祭者不能先求古人制禮之義而率意行之秪見其誣罔而已曽子問曰祭必有尸乎若厭祭亦可乎孔子曰祭成喪者必有尸尸必以孫孫幼則使人抱之無孫則取於同姓可也祭殤必厭蓋弗成也祭成喪而無尸是殤之也曽子之意疑立尸而祭無益死者故問祭時必合有尸乎若厭祭亦可乎蓋祭初隂厭尸猶未入祭終而陽厭在尸既起之後是厭祭無尸也孔子言成人威儀具備必有尸以象神之威儀所以祭成人之喪者必有尸也尸必以孫以昭穆之位同也取於同姓亦謂孫之等列也祭殤者不立尸而厭祭以其年幼少未能有成人之威儀不足可象故不立尸也若祭成人而無尸是以殤待之矣孔子曰有隂厭有陽厭曽子問曰殤不祔祭何謂隂厭陽厭孔子曰宗子為殤而死庶子弗為後也其吉祭特牲祭殤不舉無肵俎無𤣥酒不告利成是謂隂厭孔子言祭殤之禮有厭於幽隂者有厭於陽明者蓋適殤則隂厭於祭之始庶殤則陽厭於祭之終非兼之也曽子不悟其指乃問云祭殤之禮略而不備何以始末一祭之閒有此兩厭也孔子言雖是宗子死在殤之年無為人父之道庶子不得代為之後其族人中有與之為兄弟者代之而主其祭之之禮其卒哭成事以後為吉祭祭殤本用特豚今亦從成人之禮用特牲者以其為宗子故也祭有尸則佐食舉肺脊以授尸祭而食之今無尸故不舉肺脊也凡尸食之餘歸之肵俎肵敬也主人敬尸而設此俎今無肵俎以無尸故也𤣥酒水也太古無酒之時以水行禮後王祭則設之重古道也今祭殤禮略故無𤣥酒也不告利成者利猶養也謂共養之禮已成也常祭主人事尸禮畢出立户外則祝東面告利成遂導尸以出今亦以無尸廢此禮是謂隂厭云者以其在祖廟之奧隂暗之處厭之也祔音備肵音祈共音供凡殤與無後者祭於宗子之家當室之白尊于東房是謂陽厭凡殤非宗子之殤也無後者謂庶子之無子孫者也此二者若是宗子大功內親則於宗子家祖廟祭之必當室中西北隅得户之明白處其尊則設于東房是謂陽厭也曽子問曰葬引至于堩日有食之則有變乎且不乎孔子曰昔者吾從老􅖫助葬於巷黨及堩日有食之老􅖫曰丘止柩就道右止哭以聽變既明反而後行曰禮也反葬而丘問之曰夫柩不可以反者也日有食之不知其已之遲數則豈如行哉老􅖫曰諸侯朝天子見日而行逮日而舍奠大夫使見日而行逮日而舍夫柩不蚤出不莫宿見星而行者唯罪人與奔父母之喪者乎日有食之安知其不見星也且君子行禮不以人之親痁患吾聞諸老聃云堩道也有變變常禮乎且不乎不變常禮乎柩北向而出道右則道之東也聽變聽日食之變動也明反日光復常也舍奠晚止舍而設奠於行主也安知其不見星謂日食既而星見則昏暗中恐有姦慝也痁病也不以人之親痁患謂不可使人之親病於危亡之患也音堩古鄧切不音否數音速舍如字去聲使去聲莫暮痁尸占切曽子問曰為君使而卒於舍禮曰公館復私館不復凡所使之國有司所授舍則公館已何謂私館不復也孔子曰善乎問之也自卿大夫士之家曰私館公館與公所為曰公館公館復此之謂也復死而招魂復魄也公館公家所造之館也與及也公所為謂公所命停客之處即是卿大夫之館但有公命故謂之公館也一說公所為謂君所作離宫别館也聲為君為去使去聲曽子問曰下殤土周葬于園遂輿機而往塗邇故也今墓逺則其葬也如之何八嵗至十一為下殤土周堲周也說見檀弓成人則葬於墓此葬於園圃之中輿猶抗也機者輿尸之具木為之狀如牀而無腳以繩橫直維繫之抗舉而往堲周之所棺斂而葬之塗近故也曽子言今世禮變皆棺斂下殤於家而葬之於墓則塗逺矣其葬也如之何問既不用輿機則當用人舉棺以往乎為當用車載棺而往乎然此謂大夫之下殤及士庶人之中下殤耳若大夫之適長殤中殤有遣車者亦不輿機而葬也孔子曰吾聞諸老􅖫曰昔者史佚有子而死下殤也墓逺召公謂之曰何以不棺斂於宫中史佚曰吾敢乎哉召公言於周公周公曰豈不可史佚行之下殤用棺衣棺自史佚始也史佚周初良史也墓逺不葬於園也言於周公言猶問也周公曰豈不可者謂何為不可也召公述周公之言告佚佚於是用棺衣而棺斂於宫中是此禮之變始於史佚也舊注以豈為句者非召音邵棺斂並去聲衣棺之棺同曽子問曰卿大夫將為尸於公受宿矣而有齊衰內喪則如之何孔子曰出舍於公館以待事禮也受宿受君命而宿齊戒也齊衰內喪大門內齊衰服之喪也待事待祭事畢然後歸哭也孔子曰尸辨冕而出卿大夫士皆下之尸必式必有前驅尸服死者之上服今為君尸而辨冕者辨士之爵辨也以君之先世或有為大夫士者故尸亦當辨或冕也出而卿大夫士遇之則下車尸式以答之必有前驅者尸出則先驅辟開行人也辟音闢子夏問曰三年之喪卒哭金革之事無辟也者禮與初有司與孔子曰夏后氏三年之喪既殯而致事殷人既葬而致事記曰君子不奪人之親亦不可奪親也此之謂乎無辟謂君使則行無敢辭辟也此禮當然歟抑當初有司逼遣之歟夏之禮親喪既殯即致還其事於君殷禮則葬後乃致其事君子指人君也臣遭父母之喪而君許其致事是不奪人喪親之心也雖君有命而不忍違離喪次是不可奪其喪親之孝也辟音避與平聲子夏曰金革之事無辟也者非與孔子曰吾聞諸老􅖫曰昔者魯公伯禽有為為之也今以三年之喪從其利者吾弗知也魯公卒哭而從金革之事以徐戎之難東郊不開不得已而征之是有為為之也今人居三年之喪而用兵以逐攻取之利者吾不知其為何禮也蓋甚非之之辭一說利為例言無故而以三年之喪從伯禽之例以用兵者甚非也上為去聲文王世子第八文王之為世子朝於王季日三雞初鳴而衣服至於寢門外問內豎之御者曰今日安否何如內豎曰安文王乃喜及日中又至亦如之及莫又至亦如之內豎內庭之小臣御是直日者世子朝父母惟朝夕二禮今文王日三聖人過人之行也朝音潮衣去聲豎音樹莫音暮朝夕朝如字行去聲其有不安節則內豎以告文王文王色憂行不能正履王季復膳然後亦復初食上必在視寒暖之節食下問所膳命膳宰曰末有原應曰諾然後退不安節謂有疾不能循其起居飲食之常時也食上進膳於親也在察也食下食畢而徹也問所膳問所食之多寡也末猶勿也原再也謂所食之餘不可再進也上上聲應去聲武王帥而行之不敢有加焉文王有疾武王不說冠帶而養文王一飯亦一飯文王再飯亦再飯旬有二日乃閒不敢有加不可踰越父之所行也疏曰病重之時病恆在身無少閒空隙病今既損不恆在身其閒有空隙故謂病瘳為閒也帥音率說音脫養去聲飯上聲空去聲文王謂武王曰女何夢矣武王對曰夢帝與我九齡文王曰女以為何也武王曰西方有九國焉君王其終撫諸文王曰非也古者謂年齡齒亦齡也我百爾九十吾與爾三焉文王九十七乃終武王九十三而終文王疾瘳之後武王乃得安寢故問其何夢武王對云夢天帝言與我九齡齡字從齒齒之異名也故言年齡又言年齒其義一也大戴禮云男八月生齒八嵗而齔齒是人夀之數也然數之修短禀氣於有生之初文王雖愛其子豈能減己之年而益之哉好事者為之辭而不究其理讀記者信其說而莫之敢議也女音汝齔初謹切成王幼不能涖阼周公相踐阼而治抗世子法於伯禽欲令成王之知父子君臣長幼之道也成王有過則撻伯禽所以示成王世子之道也文王之為世子也石梁王氏曰文王之為世子也一句衍文之劉氏曰成王幼弱雖已涖阼為天子而未能行涖阼事書曰小子同未在位亦言其雖已在位與未在位同也故周公以冢宰攝政相助成王踐履其臨阼之事而治天下以幼年即尊位而不知父子君臣長幼之道何以治天下哉故周公舉世子事君親長上之法以教伯禽使日夕與成王遊處俾其有所視效也其或成王出入起居之閒有愆於禮法者則撻伯禽以責其不能盡事君之道所以警戒成王而示之以為世子之道也然伯禽所行即文王所行世子之道文王所行乃諸侯世子之禮故曰文王之為世子也言伯禽所行非王世子之禮也相去聲令平聲凡學世子及學士必時春夏學干戈秋冬學羽籥皆於東序學教也士即王制所謂司徒論俊選而升於學之士也必時四時各有所教也干盾也捍兵難之器戈句子㦸也羽翟雉之羽也籥笛之屬也四物皆舞者所執干戈為武舞故於陽氣發動之時教之示有事也羽籥為文舞故於隂氣凝寂之時教之示安靜也東序大學也句四學字皆音效於學大學如字難去聲音勾大音泰小樂正學干大胥贊之籥師學戈籥師丞贊之胥鼓南四人皆樂官之屬贊相助之也胥即大胥也南南夷之樂也東夷之樂曰昧南夷之樂曰南西夷之樂曰朱離北夷之樂曰禁明堂位又云任南蠻之樂也周禮旄人教國子南夷樂之時大胥則擊鼓以節其音曲故云胥鼓南也先王作樂至矣盛矣而猶以逺方蠻夷之樂教人者所以示與圖之無外異類之咸賔奏之宗廟之中侈其盛也獨舉南樂則餘三方皆教習可知聲二學字皆音效相去春誦夏弦大師詔之瞽宗秋學禮執禮者詔之冬讀書典書者詔之禮在瞽宗書在上庠誦口誦歌樂之篇章也弦以琴瑟播被詩章之音節也皆太師詔教之瞽宗殷學名上庠虞學名周有天下兼立虞夏殷周之學也大音泰學如字凡祭與養老乞言合語之禮皆小樂正詔之於東序祭是一事養老乞言是一事合語是一事故以凡言之養老乞言謂行養老之禮之時因乞善言之可行者於此老人也合語謂祭及養老與鄉射鄉飲大射燕射之禮至旅酬之時皆得言說先王之法合會義理而相告語也其閒各有威儀容節皆須小樂正詔教之於東序之中大樂正學舞干戚語說命乞言皆大樂正授數大司成論說在東序戚斧也大樂正教世子及士以舞干戚之容節及合語之說與乞言之禮此三者皆大樂正授之以篇章之數於是大司成之官於東序而論說此受教者義理之淺深才能之優劣也學音效說如字凡侍坐於大司成者逺近閒三席可以問終則負牆列事未盡不問席廣三尺三寸三分寸之一三席所謂函丈也相對逺近如此取其便於咨問問終則却就後席背負牆壁而坐以避後來問事之人其問事之時尊者有教而已猶未達則必待其言盡然後更問若陳列未競則不敢先問以參錯尊者之言也閒平聲凡學春官釋奠于其先師秋冬亦如之官掌教詩書禮樂之官也若春誦夏弦則太師釋奠教干戈則小樂正及樂師釋奠也秋學禮冬讀書則其官亦如之釋奠者但奠置所祭之物而已無尸無食飲酬酢等事所以若此者以其主於行禮非報功也先師謂前代明習此事之師也凡始立學者必釋奠于先聖先師及行事必以幣諸侯初受封天子命之教於是立學所謂始立學也立學事重故釋奠于先聖先師四時之教常事耳故惟釋奠于先師而不及先聖也行事謂行釋奠之事必以幣必奠幣為禮也始立學而行釋奠之禮則用幣四時常奠不用幣也凡釋奠者必有合也有國故則否凡大合樂必遂養老凡行釋奠之禮必有合樂之事若國有凶喪之故則雖釋奠不合樂也常事合樂不行養老之禮惟大合樂之時人君視學必養老也舊說合者謂若本國無先聖先師則合祭鄰國之先聖先師本國故有先聖先師如魯有孔顔之類則不合祭鄰國之先聖先師也未知是否凡語于郊者必取賢斂才焉或以德進或以事舉或以言揚曲藝皆誓之以待又語三而一有焉乃進其等以其序謂之郊人逺之於成均以及取爵於上尊也語于郊者論辨學士才能於郊學之中也有賢德者則録取之有才能者則收斂之道德為先事功次之言語又次之曲藝一曲之藝小小技能若醫卜之屬誓戒謹也學士中或無德無事無言之可取而有此曲藝之人欲投試考課者皆卻之使退而謹習所能以待後次再語之時乃考評之也三而一有者謂此曲藝之人舉說三事而一事有可善者乃進其等即於其同等之中拔而升進之也然猶必使之於同輩中以所能高下為次序使不混其優劣也如此之人但止目之曰郊人非俊選之比也以非士類故疏逺之成均五帝大學之名天子設四代之學上尊堂上之酒尊也若天子飲酒於成均之學宫此郊人雖賤亦得取爵於堂上之尊以相旅勸焉所以榮之也人字之字均字皆句絶逺去聲大音泰始立學者既興器用幣然後釋菜不舞不授器乃退儐于東序一獻無介語可也教世子立學之初未有禮樂之器及其制作之成塗釁既畢即用幣于先聖先師以告此器之成繼又釋菜以告此器之將用也凡祭祀用樂舞者則授舞者以所執之器如干戈羽籥之類今此釋菜禮輕既不用舞故不授舞器也諸侯有功德者亦得立異代之學東序夏制也與虞庠相對東序在東虞庠在西乃退儐于東序者謂釋菜在虞庠之中禮畢乃從虞庠而退儐禮其賔於東序之中其禮既殺惟行一獻無介無語於禮亦可也此以上雖不專是教世子之事然以教世子為主故以此句總結上文石梁王氏曰三字亦衍文去興音釁殺聲凡三王教世子必以禮樂樂所以修內也禮所以修外也禮樂交錯於中發形於外是故其成也懌恭敬而溫文修內者消融其邪慝之藴修外者陶成其恭肅之儀禮之修達於中樂之修達於外所謂交錯於中也有諸中必形諸外故其成也懌此懌字與魯論不亦說乎之說相似既有恭敬之實德又有溫潤文雅之氣象禮樂之教大矣說音悅立太傅少傅以養之欲其知父子君臣之道也太傅審父子君臣之道以示之少傅奉世子以觀太傅之德行而審喻之太傅在前少傅在後入則有保出則有師是以教喻而德成也師也者教之以事而喻諸德者也保也者慎其身以輔翼之而歸諸道者也記曰虞夏商周有師保有疑丞設四輔及三公不必備唯其人語使能也養者長而成之之謂審喻詳審言之使通曉也前後以行步言出入以居處言慎其身使之謹守其身也師保疑丞四輔也一說前疑後丞左輔右弼為四輔四輔與三公不必其全備惟擇其可稱職者惟其人以上皆記文語言也語使能也一句是記者釋之之辭朱子曰師保疑丞疑字曉不得想止是有疑即問他之意少行並去聲君子曰德德成而教尊教尊而官正官正而國治君之謂也君子曰德此德是指世子之德世子之德有成則教道尊嚴而無敢慢易者故凡居官守者皆以正自處官正而國治世子為君之謂也仲尼曰昔者周公攝政踐阼而治抗世子法於伯禽所以善成王也聞之曰為人臣者殺其身有益於君則為之況于其身以善其君乎周公優為之前言周公相踐阼而治此缺相字而下文又有周公踐阼之言皆記者之失也以世子之法教世子直道也今舉世子法於伯禽而教成王是迂曲其事也人臣殺身為國猶尚為之今周公不過迂曲其身之所行以成君之善宜乎優為之也劉氏曰書蔡仲之命曰惟周公位冢宰正百工此言攝政踐阼而治是以冢宰攝行踐阼之政非謂攝居天子之位也孔子言周公舉世子法於伯禽者非自教其子蓋示法以善成王也吾聞古人言為人臣者殺身而有益於君猶且為之況止迂其身以善其君乎此大人正己而物正之事周公大聖人也故優為之于讀作迂為國為去聲是故知為人子然後可以為人父知為人臣然後可以為人君知事人然後能使人成王幼不能涖阼以為世子則無為也是故抗世子法於伯禽使之與成王居欲令成王之知父子君臣長幼之義也君之於世子也親則父也尊則君也有父之親有君之尊然後兼天下而有之是故養世子不可不慎也武王既崩則成王無父雖年幼未知君道若以之為世子則無為子之處矣故云以為世子則無為也君於世子以親言則是父以尊言則是君能盡君父之道以教其子然後可以保有天下之大不然則他日為子者不克負荷矣可不慎乎令平聲荷上聲行一物而三善皆得者唯世子而已其齒於學之謂也故世子齒於學國人觀之曰將君我而與我齒讓何也曰有父在則禮然然而衆知父子之道矣其二曰將君我而與我齒讓何也曰有君在則禮然然而衆著於君臣之義也其三曰將君我而與我齒讓何也曰長長也然而衆知長幼之節矣故父在斯為子君在斯謂之臣居子與臣之節所以尊君親親也故學之為父子焉學之為君臣焉學之為長幼焉父子君臣長幼之道得而國治語曰樂正司業父師司成一有元良萬國以貞世子之謂也一物一事也與國人齒讓之一事也三善謂衆人知父子君臣長幼之道也君我君臨乎我也世子與同學之人讓齒其不知禮者見之而疑其知禮者從而曉之曰父在之時常執謙卑不敢居人之前其禮當如此也如此而衆知父子之道矣其二其三皆此意學之教之也語古語也樂正主世子詩書之業父師主於成就其德行一有書作一人謂世子也世子有大善則萬邦皆正矣長並上聲學並音效行去聲周公踐阼石梁王氏曰此當為衍文結劉氏曰此四字說者以下文更端故著此以上文周公相踐阼之事然因其缺一相字遂啓明堂位周公踐天子位之說其後馴致新莽居攝篡漢之禍實此語基之更平聲庶子之正於公族者教之以孝弟睦友子愛明父子之義長幼之序庶子司馬之屬官正於公族為正於公族也周禮庶子掌國子之倅倅副二也國子是公卿大夫士之子則二其父者也弟音悌倅音卒士卒之卒同音其朝于公內朝則東面北上臣有貴者以齒內朝路寢之庭也言公族之人若朝見於公之內朝則立於西方而面向東尊者在北以次而南然既均為同姓之臣則一以昭穆之長幼為序父兄雖賤必居上子弟雖貴必處下也朝音潮見音現其在外朝則以官司士為之外朝路寢門外之朝也若公族朝見於外朝與異姓之臣雜列則以官之高卑為次序不序年齒也司士亦司馬之屬主為朝見之位次者其在宗廟之中則如外朝之位宗人授事以爵以官宗人之官掌禮及宗廟中授百官以職事者以爵隨其爵之尊卑貴者在前賤者在後也以官隨其官之職掌使各供其事也其登餕獻受爵則以上嗣登自堂下而升堂上也餕食尸之餘也尸出宗人使嗣子及長兄弟升堂相對而餕也以特牲禮次序言之先時祝酌爵觶奠于鉶南俟主人獻內兄弟畢長兄弟及衆賔長為加爵之後宗人使嗣子飲鉶南之奠爵嗣子盥而入拜尸執此奠爵嗣子進受復位而拜尸答拜嗣子飲畢拜尸尸又答拜所謂受爵也嗣子又舉所奠爵洗而酌之以入獻尸尸拜而受嗣子答拜所謂獻也無算爵之後禮畢尸出乃餕此三事者受爵在先獻次之餕最在後今言餕獻受爵以重在餕故逆言之歟上嗣適子之長者為最上也此謂士禮大夫之嗣無此禮者避君也故少牢禮無嗣子舉奠之文庶子治之雖有三命不踰父兄庶子治公族朝內朝之禮雖有三命之貴而其位次不敢踰越無爵之父兄而居其上即上章所言臣有貴者以齒也疏曰若非內朝其餘㑹聚則一命齒于鄉里謂一命尚畢若與鄉里長宿燕食則猶計年也再命齒于父族謂再命漸尊不復與鄉里計年唯官高在上但父族為重猶計年為列也三命不齒謂三命大貴則亦不復與父族計年燕㑹則别席獨坐在賔之東矣其公大事則以其喪服之精粗為序雖於公族之喪亦如之以次主人此謂君喪而庶子治其禮事大事喪事也臣為君皆斬衰然衰制雖同而升數之多寡則各依本親庶子序列位次則辨其本服之精粗使衰粗者在前衰精者在後非但公喪如此公族之內有相為服者亦然蓋亦是庶子序其精粗先後之次也以次主人者謂雖有庶長父兄尊於主人亦必次於主人之下使主人在上為喪主也若公與族燕則異姓為賔膳宰為主人公與父兄齒族食世降一等公與族人燕食亦庶子掌其禮族人雖衆其初一人之身也豈可以賔客之道外之故以異姓一人為賔而使膳宰為主與之抗禮酬酢君尊而賔不敢敵也君雖尊而與父兄列位序尊卑之齒者篤親親之道也族食與族人燕食也世降一等謂族人既有親疏則燕食亦隨世降殺也㑹疏曰假令本是齊衰一年四會食若大功則一年三食小功則一年再㑹食緦麻則一年一㑹食是世降一等也其在軍則守於公禰禰當讀作祧公禰謂遷主載在齊車隨公出行者也庶子官既從在軍故守衛此齊車之行主也齊音齊公若有出疆之政庶子以公族之無事者守於公宫正室守大廟諸父守貴宫貴室諸子諸孫守下宫下室上章專言出軍則此出疆之政蓋朝覲會同之事也無事者謂不從行及無職守之人也公宫總言公之宗廟宫室也正室公族之為卿大夫士者之適子也大廟太祖之廟也諸父公之伯父叔父也宫以廟言室以居言貴宫尊廟也貴室路寢也下宫下室則是親廟與燕寢也大音泰五廟之孫祖廟未毁雖為庶人冠取妻必告死必赴練祥則告諸侯五廟始封之君為太祖百世不遷此下親盡則遞遷此言五廟之孫是始封之君即五世祖故云祖廟未毁未毁未遞遷也此孫雖無祿仕然冠昏必告于君死必赴練祥之祭必告者以其親未盡也冠取並去聲族之相為也宜弔不弔宜免不免有司罰之至于賵賻承含皆有正焉四世而緦服之窮也五世親盡袒免而已袒免說見前篇六世以往弔而已矣當弔而不弔當免而不免皆為廢禮故有司者罰之所以肅禮教也贈以車馬賻以貨財含以珠玉襚以衣服四者總謂之贈隨其親疏各有正禮庶子官治之有司即庶子也作為去聲免音問承讀贈含去聲公族其有死罪則磬于甸人其刑罪則纖剸亦告于甸人公族無宫刑磬懸縊殺之也左傳室如縣磬皇氏曰如縣樂器之磬也甸人掌郊野之官為之隱故不於市朝其刑罪之當纖刺剸割之時亦鞠讀刑法之書於甸人之官也漢書每云鞠獄鞠盡也推審罪狀令無餘藴然後讀其所犯罪狀之書而刑之無官刑者不絶其類也平纖音針剸之兗切告音鞠縣聲為去聲令平聲獄成有司讞于公其死罪則曰某之罪在大辟其刑罪則曰某之罪在小辟公曰宥之有司又曰在辟公又曰宥之有司又曰在辟及三宥不對走出致刑于甸人公又使人追之曰雖然必赦之有司對曰無及也反命于公公素服不舉為之變如其倫之喪無服親哭之獄成謂所犯之事訊問已得情實也讞議刑也殺牲盛饌曰舉素服不舉為之變其常禮是憫惻也如其親疏之倫而不為弔服者以不親往故也但居外不聽樂及賻贈之類仍依親疏之等耳親哭之者為位于異姓之廟而素服以哭之也天子諸侯絶旁親故知此言無服是不為弔服切讞魚列切辟婢亦為去聲公族朝于內朝內親也雖有貴者以齒明父子也外朝以官體異姓也宗廟之中以爵為位崇德也宗人授事以官尊賢也登餕受爵以上嗣尊祖之道也喪紀以服之輕重為序不奪人親也公與族燕則以齒而孝弟之道逹矣其族食世降一等親親之殺也戰則守於公禰孝愛之深也正室守大廟尊宗室而君臣之道著矣諸父諸兄守貴室子弟守下室而讓道達矣此以下覆解前章庶子正公族以下諸事內親謂親之故進之於內也明父子昭穆不可紊也體異姓體貌異姓之臣也崇德德之尊者爵必尊也尊賢惟賢者能任事也上嗣繼祖者也故為尊祖之道服之輕重本於屬之親疏親疏之倫不可易奪也燕食主於親親以齒相序所以達孝弟之道也親親施於生者宜有降殺之等孝愛施於死者宜有深逺之思君臣之道以輕重言讓道則以貴賤言也孝弟弟音悌殺去聲禰音祧大音泰五廟之孫祖廟未毁雖及庶人冠取妻必告死必赴不忘親也親未絶而列於庶人賤無能也敬弔臨賻賵睦友之道也古者庶子之官治而邦國有倫邦國有倫而衆鄉方矣人君任官本無親疏之間顧賢否何如耳親盡而賢亦必仕之今親未盡而已在庶人之列是以其無能故賤之也族人有喪君必敬謹其弔臨賻賵之禮者是皆和睦友愛族人之道也鄉方所向之方謂皆知趨禮教也臨如字鄉去聲公族之罪雖親不以犯有司正術也所以體百姓也刑于隱者不與國人慮兄弟也弗弔弗為服哭于異姓之廟為忝祖逺之也素服居外不聽樂私喪之也骨肉之親無絶也公族無宫刑不翦其類也正術猶言常法也公族之有罪者雖是君之親然亦必在五刑之例而不赦者是不以私親而干犯有司之正法也所以然者以立法無二制當與百姓一體斷决也與猶許也刑于甸師隱僻之處者是不許國人見而謀度吾兄弟之過惡也刑己當罪而猶私喪之者以骨肉之親雖陷刑戮無斷絶之理也受宫刑者絶生理故謂之腐刑如木之朽腐無發生也此刑不及公族不忍翦絶其生生之類耳為忝為去聲逺去聲斷決斷丁玩切度入聲當去聲斷絶斷徒管切天子視學大昕鼓徵所以警衆也衆至然後天子至乃命有司行事興秩節祭先師先聖焉有司卒事反命天子視學之日初明之時學中擊鼓以徵召學士蓋警動衆聽使早至也凡物以初為大末為小故以大昕為初明也有司教詩書禮樂之官也興舉秩常節禮也卒事反命謂釋奠事畢復命于天子也昕音欣始之養也適東序釋奠於先老遂設三老五更羣老之席位焉天子視學在虞庠之中事畢反國明日乃之東序而養老始謂始初立學之時也若非始立學則無釋奠先老之禮先老先世之為三老五更者也三老五更各一人羣老無定數蔡雍曰更當為叟三老三人五更五人未知是否然皆年老更事致仕者舊說取象三辰五星更平聲適饌省醴養老之珍具遂發咏焉退修之以孝養也設席位畢天子親至陳饌之處省視醴酒及養老珍羞之具省具畢出迎三老五更將入門遂作樂聲發其歌咏以延進之老更既入即西階下之位天子乃退而酌醴以獻之是修行孝養之道也適如字省息井切孝養養去聲反登歌清廟既歌而語以成之也言父子君臣長幼之道合德音之致禮之大者也反反席也老更受獻畢皆立於西階下東面今皆反升就席乃使樂工登堂歌清廟之詩以樂之歌畢至旅酬時談說善道以成就天子養老之禮也其所言說者皆是講明父子君臣長幼之道理集合清廟詩中所咏文王道德之音聲皆德之極致禮之大者也下管象舞大武大合衆以事達有神興有德也正君臣之位貴賤之等焉而上下之義行矣下管象者堂下以管奏象舞之曲也舞大武者庭中舞大武之舞也象是文王之舞周頌維清乃象舞之樂歌武則大武之樂歌也武頌言勝殷遏劉維清不言征伐則象舞決非武舞矣注疏以文王武王之舞皆名為象維清象舞為文王下管象為武王其意蓋謂清廟與管象若皆為文王不應有上下之别殊不知古樂歌者在上匏竹在下凡以人歌者皆曰升歌亦曰登歌以管奏者皆曰下管周禮大師帥瞽登歌下管奉樂器書言下管鼗鼓是也清廟以人歌之自宜升象以管奏之自宜下凡樂皆有堂上堂下之奏也此嚴氏之說足以正舊說之非故今從之大合衆以事謂大會衆學士以行此養老之事而樂之所感足以通達神明興起德性也一說周道之四達以有神明相之周家之興起以世世修德皆可於樂中見之上言父子君臣長幼之道此言正君臣之位貴賤之等而上下之義行則先王養老之禮豈苟為虛文而已哉别必列切大音泰帥入聲相去聲有司告以樂闋王乃命公侯伯子男及羣吏曰反養老幼于東序終之以仁也闋終也此時畿內之諸侯及鄉遂之吏皆與禮席天子使其反國各行養老之禮是天子之仁恩始于一處而終皆遍及也而馮氏曰石梁先生於此經塗去幼字今按疏有其義鄭注無養幼之文疑是訛本攘入一字是故聖人之記事也慮之以大愛之以敬行之以禮修之以孝養紀之以義終之以仁是故古之人一舉事而衆皆知其德之備也古之君子舉大事必慎其終始而衆安得不喻焉兌命曰念終始典于學虞夏商周皆有養老之禮後王養老亦皆記序前代之事也人道莫大於孝弟慮之以大者謂謀慮此孝弟之大道而推行之也愛敬省具之事行禮親迎肅之也孝養獻醴也紀義既歌而語也終仁令侯國行之也一事之中人皆知其衆德之全備者以其慎終如始也如此則衆安得不喻曉乎養老之禮行於學又因終始之義故引說命以結之也音養去聲兌音悅令平聲說悅世子之記曰朝夕至于大寢之門外問於內豎曰今日安否何如內豎曰今日安世子乃有喜色其有不安節則內豎以告世子世子色憂不滿容內豎言復初然後亦復初世子之記古者教世子之禮篇也不滿容不能充其儀觀之美也此節約言之以見文王武王為世子之異於常人也文王朝王季日三此朝夕而已文王行不能正履此色憂而已以石梁王氏曰古世子之禮亡此餘其記之一節小戴附篇末觀去聲朝夕之食上世子必在視寒暖之節食下問所膳羞必知所進以命膳宰然後退若內豎言疾則世子親齊𤣥而養羞品味也必知所進必知親所食也命膳宰即篇首所命之言也養疾者衣齊𤣥之服即齊時所著𤣥冠緇布衣裳則貴賤異制謂之𤣥端服也上上聲齊側皆切養去聲膳宰之饌必敬視之疾之藥必親嘗之嘗饌善則世子亦能食嘗饌寡世子亦不能飽以至于復初然後亦復初善猶多也不能飽以視武王之亦一亦再又異矣此篇首言文王武王為世子之事故篇終舉記之言以終之云禮運第九此篇記帝王禮樂之因革及陰陽造化流通之理疑出於子游門人之所記閒有格言而篇首大同小康之說則非夫子之言也閒去聲昔者仲尼與於蠟賔事畢出遊於觀之上喟然而嘆仲尼之嘆蓋嘆魯也言偃在側曰君子何嘆孔子曰大道之行也與三代之英丘未之逮也而有志焉蠟禮詳見郊特牲篇孔子在魯與為魯國蠟祭之賔畢事而遊息於觀上觀門闕也兩觀在門之兩旁懸國家典章之言於上以示人也喟然嘆聲也所以嘆魯者或祭事之失禮或因睹舊章而思古也言偃孔子弟子子游也問所以嘆之故夫子言我思古昔大道之行於天下與夫三代英賢之臣所以得時行道之盛我今雖未得及見此世之盛而有志於三代英賢之所為也此亦夢見周公之意周石梁王氏曰以五帝之世為大同以禹湯文武成王公為小康有老氏意而注又引以實之且謂禮為忠信之薄皆非儒者語所謂孔子曰記者為之辭也與去聲蠟音乍觀去聲喟去愧切大道之行也天下為公選賢與能講信修睦故人不獨親其親不獨子其子使老有所終壯有所用幼有所長矜寡孤獨廢疾者皆有所養男有分女有歸貨惡其棄於地也不必藏於己力惡其不出於身也不必為己是故謀閉而不興盜竊亂賊而不作故外户而不閉是謂大同天下為公言不以天下之大私其子孫而與天下之賢聖公共之如堯授舜舜授禹但有賢能可選即授之矣當時之人所講習者誠信所修為者和睦是以親其親以及人之親子其子以及人之子使老者壯者幼者各得其所困窮之民無不有以養之男則各有士農工商之職分女則得歸于良奧之家貨財民生所資以為用者若棄捐於地而不以時收貯則廢壞而無用所以惡其棄於地也今但得有能收貯以資世用者足矣不必其善利而私藏於己也世閒之事未有不勞力而能成者但人情多詐共事則欲逸己而勞人不肯盡力此所以惡其不出於身也今但得各竭其力以共成天下之事足矣不必其用力而獨營己事也風俗如此是以姦邪之謀閉塞而不興盜竊亂賊之事絶滅而不起暮夜無虞外户可以不閉豈非公道大同之世乎一說外戶者户設於外而閉之向內也選去聲矜音鰥分扶問切惡去聲為己為去聲今大道既隱天下為家各親其親各子其子貨力為己大人世及以為禮城郭溝池以為固禮義以為紀以正君臣以篤父子以睦兄弟以和夫婦以設制度以立田里以賢勇知以功為己故謀用是作而兵由此起禹湯文武成王周公由此其選也此六君子者未有不謹於禮者也以著其義以考其信著有過刑仁講讓示民有常如有不由此者在藝者去衆以為殃是謂小康天下為家以天下為私家之物而傳子孫也大人天子諸侯也父子相傳為世兄弟相傳為及紀綱紀也賢勇知以勇知為賢也涿鹿之戰有苖之征兵非由後王起也謂兵由此起舉湯武之事言之耳著明也考成也刑仁謂法則仁愛之道講讓講說遜讓之道示民有常言六君子謹禮而行著義以下五事示民為常法也在勢居王者之勢位也言為天下之君而不以禮行此五事則天下之人以為殃民之主而共廢黜之也此謂小小安康之世不如大道大同之世也言陳氏曰禮家謂太上之世貴德其次務施報往來故大道為公之世不規規於禮禮乃道德之衰忠信之薄大約出於老莊之見非先聖格言也為己為去聲知去聲藝音勢去上聲施去聲言偃復問曰如此乎禮之急也孔子曰夫禮先王以承天之道以治人之情故失之者死得之者生詩曰相鼠有體人而無禮人而無禮胡不遄死是故夫禮必本於天殽於地列於鬼神達於喪祭射御冠昏朝聘故聖人以禮示之故天下國家可得而正也禮本於天天理之節文也殽效也效於地者效山澤髙卑之勢為上下之等也後章殽以降命以下乃詳言之列於鬼神禮有五經莫重於祭也喪祭以下八事人事之儀則也朝復扶又切治平聲相去聲殽音效冠去聲音潮言偃復問曰夫子之極言禮也可得而聞與孔子曰我欲觀夏道是故之把而不足徵也吾得夏時焉我欲觀殷道是故之宋而不足徵也吾得坤乾焉坤乾之義夏時之等吾以是觀之把夏之後宋殷之後徵證也孔子言我欲觀考夏殷之道故適二國而求之意其先代舊典故家遺俗猶有存者乃皆無可徵驗者僅於把得夏時之書於宋得坤乾之易耳夏時或謂即今夏小正坤乾謂歸藏商易首坤次乾也所謂坤乾之義理夏時之等列吾但以此二書觀之而已二代治天下之道豈可悉得而聞乎論語曰文獻不足故也言石梁王氏曰以坤乾合周禮之歸藏且有魯論所不者恐漢儒依倣為之誠如其說則夏小正之書與坤乾何足以證禮注訓徵為成尤非近儒有反引此以解魯論者謬甚中庸亦無是說大槩此段倣魯論為之者夫禮之初始諸飲食其燔黍捭豚汙尊而抔飲蕢桴而土鼓猶若可以致其敬於鬼神燔黍以黍米加於燒石之上燔之使熟也捭豚擘析豚肉加於燒石之上而熟之也汙尊掘地為汙坎以盛水也抔飲以手掬而飲之也蕢桴摶土塊為擊鼓之椎也土鼓築土為鼓也上古人心無僞雖簡陋如此亦自可以致敬於鬼神也掊捭音百汙烏花切抔音桴音浮盛平聲及其死也升屋而號告曰臯某復然後飯腥而苴孰故天望而地藏也體魄則降知氣在上故死者北首生者南鄉皆從其初所以升屋者以魂氣之在上也臯者引聲之言某死者之名也欲招此魂令其復合體魄如是而不生乃行死事飯腥者用上古未有火化之法以生稻米為含也苴孰者用中古火化之利包裏熟肉為遣送之奠也天望地藏謂始死望天而招魂體魄則葬藏于地也所以然者以體魄則降而下知氣則升而上也死者之頭向北生者之居向南及以上送死諸事非後世創為之皆是從古初所有之禮也遣號平聲飯上聲苴兹於切知首鄉並去聲令平聲含並去聲下去聲上上聲昔者先王未有宫室冬則居營窟夏則居橧巢未有火化食草木之實鳥獸之肉飲其血茹其毛未有麻絲衣其羽皮營窟者營纍其土以為窟穴也地髙則穴於地中地卑則於地上纍土為窟也橧巢者橧聚薪柴以為巢居也茹其毛者以未有火化故去毛不能盡而并食之也橧音曽茹音汝衣去聲纍上聲去上聲并去聲後聖有作然後修火之利范金合土以為臺榭宫室牖户以炮以燔以亨以炙以為醴酪治其麻絲以為布帛以養生送死以事鬼神上帝皆從其朔范字當從竹韻注云以土曰型以金曰鎔以木曰模以竹曰笵皆鑄器之式也笵金為形範以鑄金器也合土和合泥土為陶器也裹而燒之曰炮加於火上曰燔煮於鑊曰亨貫串而置之火上曰炙酪醋也治湅染之類也此以上諸事皆火之利今世承用而為之皆是取法往聖故云皆從其朔朔亦初也亨音烹炙音隻酪音洛治平聲和去聲故𤣥酒在室醴盞在户粢醍在堂澄酒在下陳其犧牲備其鼎俎列其琴瑟管磬鐘鼓修其祝嘏以降上神與其先祖以正君臣以篤父子以睦兄弟以齊上下夫婦有所是謂承天之祜太古無酒用水行禮後王重古故尊之名為𤣥酒祭則設於室內而近北也醴猶體也酒之一宿者周禮謂之醴齊盞即周禮盎齊盎猶翁也成而翁翁然葱白色也此二者以後世所為賤之陳列雖在室內而稍南近户故云醴盞在户也粢醍即周禮醍齊酒成而紅赤色也又卑之列於堂澄酒即周禮沈齊成而滓沈也又在堂之下矣此五者各以等降設之祝為主人告神之辭嘏為尸致福於主人之辭說見曽子問上神在天之神也祭統云君迎牲而不迎尸别嫌也是正君臣之義父北面而事之所以明子事父之道是篤父子也睦兄弟者主人獻長兄弟及衆兄弟之禮齊上下者獻與餕各有次序無遺缺也夫婦有所者君在阼夫人在房及致爵之類也行禮如此神格鬼享豈不承上天之福祜乎盎盞側眼切粢才細切醍音體嘏古雅切祜音户醴齊齊醍齊沈齊齊去聲為主為尸為去聲别必列切作其祝號𤣥酒以祭薦其血毛腥其俎孰其殽與其越席疏布以冪衣其浣帛醴盞以獻薦其燔炙君與夫人交獻以嘉魂魄是謂合莫然後退而合亨體其犬豕牛羊實其簠簋籩豆鉶羹祝以孝告嘏以慈告是謂大祥此禮之大成也周禮祝號有六一神號二鬼號三祗號四牲號五齍號六幣號作其祝號者造為鬼神及牲玉美號之辭神號如昊天上帝鬼號如皇祖伯某祗號若后土地祗牲號若一元大武齍號若稷曰明粢幣號若幣曰量幣祝史稱之以告鬼神也每祭必設𤣥酒其實不用之以酌薦其血毛謂殺牲之時取血及毛入以告神於室也腥其俎謂牲既殺以俎盛肉進於尸前也祭𤣥酒薦血毛腥俎此三者是法上古之禮孰其殽以下是中古之禮殽骨體也以湯爛為熟越席蒲席也疏布粗布也冪覆尊也周禮越席疏布祭天用之此以為宗廟之用記者雜陳之也浣帛謂祭服以湅染之帛制之也醴盞以獻者朝踐薦血腥時用醴饋食薦熟時用盞也薦其燔炙者燔肉炙肝也特牲禮主人獻尸賔長以肝從主婦獻尸賔長以燔從也第一君獻第二夫人獻第三君獻第四夫人獻故云君與夫人交獻也此以上至熟其殽是法中古之禮皆所以嘉善於死者之魂魄而求以契合於𡨕漠之中也然後退而合亨謂先薦爓未是熟物今乃退取向爓肉更合而烹煮之使熟而可食也又尸俎惟載右體其餘不載者及左體等亦於鑊中烹煮之故云合亨也體其犬豖牛羊者隨其牲之大小烹熟乃體别骨之貴賤以為衆俎用供尸及待賔客兄弟等也此是祭末饗燕之衆俎非尸前之正俎也簠內圓而外方盛稻粱之器簋外圓而內方盛泰稷之器籩豆形制同竹曰籩木曰豆鉶如鼎而小盛和羮之器也祝嘏說見前孝事祖宗之道也慈愛子孫之道也合亨以下當世之禮也祥猶善也越音活疏平聲冪莫力切衣去聲浣户管切亨音烹鉶音形齍音咨從去聲别必列切孔子曰嗚呼哀哉我觀周道幽厲傷之吾舍魯何適矣魯之郊禘非禮也周公其衰矣把之郊也禹也宋之郊也契也是天子之事守也故天子祭天地諸侯祭社稷幽厲之前周道已微其大壞則在幽厲也魯周公之國夫子嘗言其可一變至道則舍魯何往哉然魯之郊禘則非禮矣禹為三代之盛王故把得以郊契為殷之始祖故宗得以郊惟此二國可世守天子之事以事其祖周公雖聖人臣也成王之賜固非伯禽之受尤非周公制禮作樂為萬世不易之典而子孫若此是周公之教因子孫之僭禮而衰矣天地社稷之祭君臣之分凛不可踰曽謂人臣而可僭天子之禮哉石梁王氏曰此一章真孔子之言注不能明其旨天子祭天地諸侯但可祭社稷把宋之郊是王者之後天子之事守禮之所許者魯而有郊是背周公所制之禮與把宋不同也舍上聲契音屑祝嘏莫敢易其常古是謂大假祭禮祝於始嘏於終禮之成也常古常事古法也不敢變易謂貴賤行禮一依古制也假亦當作嘏猶上章大祥之意言行當然之禮則有自然之福其福大矣祝嘏辭說藏於宗祝巫史非禮也是謂幽國祝嘏辭說禮之文也無文不行周禮大宗伯掌詔六號重其事耳衰世君臣慢禮惟宗祝巫史習而記之故謂幽昏之國言其昧於禮無以昭明政治也盞斝及尸君非禮也是謂僭君盞夏之爵斝殷之爵尸君君之尸也把宋二王之後得用以獻尸其餘列國惟用時王之器今國君皆用盞斝以及於尸君非禮也是僭上之君耳斝古雅切冕辨兵革藏於私家非禮也是謂脅君冕祭服之冠辨皮辨也大夫稱家大夫以朝廷之尊服國家之武衛而藏於私家可見其强橫則此國君者乃見脅於强臣之君也橫去聲大夫具官祭器不假聲樂皆具非禮也是謂亂國家臣不能具官一人常兼數事具官是僭擬也祭器惟公孤以上得全備大夫無田祿者不設祭器以其可假也有田祿者祭器亦不得全具須有所假不假亦僭擬也周禮大夫有判縣之樂少牢饋食無奏樂之文是大夫祭不用樂也或君賜乃有之耳聲樂皆具亦僭擬也尊卑無等非亂國而何故仕於公曰臣仕於家曰僕三年之喪與新有昏者期不使以衰裳入朝與家僕雜居齊齒非禮也是謂君與臣同國臣者對君之稱僕者服役之名仕於大夫者自稱曰僕則益賤矣人臣有三年之喪或新昏則一期之內君不使之所以體人情也就二者而論喪尤重於昏也今乃不居喪於家而以衰裳入朝是視君之朝如巳之家矣是君與其臣共此國也就卿大夫而言僕又其臣也今卿大夫乃與其家之僕雜居齊列無貴賤之分亦是君與臣共此國也期音基衰音催論去聲故天子有田以處其子孫諸侯有國以處其子孫大夫有采以處其子孫是謂制度王之子弟有功德者封為諸侯其餘則分以畿內之田諸侯子孫命為卿大夫其有功德者亦賜采地所謂官有世功則有官族邑亦如之也大夫位卑不當割采地以與子孫但養之以采地之祿耳此先王之制度也處上聲采去聲故天子適諸侯必舍其祖廟而不以禮籍入是謂天子壞法亂紀廟尊於朝故天子舍之然必太史執簡記奉諱惡者不敢以天子之尊而慢人之宗廟也不如此則是壞法度亂紀綱矣舍去聲壞音怪惡去聲諸侯非問疾弔喪而入諸臣之家是謂君臣為謔諸侯於其臣有問疾弔喪之禮非此而往是戲謔也敗禮之禍恆必由之是故禮者君之大柄也所以别嫌明微儐鬼神考制度别仁義所以治政安君也國之有禮如器之有柄能執此柄則國可治矣接賔以禮曰儐接鬼神亦然故曰儐制度如禮樂衣服度量權衡之類考而正之不使有異仁主於愛義主於斷别而用之必當其宜别必列切儐音擯治平聲量去聲斷丁玩切當去聲故政不正則君位危君位危則大臣倍小臣竊刑肅而俗敝則法無常法無常而禮無列禮無列則士不事也刑肅而俗敝則民弗歸也是謂疵國倍違上行私也或亦倍而去之之謂小臣竊所謂盜臣也肅峻急也俗敝人無廉恥風俗敝敗也治國無禮故至於刑肅而俗敝為君者但恣已用刑遂廢常法法廢而禮無上下之列矣宜乎士不修職民心離叛也豈非疵病之國乎故政者君之所以藏身也是故夫政必本於天殽以降命命降于社之謂殽地降于祖廟之謂仁義降于山川之謂興作降于五祀之謂制度此聖人所以藏身之固也藏猶安也君者政之所自出故政不正則君位危書言天工人其代之典曰天叙禮曰天秩是人君之政必本於天而效法之以布命於下也社祭后土也因祭社而出命是效地之政有事於祖廟而出命是仁義之致有事於山川而出命是興作之政有事於五祀而出命是制度之政效地者效其高下之勢以定尊卑之位也仁義者仁以思慕言義以親疏言思慕之心無窮而親疏之殺有定又親親仁也尊尊義也自仁率親等而上之至于祖而尊尊之義隆自義率祖順而下之至于禰而親親之仁篤也興作之事非材不成故於山川制度之興始於宫室故本五祀夫安上治民莫善於禮聖人庸禮之政如此故身安而國可保也殽音效殺去聲故聖人參於天地並於鬼神以治政也處其所存禮之序也玩其所樂民之治也故天生時而地生財人其父生而師教之四者君以正用之故君者立於無過之地也此承上章言政之事謂聖人所以參贊天地之道擬並鬼神之事凡以治政而已故處天地鬼神之所存則天髙地下萬物散殊聖人法之此禮之所以序也玩天地鬼神之所樂則流而不息合同而化聖人法之此民之所以治也四時本於天百貨産於地人生於父而德成於師此四者君以正用之謂人君正身修德順天之時因地之利而裁成其道輔相其宜以左右民使之養生喪死無憾然後設為庠序學校之教申之以孝弟焉則有以富之教之而治道得矣然其要在君之自正其身立於無過之地而後可不能正其身如正人何擬治政治平聲注同餘治如字處上聲樂音洛音擬相左右並去聲弟音悌故君者所明也非明人者也君者所養也非養人者也君者所事也非事人者也故君明人則有過養人則不足事人則失位故百姓則君以自治也養君以自安也事君以自顯也故禮達而分定故人皆愛其死而患其生此承上章君立於無過之地而言舊說明猶尊也故讀則君為明君今定此章三明字皆讀為則字則上下文義坦然相應矣不必迂其說也君者正身修德而為臣民之所則效者也非則效人者也臣民之所奉養也非奉養人者也臣民之所服事也非服事人者也君而則人則是身不足以為人所取則而反取則於人非立於無過之地者矣君而養人則一人之身豈能供億兆人之食必不足矣君而事人則降尊以事卑為失位矣惟百姓者則君以自治其身所謂文武興則民好善也養君以自安謂竭力供賦稅則有耕食鑿飲之安也事君以自顯謂竭忠盡職則有錫爵之榮也禮教通達而名分不踰故人皆慕守義而死恥不義而生也石梁王氏曰此處皆非夫子之言聲明讀為則養去聲治平分音問故用人之知去其詐用人之勇去其怒用人之仁去其貪言人君用人當取其所長所舍其所短蓋中人之才有長必有所短也去猶弃也有知謀者易流於欺詐故用人之知當棄其詐而不責也有剛勇者易至於猛暴故用人之勇當棄其猛暴之過也物朱子曰仁止是愛愛而無義以制之便事事都愛好事也愛好官爵也愛愛錢也愛事事都愛所以貪也故用人之仁當棄其貪之失也知去聲去上聲故國有患君死社稷謂之義大夫死宗廟謂之變大夫死宗廟言衛君之宗廟而致死也然已之宗廟亦在本國不棄君之宗廟即是不棄已之宗廟也舊說變讀為辨辨猶正也一說其死有分辨非可以無死而死也故聖人耐以天下為一家以中國為一人者非意之也必知其情辟於其義明於其利達於其患然後能為之何謂人情喜怒哀懼愛惡欲七者弗學而能何謂人義父慈子孝兄良弟弟夫義婦聽長惠幼順君仁臣忠十者謂之人義講信修睦謂之人利爭奪相殺謂之人患故聖人之所以治人七情修十義講信修睦尚辭讓去爭奪舍禮何以治之非意之謂非以私意臆度而為之也必是知其有此七情也故開辟其十義之途而使之由之明達其利與患之所在而使之知所趨知所避然後能使之為一家為一人也七情弗學而能有禮以治之則人義人利由此而生禮廢則人患由此而起問愛與欲何别朱子曰愛是泛愛那物欲則有意於必得便要拏將來耐音能辟婢亦切惡去聲下弟音悌長上聲治平聲去上聲舍上聲度入聲别必列切飲食男女人之大欲存焉死亡貧苦人之大惡存焉故欲惡者心之大端也人心雖有七情總而言之止是欲惡二者故曰大端惡去聲人藏其心不可測度也美惡皆在其心不見其色也欲一以窮之舍禮何以哉欲惡之心藏於內他人豈能測度之所欲之善惡所惡之善惡豈可於顔色覘之若要一一窮究而察識非求之於禮不可蓋七情中節十義純熟則舉動自然合禮若七情乖僻人倫有虧則言動之閒皆失常度矣有諸中必形諸外也若不知禮則無以察其情義之得失於動作威儀之閒矣度入聲見音現舍上聲中去聲故人者其天地之德隂陽之交鬼神之㑹五行之秀氣也天地鬼神五行皆隂陽也德指實理而言交指變合而言會者妙合而凝也形生神發皆其秀而最靈者故曰五行之秀氣也石梁王氏曰此語最粹故天秉陽垂日星地秉隂竅於山川播五行於四時和而后月生也是以三五而盈三五而闕竅於山川山澤通氣也五行一隂陽也質具於地氣行於天春木夏火秋金冬水各主其事以成四時月之盈虧由於日之近逺四序順和日行循軌而後月之生明如期望而盈晦而死無朓朒之失也播上聲朓土了切朒音忸五行之動迭相竭也五行四時十二月還相為本也動運也竭盡也終也本者始也五行之運於四時迭相終而還相始終則有始如環無端也冬終竭而春始來則春為夏之本春竭而夏來則夏又為秋之本已往者為見在者所謁見在者為方來者所本五行四時十二月莫不皆然也音還音旋見現五聲六律十二管還相為宫也五聲宫商角徵羽也六律陽聲黃鍾子太蔟寅姑洗辰蕤賔午夷則申無射戌也隂聲謂之六吕大吕丑應鍾亥南吕酉林鍾未仲吕已夾鍾卯也六律六吕皆是候氣管名律法也又云述也吕助也言助陽宣氣也總而言之皆可稱律故月令十二月皆稱律也長短之數各有損益又有娶妻生子之例長短損益者如黃鍾長九寸下生者三分去一故下生林鍾長六寸也上生者三分益一如林鍾長六寸上生太蔟長八寸也上下之生五下六上蓋自林鍾未至應鍾亥皆在子午以東故謂之下生自大吕丑至蕤賔午皆在子午以西故謂之上生子午皆屬上生當云七上而云六上者以黃鍾為諸律之首故不數也律娶妻而吕生子者如黃鍾九以林鍾六為妻太蔟九以南吕六為妻隔八而生子則林鍾生太蔟夷則生夾鍾之類也各依此推之可見還相為宫者宫為君主之義十二管更迭為主自黃鍾始當其為宫五聲皆備黃鍾第一宫下生林鍾為徵上生太蔟為商下生南吕為羽上生姑洗為角餘倣此林鍾第二宫太蔟三南吕四姑洗五應鍾六蕤賔七大吕八夷則九夾鍾十無射十一仲吕十二也此非十二月之次序乃律吕相生之次序也徵音止洗音蘚射音亦應去聲數上聲更平聲五味六和十二食還相為質也酸苦辛鹹加滑與甘是五味六和也十二食十二月之所食也還相為質者如春三月以酸為質夏三月以苦為質而六和皆相為用也和去聲五色六章十二衣還相為質也五色青赤黃白黑也并天𤣥為六章十二月之衣如月令春衣青夏衣朱之類還相為質謂畫繪之事主其時之一色而餘色閒雜也春衣夏衣衣去聲閒去聲故人者天地之心也五行之端也食味别聲被色而生者也天地之心以理言五行之端以氣言食五味别五聲被五色其閒皆有五行之配而性情所不能無者問人者天地之心朱子曰謂如天道福善禍淫乃人所欲也善者人皆欲福之淫者人皆欲禍之又曰教化皆是人做此所謂人者天地之心也別必列切故聖人作則必以天地為本以隂陽為端以四時為柄以日星為紀月以為量鬼神以為徒五行以為質禮義以為器人情以為田四靈以為畜以天地為本故物可舉也以隂陽為端故情可睹也以四時為柄故事可勸也以日星為紀故事可列也月以為量故功有藝也鬼神以為徒故事可守也五行以為質故事可復也禮義以為器故事行有考也人情以為田故人以為奧也四靈以為畜故飲食有由也此章凡十條自天地至人情九條皆是覆說前章諸事萬事萬物之理不出乎天地之閒聖人作為典則而以天地為本則事物之理皆可舉行得情之善者屬陽惡者屬隂求其端於隂陽則善惡可而見柄猶權也四時各有當為之事執當時之權柄以教民立事則事可勸勉而成日星為紀如日中星鳥日永星火之類所以紀時之早晚列者以十二月之事詳列以示民而使之作為也量限量也謂十二月之分限分限不踰則所為皆得其時故事功滋長如樹藝然也事徒如徒侣之相依郊社宗廟山川五祀之禮皆與政相依即前章殽地以下諸事如此行政則凡事可悠久不失也正五行之氣周而復始質猶正也國家嵗有常事必取於五行之時令則其事亦今嵗周而來嵗復始也豈器必成而後適於用今用禮義如成器則事之所行有不成者乎考成也榖治人情如治田不使邪僻害正性如不使稊稗害嘉則人皆有宿道向方之所如室之有奧也聖六畜人家所豢養四靈本非可以豢養致者今皆為世而出如馴畜然皆聖人道化所感耳飲食有由者由用也謂四靈為鳥獸魚鱉之長長至則其屬皆至有可用之以供庖厨者矣量去聲畜許六切分音問治平聲何謂四靈麟鳳龜龍謂之四靈故龍以為畜故魚鮪不淰鳳以為畜故鳥不獝麟以為畜故獸不狘龜以為畜故人情不失鮪魚之大者故特言之淰羣隊驚散之貌獝驚飛也狘驚走也三靈物既馴擾如畜則其類皆隨從之雖見人亦不為之驚而飛走矣龜能前知人有所決以知可否故不失其情之正也上三物皆因飲食有由而言龜獨不言介蟲之類應者以其為決疑之寶非可以飲食之物例之也石梁王氏曰四靈以為畜衍至此無義味太迂疏何所無龜鮪音偉淰音審獝況必切狘許月切故先王秉蓍龜列祭祀瘞繒宣祝嘏辭說設制度故國有禮官有御事有職禮有序瘞埋也繒幣帛也祭法云瘞埋於泰折祭地也繒之言贈埋幣告神者亦以贈神也宣揚也先王重祭事故定期日於蓍龜而陳列祭祀之禮設為制度如此其詳制度一定國家有典禮可守官有所治事有其職禮得其序也瘞音曀繒似仍切故先王患禮之不達於下也故祭帝於郊所以定天位也祀社於國所以列地利也祖廟所以本仁也山川所以儐鬼神也五祀所以本事也故宗祝在廟三公在朝三老在學王前巫而後史卜筮瞽侑皆在左右王中句心無為也以守至正天子致尊天之禮則天下知尊君之禮故曰定天位食貨所資皆出於地天子親祀后土正為表列地利使天下知報本之禮也仁之實事親是也人君以子禮事尸所以達仁義之教於下也儐禮鬼神而祭山川本諸事為而祭五祀皆是使禮教之四達此亦前章未盡之意廟有宗祝朝有三公學有三老五更無非明禮教以淑天下巫主弔臨之禮而居前史書言動之實而居後瞽為樂師侑為四輔或辨聲樂或贊威儀而王居其中此心何所為哉不過守君道之至正而已此又是人君以禮自防示教於天下也石梁王氏曰巫祭祀方用卜筮有事方問謂常在左右非也儐音擯故禮行於郊而百神受職焉禮行於社而百貨可極焉禮行於祖廟而孝慈服焉禮行於五祀而正法則焉故自郊社祖廟山川五祀義之修而禮之藏也此承上文祭帝於郊等禮而言百神受職謂風雨節寒暑時而無咎徵也百貨可極謂地不愛寶物無遺利也孝慈服謂天下皆知服行孝慈之道也正法則謂貴賤之禮各有制度無敢僭踰也聖王精禋感格其效如此由此觀之則郊社祖廟山川五祀皆義之修飾而禮之府藏也前言山川興作而此不言者法則之事包之也藏去聲是故夫禮必本於大一分而為天地轉而為隂陽變而為四時列而為鬼神其降曰命其官於天也極大曰太未分曰一太極函三為一之理也分為天地則有高卑貴賤之等轉為隂陽則有吉凶刑賞之事變為四時則有嵗月久近之差列為鬼神則有報本反始之情聖人制禮皆本於此以降下其命令者是皆主於法天也官者主之義是石梁王氏曰禮家見易有太極字翻出一箇太一仍諸子語其官於天也一句結上文官天地當如莊子義聲大音泰差楚宜切下其下去夫禮必本於天動而之地列而之事變而從時協於分藝其居人也曰養其行之以貨力辭讓飲食冠昏喪祭射御朝聘此亦本前章本於天殽於地之意動而之地即殽地也列而之事即五祀所以本事也變而從時即四時以為柄也協合也分謂月以為量也藝即功有藝也上言藝之修禮之藏故此亦始言禮終言義居人猶言在人也禮雖聖人制作而皆本於人事當然之義故云居人曰義也冠昏而下八者皆禮也然行禮者必有貨財之資筋力之强辭讓之節飲食之品亦皆當然之義也音分去聲養讀為義冠去聲朝音潮殽效量去聲故禮義也者人之大端也所以講信修睦而固人肌膚之會筋骸之束也所以養生送死事鬼神之大端也所以達天道順人情之大竇也故唯聖人為知禮之不可以已也故壞國喪家亡人必先去其禮肌膚之總會筋骨之聨束非不固也然無禮以維飭之則惰慢傾側之容見矣故必禮以固之也竇孔穴之可出入者由於禮義則通達不由禮義則窒塞故以竇譬之聖人之能達天道順人情者以其知禮之不可以已也彼敗國之君喪家之主亡身之夫皆以先去其禮之故也壞音怪喪去聲去上聲見音現塞入聲故禮之於人也猶酒之有糵也君子以厚小人以薄人以禮而成德如酒以麯糵而成味君子厚於禮故為君子小人薄於禮故為小人亦如酒之有醇醨也故聖王修義之柄禮之序以治人情故人情者聖王之田也修禮以耕之劉氏曰修者講明也柄者人所操也聖王講明乎義之所在使人得所持循而制事之宜也人皆操義之要以處禮之序則情之發皆中節矣故可以治人情也禮者人情之防範修道之教莫先於禮故治人之情以禮為先務如治田者必先以耒耜耕之也治平聲操平聲處上聲中去聲陳義以種之義者人情之裁制隨事制宜而時措之如隨田之宜而種所當種也講學以耨之禮義固可使情之中節然或氣質物欲蔽之而私意生焉則如草萊之害嘉種矣故必講學以明理欲之辨去非而存是如農之耨以去草養苗也種上聲去上聲本仁以聚之講學以耨之者博而求之於不一之善所以得一本萬殊之理本仁以聚之者約而會之於至一之理所以造萬殊一本之妙也至此則㑹萬理為一理而本心之德全矣此如榖之熟而斂之也造七到切播樂以安之聚之者利仁之事未能安仁也故必使之詠歌舞蹈以陶養其德性消融其查滓而使之和順於道德焉則造於從容自然之域矣此則如食之而厭飫也此五者聖王修道之教始終條理如此而講學居其中以通貫乎前後蓋禮耕義種入德之功學之始條理也仁聚樂安成德之效學之終條理也自始至終於仁義禮樂無所不講至其成也則禮義之功著於先仁樂之效見於後焉造七到切從七容切見音現故禮也者義之實也協諸義而協則禮雖先王未之有可以義起也實者定制也禮者義之定制義者禮之權度禮一定不易義隨時制宜故協合於義而合當為者則雖先王未有此禮可酌之於義而創為之禮焉此所以三代損益不相襲也義者藝之分仁之節也協於藝講於仁得之者强藝以事言仁以心言事之處於外者以義為分限之宜心之發於內者以義為品節之制協於藝者合其事理之宜也講於仁者商度其愛心之親疏厚薄而協合乎行事之大小輕重一以義為之裁制焉上好義則民莫敢不服故得義者强入分去聲度聲仁者義之本也順之體也得之者尊仁者本心之全德故為義之本是乃百順之體質也元者善之長體仁足以長人故得仁者尊上文言禮者義之實此言仁者義之本實以散體言本以全體言同一理也張子謂經禮三百曲禮三千無一事之非仁也猶之木焉從根本至枝葉皆生意此全體之仁也然自一本至千枝萬葉先後大小各有其序此散體之禮也而其自本至末一枝一葉各具一理隨時榮悴各得其宜者義也故治國不以禮猶無耜而耕也為禮不本於義猶耕而弗種也為義而不講之以學猶種而弗耨也講之以學而不合之以仁猶耨而弗穫也合之以仁而不安之以樂猶穫而弗食也此反譬以申明前假聖學教養之事有始有卒其序不可紊而功不可缺如此安之以樂而不達於順猶食而弗肥也四體既正膚革充盈人之肥也父子篤兄弟睦夫婦和家之肥也大臣法小臣廉官職相序君臣相正國之肥也天子以德為車以樂為御諸侯以禮相與大夫以法相序士以信相考百姓以睦相守天下之肥也是謂大順大順者所以養生送死事鬼神之常也前章至播樂以安之而止此又益以不逹於順猶食而弗肥一節者蓋安之以樂以前皆是成己之功大學明德之事也逹之於順以後方是成物之效大學新民之事也故以人身之肥設譬而言家國天下之肥至此乃是聖學之極功成己成物合內外之道大學身修家齊國治天下平之事也故謂之大順大順則無為而治所以養生送死事鬼神各得其常也以上並劉氏說仁大臣法盡臣道也小臣廉不虧所守也以德為車由義行也以樂為御動無不和也以禮相與朝聘以時也以法相序上不逼下下不僭上也以信相考久要不忘也以睦相守出入相友守望相助疾病相扶持也肥者充盛而無不足之意故事大積焉而不苑並行而不謬細行而不失深而通茂而有閒連而不相及也動而不相害也此順之至也故明於順然後能守危也此以下至篇終皆是發明大順之說謂以此大順之道治天下則雖事之大者積疊在前亦不至於膠滯雖事之不同者一時並行亦不至舛謬也雖小事所行亦不以其微細而有失也雖深窅而可通雖茂密而有閒謂有中閒也兩物接連而相及則有彼此之爭兩事一時而俱動則有利害之爭不相及不相害則無所爭矣此泛言人君治天下之事有大有細有深有茂有連有動而自然各得其分理者不過一順之至而已故明於順然後能守危亡之戒而不至於危亡也苑音尹窅音杳分去聲故禮之不同也不豐也不殺也所以持情而合危也故聖王所以順山者不使居川不使渚者居中原而弗敝也用水火金木飲食必時合男女頒爵位必當年德用民必順故無水旱昆蟲之災民無凶饑妖孽之疾貴賤有等故禮制不同應儉者不可豐應隆者不可殺所以維持人情不使之驕縱保合上下不使之危亂也聖王所以順民之情者如安於山則不徙之居川安於渚則不徙之居中原故民不困敝也獺祭魚然後虞人入澤梁及春獻龞蜃秋獻龜魚之類是用水必時也春取榆柳之火夏取棗杏之火季夏取桑柘之火秋取柞楢之火冬取槐檀之火又周禮季春出火季秋納火之類是用火必時也草人以時取金玉錫石及月令季春審五庫之量金鐵為先是用金必時也仲冬斬陽木仲夏斬隂木是用木必時也飲食則如食齊視春時羮齊視夏時之類是也合男女必當其年頒爵位必當其德用民必於農隙凡此皆是以順行之故能感召兩閒之和而無旱乾水溢及螟蝗之災也凶饑年凶穀不熟也妖謂衣服歌謡草木之怪孽謂禽獸蟲豸之怪史家五行志所載代有之疾患也殺色介切當去聲楢以周切草古猛切如食食音嗣齊去聲乾音干豸音雉故天不愛其道地不愛其寶人不愛其情故天降膏露地出醴泉山出器車河出馬圖鳳皇麒麟皆在郊棷龜龍在宫沼其餘鳥獸之卵胎皆可俯而窺也則是無故先王能修禮以達義體信以達順故此順之實也舊說器為銀甕丹甑車為山車垂鉤謂不待揉治而自圓曲也晉時恆山大樹自拔根下有璧七十圭七十三皆光色精竒異常玉又張掖柳谷之石有八卦璜玦之象亦此類也棷與藪同龍之變化叵測未必宫沼有之亦極言至順感召之卓異耳不以辭害意可也修禮以達義者修此禮以為教而達之天下無不宜也體信以達順者反身而誠而達之天下無不順也此極功矣故結之曰此順之實也恭程子曰君子修己以敬篤恭而天下平惟上下一於敬則天地自位萬物自育而四靈畢至矣此體信達順之道和朱子曰信是實理順是和氣體信是致中達順是致實體此道於身則自然發而中節推之天下而無所不通也棷音藪叵音頗禮記集說卷四
