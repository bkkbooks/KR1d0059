body:
  text: 禮記集説卷三元陳澔撰王制第五疏曰王制之作在秦漢之際盧植云文帝令博士諸生作令平聲王者之制祿爵公侯伯子男凡五等孟子言天子一位子男同一位諸侯之上大夫卿下大夫上士中士下士凡五等孟子言君一位凡六等公疏曰五等虞夏周同殷三等侯伯也天子之田方千里公侯田方百里伯七十里子男五十里不能五十里者不合於天子附於諸侯曰附庸此言天子諸侯田里之廣狹不能猶不足也不合於天子者不與王朝之聚會也民功曰庸其功勞附大國而達於天子故曰附庸天子以下皆言田而不言地者以地有山林川澤原隰險夷之不同若限以地里而不計田里則井地不均穀祿不平矣里數有二分田之里以方計如方里而井是也分服之里以袤計如二十五家為里是也後章言方千里者為田九萬畝此以方計者也自恆山至于南河千里而近此以袤計者也分服則計道里逺近以為朝貢之節分田則計田畝多寡以為賦祿之制此所以為均平也與去聲袤音茂天子之三公之田視公侯天子之卿視伯天子之大夫視子男天子之元士視附庸此言王朝有位者之田亦與孟子不同方氏曰三公而下食采邑於畿內祿之多少以外諸侯為差元士上士也與元子元侯稱元同不言中士下士則視附庸惟上士也楚采去聲差宜切制農田百畝百畝之分上農夫食九人其次食八人其次食七人其次食六人下農夫食五人庶人在官者其祿以是為差也此言庶人之田井田之制一夫百畝肥饒者為上農墝瘠者為下農故所養有多寡也府史胥徒之屬皆庶人之在官者其祿以農之上下為差多者不得過食九人之祿寡者不得下食五人之祿隨其髙下為五等之多寡也分去聲食音嗣差楚宜切諸侯之下士視上農夫祿足以代其耕也中士倍下士上士倍中士下大夫倍上士卿四大夫祿君十卿祿此言大國也視上農夫者得食九人之祿也次國之卿三大夫祿君十卿祿小國之卿倍大夫祿君十卿祿程子曰孟子之時去先王未逺載籍未經秦火然而班爵祿之制已不聞其詳今之禮書皆掇拾於煨燼之餘而多出於漢儒一時之傅會奈何欲盡信而句為之解乎然則其事固不可一一追復矣朱子曰孟子此章之説與周禮王制不同蓋不可考闕之可也可方氏曰次國小國不言大夫士者多寡同於大國知由卿而上三等之國所異由大夫而下三等之國所同者蓋卿而上其祿浸厚茍不為之殺則地之所出不足以供大夫而下其祿浸薄茍亦為之殺則臣之所養不能自給此所以多寡或同或異也次國之上卿位當大國之中中當其下下當其上大夫小國之上卿位當大國之下卿中當其上大夫下當其下大夫此言三等之國其卿大夫俯聘並會之時尊卑之序如此鄭云爵位同則小國在下謂二人同是卿則小國卿在大國卿之下爵異固在上者謂若大國是大夫小國是卿則位於大國大夫之上也俯音挑其有中士下士者數各居其上之三分鄭氏曰謂其為介若特行而並會也居猶當也此據大國而言大國之士為上次國之士為中小國之士為下士之數國皆二十七人各三分之上九中九下九小疏曰今大國之士既定在朝會若其有中國之士國之士者其行位之數各居其上國三分之二謂次國以大國為上而次國上九當大國中九次國中九當大國下九是各當其大國三分之二小國以次國為上小國上九當次國中九小國中九當次國下九亦是居上三分之二也是各居上之三分行音杭凡四海之內九州州方千里州建百里之國三十七十里之國六十五十里之國百有二十凡二百一十國名山大澤不以封其餘以為附庸間田八州州二百一十國九州并王畿而言此但言每一州所可容者如此凡八州餘以例推皆言畿外之制下文始言天子畿內之制也間音間天子之縣內方百里之國九七十里之國二十有一五十里之國六十有三凡九十三國名山大澤不以朌其餘以祿士以為間田鄭注畿內九大國者三為三公之田又三為三公致仕者之田餘三待封王之子弟也次國二十一者六為六卿之田又六為六卿致仕者之田又三為三孤之田餘六亦待封王子弟也小國六十三者二十七大夫之田并大夫致仕之田共五十四餘九亦待封王子弟也三孤無職雖致仕猶可即而謀故不副愚意此無明證皆鄭氏臆説况周制六卿兼公孤則所餘之田尚多然如周召之支子在周者皆世爵祿則纍朝之王子弟未必能盡有所封也疏曰畿外諸侯有封建之義故云不以封畿內之臣不世位有朌賜之義故云不以朌國朱子曰恐只是諸儒做箇如此算法其實不然建必因山川形勢無截然可方之理又曰非惟施之當今有不可行求之昔時亦有難曉石梁王氏曰天子縣內以封者或三分之一或半之又除山川城郭塗巷溝渠則奉上者幾何朌音頒凡九州千七百七十三國天子之元士諸侯之附庸不與九州而千七百七十三國者內一州為王圻容九十三國外八州容一千六百八十國并畿內為千七百七十三國也元士附庸不與者以上文所算止五十里而元士附庸皆不能五十里故不與也石梁王氏曰注引千八百國之説謂夏制要服內七千里與五服五千之言不合與去聲要平聲天子百里之內以共官千里之內以為御共官謂供給王朝百官府文書之具泛用之需御謂凡天子之服用蓋皆取之租稅也足方氏曰以百里所出之少資百官之所共疑若不然卑者所稱不為不足以千里所出之多為一人之御疑若有餘然尊者所稱不為有餘且以其近者與人則欲其易給而無勞以其逺者奉己則欲其難致而有節百里之內非不以為御也要之以共官為主耳千里之內非不共官也要之以為御為主耳共音恭要平聲千里之外設方伯五國以為屬屬有長十國以為連連有帥三十國以為卒卒有正二百一十國以為州州有伯八州八伯五十六正百六十八帥三百三十六長八伯各以其屬屬於天子之老二人分天下以為左右曰二伯春秋傳曰自陜以東周公主之自陜以西召公主之此即天子之上公分主天下之侯國也八伯為八州之伯二伯則天下之伯也卒子忽切千里之內曰甸千里之外曰采曰流方氏曰甸服四面五百里則為方千里矣王畿千里之外莫近於侯服而采又侯服之最近者莫逺於荒服而流又荒服之最逺者舉其最逺最近則綏要之服在其中矣天子三公九卿二十七大夫八十一元士石梁王氏曰唐虞稽古建官惟百夏商官倍注獨引明堂位謂夏官百非也大國三卿皆命於天子下大夫五人上士二十七人次國三卿二卿命於天子一卿命於其君下大夫五人上士二十七人小國二卿皆命於其君下大夫五人上士二十七人馬氏曰天子六卿而二卿一公故有三公而六卿之中又有三孤焉天子六卿而大國三卿乃其統之屬也至於大夫士則又三卿之屬焉下大夫五人二卿之下下大夫各二人一卿之下下大夫一人周官所謂設其參即三卿也傅其伍即下大夫五人也陳其殷即上士二十七人也有上中下之大夫而獨言下大夫者對卿而言也其實大夫有上中下之辨士亦有上中下而獨言上士者對府史而言也其實士又有上中下之異傅音富天子使其大夫為三監監於方伯之國國三人監者監臨而督察之也自王朝出權亦尊矣一州三人則二十四人也此大夫之在朝必無職守者使有常職豈可遣乎不然則特命也下上監如字去聲監平聲天子之縣內諸侯祿也外諸侯嗣也畿內之地王朝百官食祿之邑在焉畿外乃以封建使其子孫嗣守然內亦謂之諸侯者三公之田視公侯卿視伯大夫視子男元士視附庸也制三公一命卷若有加則賜也不過九命制者言三公命服之制也命數止於九天子之三公八命著鷩冕若加一命則為上公與王者之後同而著衮冕故云一命衮若為三公而有加衮者是出於特恩之賜非例當然故云若有加則賜也人臣無過九命者大宗伯再命受服與此不同馬氏曰三公衮服有降龍無升龍卷音衮鷩音鱉著直略切次國之君不過七命小國之君不過五命大國之卿不過三命下卿再命小國之卿與下大夫一命方氏曰大國之卿不過三命下卿再命則知次國之卿再命一命也小國之卿與下大夫一命則知三等之國其大夫皆一命而已大國對下卿言卿指上中可知小國特言卿則兼二等之卿可知言下大夫而不及上中者蓋諸侯無中大夫而卿即上大夫故也前言上中下之所當與此不同者位雖視其命不能無詳略之異也凡官民材必先論之論辨然後使之任事然後爵之位定然後祿之爵人於朝與士共之刑人於市與衆棄之論謂考評其行藝之詳也論辨則材之優劣審矣任事則能勝其任矣於是爵之以一命之位而養之以祿焉之疏曰爵人於朝殷法也周則天子假祖廟而拜授刑人於市亦殷法謂貴賤皆刑于市周則有爵者刑于甸師氏也論去聲朝音潮假音格是故公家不畜刑人大夫弗養士遇之塗弗與言也屏之四方唯其所之不及以政示弗故生也公家不畜刑人舊説以為商制以周官墨者守門劓者守關宫者守內刖者守囿髠者守積也唯其所之者量其罪之所當往適之地而居之如虞書五流有宅五宅三居是也不及以政賦役不與也示弗故生不授之田不賙其乏示不故欲其生也去屏上聲積子賜切量聲與去聲諸侯之於天子也比年一小聘三年一大聘五年一朝比年每嵗也小聘使大夫大聘使卿朝則君親行比音畀天子五年一巡守舜典曰五載一巡守周官大行人曰十有二嵗王巡守殷國孟子曰巡守者巡所守也守去聲嵗二月東巡守至于岱宗柴而望祀山川覲諸侯問百年者就見之嵗二月當巡守之年二月也岱泰山也宗尊也東方之山莫高于此故祀以為東嶽而稱岱宗也柴本作祡今通用燔燎以祭天而告至也東方山川之當祭者皆於此望而祀之遂接見東方之諸侯問有百嵗之人則即其家而見之以其年高故不召見也命大師陳詩以觀民風命市納賈以觀民之所好惡志淫好辟大師樂官之長詩以言志采録而觀覽之則風俗之美惡可見政令之得失可知矣物之供用者皆出於市而價之貴賤則係於人之好惡好質則用物貴好奢則侈物貴志流於奢淫則所好皆邪僻矣僻大音泰賈好惡並去聲辟音命典禮考時月定日同律禮樂制度衣服正之典禮掌禮之官也考時月定日即舜典所云協時月正日也考校四時及月之大小時有節氣早晚月有弦望晦朔日有甲乙先後考之使各當其節法律禮樂制度衣服皆王者所定天下一君不容有異異則非正矣故因巡守所至而正其不同者使皆同也當去聲山川神祇有不舉者為不敬不敬者君削以地凡祭有其舉之莫敢廢也故不舉者為不敬山川地之望也故削地焉宗廟有不順者為不孝不孝者君絀以爵宗廟不順如紊昭穆之次失祭祀之時皆不孝也爵者祖宗所傳故絀爵馬絀音黜變禮易樂者為不從不從者君流革制度衣服者為畔畔者君討不從違戾也流者竄之逺方討者聲罪致戮孟子曰天子討而不伐此章四君字皆謂國君有功德於民者加地進律應氏曰律者爵命之等加地而進之所以示勸也五月南巡守至于南嶽如東巡守之禮八月西巡守至于西嶽如南巡守之禮十有一月北巡守至于北嶽如西巡守之禮歸假于祖禰用特假至也歸至京師即以特牛告至于祖禰之廟假音格天子將出類乎上帝宜乎社造乎禰諸侯將出宜乎社造乎禰類宜造皆祭名後章言天子將出征則此出為巡守也諸侯則朝覲會同之出歟造七到切天子無事與諸侯相見曰朝考禮正刑一德以尊于天子無事無死喪寇戎之事也考禮者稽考而是正之使無違僭也正刑者行以公平使無偏枉也一德無二心也三者皆尊天子之事潮朝音天子賜諸侯樂則以柷將之賜伯子男樂則以鼗將之柷形如漆桶方二尺四寸深一尺八寸中有椎柄連底撞之令左右擊所以合樂之始鼗如鼓而小有柄持而搖之則旁耳自擊所以節樂之終將之謂使者執此以將命也疏曰柷節一曲之始其事寬故以將諸侯之命鼗節一唱之終其事狹故以將伯子男之命柷昌六切令平聲使去聲諸侯賜弓矢然後征賜鈇鉞然後殺鈇莝斫刀也鉞斧也莝粗卧切賜圭瓚然後為鬯未賜圭瓚則資鬯於天子圭瓚璋瓚皆酌鬯酒之爵以大圭為瓚之柄者曰圭瓚釀秬鬯為酒芬香條鬯於上下故曰鬯祭酒灌地降神必用鬯故未賜圭瓚則求鬯於天子賜圭瓚然後得自為也天子命之教然後為學小學在公宮南之左大學在郊天子曰辟雍諸侯曰頖宮疏曰百里之國國城居中面有五十里二十里置郊郊外仍有三十里七十里之國國城居中面有三十五里九里置郊郊外仍有二十六里五十里之國國城居中面有二十五里三里置郊郊外仍有二十二里此是殷制若周制則畿內千里百里為郊諸侯之郊公五十里侯伯三十里子男十里近郊各半之天子諸侯皆近郊半逺郊此小學大學殷制周則大學在國小學在西郊辟明也雍和也君則尊明雍和於此學中習道藝使天下之人皆明違諧和也頖之言班所以班政教也天張子曰辟雍古無此名蓋始於周周有天下遂以名子之學説文云頖宫諸侯鄉射之宮也以舊説辟雍水環如璧泮宮半之蓋東西門南通水北無水也辟音璧頖音判天子將出征類乎上帝宜乎社造乎禰禡於所征之地受命於祖受成於學禡行師之祭也受命於祖卜於廟也受成於學決其謀也禡馬怕切出征執有罪反釋奠于學以訊馘告獲罪人而反則釋奠于先聖先師而告訊馘馬訊謂其魁首當訊問者馘所截彼人之左耳告者告其多寡之數也馘古伯切天子諸侯無事則嵗三田一為乾豆二為賔客三為充君之庖無事無征伐出行喪凶之事也嵗三田者謂每嵗田獵皆是為此三者之用也乾豆臘之以為祭祀之豆實也疏曰先宗廟次賔客者尊神敬賔之義乾音干無事而不田曰不敬田不以禮曰暴天物天子不合圍諸侯不掩羣書曰暴殄天物合圍四面圍之也掩羣者掩襲而舉羣取之也天子殺則下大綏諸侯殺則下小綏大夫殺則止佐車佐車止則百姓田獵殺獲也獲所驅之禽獸也綏旌旗之屬也下偃仆之也佐車即周禮驅逆之車驅者逐獸使趨於田之地逆者要逆其走而不使之散亡也此言田獵之禮尊卑貴賤之次序聲綏音緌要平獺祭魚然後虞人入澤梁豺祭獸然後田獵鳩化為鷹然後設罻羅草木零落然後入山林昆蟲未蟄不以火田不麛不卵不殺胎不夭夭不覆巢梁絶水取魚者周禮注云水堰也堰水為關空以笱承其空月令仲春鷹化為鳩此言鳩化為鷹必仲秋也罻羅皆捕鳥之網麛獸子之通稱夭斷殺之也夭禽獸之稚者此十者皆田之禮順時序廣仁意也罻音尉麛音迷夭於表切夭烏老切覆芳六切其空空去聲斷去聲冢宰制國用必於嵗之杪五穀皆入然後制國用用地小大視年之豐耗以三十年之通制國用量入以為出以三十年之通者通計三十年所入之數使有十年之餘也蓋每嵗所入均析為四而用其三每年餘一則三年而餘三又足一嵗之用矣此所以三十年而有十年之餘也鄭注以九年言之蓋積三十年內閏月當一嵗也一説二十七年則有九年之餘言三十者舉成數耳杪彌小切當去聲祭用數之仂鄭注以仂為十一疏以為分散之名大槩是總計一嵗經用之數而用其十分之一以行常祭之禮也仂音勒喪三年不祭唯祭天地社稷為越紼而行事喪用三年之仂喪凶事祭吉禮吉凶異道不得相干故三年不祭唯祭天地社稷者不敢以卑廢尊也未葬以前常屬紼於輴車以備火災喪在內而行祭於外是踰越喪紼而往也喪三年而除中間禮事繁難故總計三嵗經用之數而用其十之一也屬音燭喪祭用不足曰暴有餘曰浩祭豐年不奢凶年不儉暴者殘敗之義言不齊整也浩者泛濫之義所謂以美沒禮也惟其制用有一定之則是以嵗有豐凶而禮無奢儉此記者之言雜記云凶年祀以下牲孔子之言也國無九年之蓄曰不足無六年之蓄曰急無三年之蓄曰國非其國也三年耕必有一年之食九年耕必有三年之食以三十年之通雖有凶旱水溢民無菜色然後天子食日舉以樂飢而食菜則色病故云菜色殺牲盛饌曰舉周禮王日一舉鼎十有二物皆有俎以樂侑食又云大荒則不舉者蓋偶值凶年雖有備亦當貶損耳天子七日而殯七月而葬諸侯五日而殯五月而葬大夫士庶人三日而殯三月而葬三年之喪自天子達諸侯降於天子而五月大夫降於諸侯而三月士庶人又降於大夫故踰月也今總云大夫士庶人三日而殯此固所同然皆三月而葬則非也其以上文降殺俱兩月在下可知故略言之歟孔氏引左傳大夫三月士踰月者謂大夫除死月為三月士數死月為三月是踰越一月故言踰月耳誠如此則是大夫四月士三月謂大夫踰越一月猶可豈得謂士踰越一月乎此不可通當從左氏説為正殺去聲數上聲庶人縣封葬不為雨止不封不樹喪不二事此言庶人之禮庶人無碑繂縣繩下棺故云縣窆也不封不為丘壟也大夫士既葬公政入於家庶人則終喪無二事也縣音玄上封音窆為去聲繂音律自天子達於庶人喪從死者祭從生者中庸曰父為大夫子為士葬以大夫祭以士父為士子為大夫葬以士祭以大夫蓋葬用死者之爵祭用生者之祿與此意同支子不祭説見曲禮天子七廟三昭三穆與大祖之廟而七諸侯五廟二昭二穆與大祖之廟而五大夫三廟一昭一穆與大祖之廟而三士一廟庶人祭於寢諸侯大祖始封之君也大夫大祖始爵者也士一廟侯國中下士也上士二廟天子諸侯正寢謂之路寢卿大夫士曰適室亦謂之適寢庶人無廟故祭先於寢也大音泰天子諸侯宗廟之祭春曰礿夏曰禘秋曰嘗冬曰蒸鄭氏曰此蓋夏殷之祭名周則春曰祠夏曰礿以禘為殷祭疏曰礿薄也春物未成祭品鮮薄也禘者次第也夏時物雖未成宜依時次第而祭之嘗者新穀熟而嘗也蒸者衆也冬時物成者衆也鄭疑為夏殷祭名者以其與周不司其夏殷之祭又無文故稱蓋以疑之礿音藥鮮上聲夏殷夏上聲夏時夏如字去聲天子祭天地諸侯祭社稷大夫祭五祀天子祭天下名山大川五嶽視三公四瀆視諸侯諸侯祭名山大川之在其地者天子諸侯祭因國之在其地而無主後者視三公視諸侯謂視其饔餼牢禮之多寡以為牲器之數也因國謂所建國之地因先代所都之故墟也今無主祭之子孫則在王畿者天子祭之在侯邦者諸侯祭之以其昔嘗有功德於民不宜絶其祀也多周官制度云五祀見於周禮禮記儀禮雜出於史傳矣獨祭法加為七左傳家語以為重該修熙句龍之五官月令以為門行户竈中霤然則所謂五祀者名雖同而祭各有所主也鄭氏以七祀為周制五祀為商制然大宗伯亦云祭社稷五祀儀禮士疾病禱五祀則五祀無尊卑隆殺之辨矣愚意鄭氏已是臆説祭法之言亦未可深信勾見傳並去聲重平聲句音殺去聲天子犆礿祫禘祫嘗祫蒸祫合也其禮有二時祭之祫則羣廟之主皆升而合食於大祖之廟而毁廟之主不與三年大祫則毁廟之主亦與焉天子之禮春礿則特祭者各於其廟也禘嘗蒸皆舍食石梁王氏曰特礿者春物全未成止一時祭而已於此時不祫也夏物稍成可於此時而祫秋物大成冬物畢成皆可祫故曰祫禘祫嘗祫蒸而礿則特也與犆音特去聲諸侯礿則不禘禘則不嘗嘗則不蒸蒸則不礿南方諸侯春祭畢則夏來朝故闕禘祭西方諸侯夏祭畢而秋來朝故闕嘗祭四方皆然石梁王氏曰諸侯嵗朝為廢一時之祭王事重也為去聲諸侯礿犆禘一犆一祫嘗祫蒸祫犆礿礿犆非有異也變文而已祫嘗祫蒸與嘗祫蒸祫亦然諸侯所以降於天子者禘一犆一祫而已言夏祭之禘今嵗犆則來嵗祫祫之明年又犆不如天子每嵗三時皆祫也石梁王氏曰物稍成未若大成其成亦未可必故夏禘之時可祫可犆不可嘗也秋冬物成可必故此二時必可祫故不云犆而云嘗祫蒸祫此一節專為祫祭發也今愚按此章先儒以為夏殷之制然禘王者之大祭也以為四時常祭之名何歟豈周更時祭之名而後禘專為大祭歟又周官制度云先王制禮必象天道故月祭象月時享象時三年之祫五年之禘象閏又云王制之言祫非三年之制也專為為去聲更平聲天子社稷皆太牢諸侯社稷皆少牢大夫士宗廟之祭有田則祭無田則薦庶人春薦韭夏薦麥秋薦黍冬薦稻韭以卵麥以魚黍以豚稻以鴈祭有常禮有常時薦非正祭但遇時物即薦然亦不過四時各一舉而已注云祭以首時薦以仲月首時者四時之孟月也少去聲祭天地之牛角繭栗宗廟之牛角握賔客之牛角尺如繭如栗犢也握謂長不出膚側手為膚四指也賔客之用則取其肥大而已諸侯無故不殺牛大夫無故不殺羊士無故不殺犬豕庶人無故不食珍烹牛羊豕必為鼎實鼎非常用之器有禮事則設所以無故不殺也珍之名物見內則庶人無故亦以非冠昏之禮歟庶羞不踰牲燕衣不踰祭服寢不踰廟羞不踰牲者如牲是羊則不以牛肉為庶羞也此三者皆言薄於奉已厚於事神大夫祭器不假祭器未成不造燕器此一節舊在庶人耆老不徒食之後今考其序當移在此大夫有田祿則不假借祭器於人無田祿者不設祭器則假之可也凡家造祭器為先養器為後古者公田藉而不稅孟子曰殷人七十而助助者藉也但借民力以助耕公田而不取其私田之稅藉子夜切市㕓而不稅廛市宅也賦其市地之廛而不征其貨也關譏而不征關之設但主於譏察異服異言之人而不征其往來貨物之稅也林麓川澤以時入而不禁山澤采取之物其入也雖有時然與民共其利即孟子所謂澤梁無禁也夫圭田無征圭田者祿外之田所以供祭祀不稅所以厚賢也曰圭者潔白之義也周官制度云圭田自卿至士皆五十畝此專主祭祀故無征然王制言大夫士宗廟之祭有田則祭無田則薦孟子亦曰惟士無田則亦不祭既云皆有田何故又云無田則薦以此知賜圭田亦似有功德則賜圭瓚耳夫音扶用民之力嵗不過三日用民力如治城郭塗巷溝渠宮廟之類周禮豐年三日中年二日無年則一日而已若師旅之事則不拘此制田里不粥墓地不請田里公家所授不可得而粥墓地有族葬之序人不得而請求已亦不得以擅與故爭墓地者墓大夫聽其訟焉粥音育篇內並同司空執度度地居民山川沮澤時四時量地逺近興事任力書曰司空掌邦土執度度地量地逺近蓋定邑井城郭廬舍之區域也山川沮澤有燥濕寒暖之不同以時候其四時知其氣候早晚使居者不失寒暖之宜也興事任力亦謂公家力役之征也方氏曰小而水所止曰沮大而水所鍾曰澤度上如字下待洛切沮將慮切凡使民任老者之事食壯者之食老者食少而功亦少壯者功多而食亦多今之使民雖少壯但責以老者之功程雖老者赤食以少者之飲食寬厚之至也聲食壯食音嗣注亦食同少壯少者少去凡居民材必因天地寒暖燥濕廣谷大川異制民生其間者異俗剛柔輕重遲速異齊五味異和器械異制衣服異宜修其教不易其俗齊其政不易其宜居謂儲積以備用如懋遷有無化居之居材者夫人日用所須之物如天生五材之材天地之氣東南多暖西北多寒地勢高者必燥卑者必濕因其地之所宜而為之備如氊裘可以備寒絺綌可以備暑車以行陸舟以行水此皆因天地所宜也廣谷大川自天地初分其形制已不同矣民生異俗理有固然其情性之緩急亦氣之所稟殊也飲食器械衣服之有異聖王亦豈必強之使同哉惟修其三綱五典之教齊其禮樂刑政之用而已所謂財成輔相以左右民也異齊齊去聲和去聲強上聲左右音佐佑中國戎夷五方之民皆有性也不可推移馮氏曰五方之民以氣稟之不齊兼習俗之異尚是以其性各隨氣稟之昏明習俗之薄厚而不可推移焉若論其本然之性則一而已矣鄭氏亦曰地氣使之然東方曰夷被髮文身有不火食者矣南方曰蠻雕題交趾有不火食者矣西方曰戎被髮衣皮有不粒食者矣北方曰狄衣羽毛穴居有不粒食者矣雕刻也題額也刻其額以丹青涅之交趾足拇指相向也東南地氣暖故有不火食者西北地寒少五穀故有不粒食者衣去聲中國夷蠻戎狄皆有安居和味宜服利用備器俗雖不同亦皆隨地以資其生無不足也和去聲五方之民言語不通嗜欲不同達其志通其欲東方曰寄南方曰象西方曰狄鞮北方曰譯方氏曰以言語之不通也則必達其志以嗜欲之不同也則必通其欲必欲達其志通其欲非寄象鞮譯則不可故先王設官以掌之寄言能寓風俗之異於此象言能倣象風俗之異於彼鞮則欲別其服飾之異譯則欲辨其言語之異周官通謂之象胥而世俗則通謂之譯也劉氏曰此四者皆主通逺人言語之官寄者寓也以其言之難通如寄託其意於事物而後能通之象像也如以意倣像其形似而通之周官象胥是也狄猶逖也鞮戌狄屨名猶履也逺履其事而知其言意之所在而通之周官鞮屨氏亦以通其聲歌而以舞者所履為名譯釋也猶言謄也謂以彼此言語相謄釋而通之也越裳氏重九譯而朝是也平鞮音低別必列切重聲凡居民量地以制邑度地以居民地邑民居必參相得也九夫為井四井為邑田有常制民有定居則無偏而不舉之弊地也邑也居也三者既相得則由小以推之大而通天下皆相得矣此所謂井田之良法也度待洛反無曠土無遊民食節事時民咸安其居樂事勸功尊君親上然後興學劉氏曰富而後教理勢當然若救死恐不贍則必疾視其上而欲與偕亡矣雖欲興學其可得乎此篇自分田制祿命官論材朝聘巡守行賞罰設國學為田漁制國用廣儲蓄修葬祭定賦役安邇人來逺人使中國五方各得其所而養生喪死無憾是王道之始也至此則君道既得而民德當新然後立鄉學以教民而興其賢能下文司徒修六禮以下至庶人耆老不徒食皆化民成俗之事是王道之成也後段自方一里者為田九百畝以下至篇終是王制傳文樂音洛論守傳並去聲司徒修六禮以節民性明七教以興民德齊八政以防淫一道德以同俗養耆老以致孝恤孤獨以逮不足上賢以崇德簡不肖以絀惡此鄉學教民取士之法而大司徒則總其政令者也六禮七教八政見篇末皆道德之用也道德則其體也體既一則俗無不同矣命鄉簡不帥教者以告耆老皆朝于庠元日習射上功習鄉上齒大司徒帥國之俊士與執事焉此下言簡不肖以絀惡之事鄉畿內六鄉也在逺郊之內每鄉萬二千五百家庠則鄉之學也耆老鄉中致仕之卿大夫也元日所擇之善日也期日定則耆老皆來會聚於是行射禮與鄉飲酒之禮射以中為上故曰上功鄉飲則序年之高下故曰上齒大司徒教官之長也率其俊秀者與執禮事蓋欲使不帥教之人得於觀感而改過以從善也帥入聲朝音潮與去聲中去聲長上聲不變命國之右鄉簡不帥教者移之左命國之左鄉簡不帥教者移之右如初禮左右對移以易其藏修遊息之所新其師友講切之方庶幾其變也不變移之郊如初禮不變移之遂如初禮不變屏之逺方終身不齒四郊去國百里在鄉界之外遂又在逺郊之外蓋示之以漸逺之意也四次示之以禮教而猶不悛焉則其人終不可與入德矣於是乃屏棄之屏音丙命鄉論秀士升之司徒曰選士司徒論選士之秀者而升之學曰俊士此言上賢崇德之事大劉氏曰論者述其德藝而保舉之也苗之穎出曰秀司徒命鄉大夫論述鄉學之士才德穎出於同輩者而禮賔之升其人於司徒司徒考試之量才而用之為鄉遂之吏曰選士選者擇而用之也其有才德又頴出於選士不安於小成而願升國學者司徒論述其美而舉升之於國學曰俊士俊者才過千人之名也論選並去聲升於司徒者不征於鄉升於學者不征於司徒曰造士既升於司徒則免鄉之徭役而猶給徭役於司徒也及升國學則并免司徒之役矣造者成也言成就其才德也并去聲樂正崇四術立四教順先王詩書禮樂以造士春秋教以禮樂冬夏教以詩書此以下言國學教國子民俊及取賢才之法樂正掌其教司馬則掌選法也術者道路之名言詩書禮樂四者之教乃入德之路故言術也文王世子言春誦夏絃與此不同者古人之教雖曰四時各有所習其實亦未必截然棄彼而習此恐亦互言耳非春秋不可教詩書冬夏不可教禮樂也舊注隂陽之説似為拘泥泥去聲王大子王子羣后之大子卿大夫元士之適子國之俊選皆造焉凡入學以齒皆造皆來受教于樂正也惟次長幼之序不分貴賤之等大音泰適音的造七到切將出學小胥大胥小樂正簡不帥教者以告于大樂正大樂正以告于王王命三公九卿大夫元士皆入學不變王親視學不變王三日不舉屏之逺方西方曰棘東方曰寄終身不齒古之教者九年而大成出學九年之期也小胥大胥皆樂官之屬鄭注以棘為僰又以僰訓逼僰本西戎地名愚謂不若讀如本字急也欲其遷善之速也寄者寓也暫寓而終歸之意蓋雖屏之終身不齒然猶為此名以示不忍終棄之意蓋國子皆世族之親與庶人疏賤者異故親親而有望焉方氏曰賤者至於四不變然後屏之貴者止於二不變遂屏之者陳氏謂先王以衆庶之家為易治世祿之家為難化以其易治也故鄉遂之所考常在三年大比之時以其難化也故國子之出學常在九年大成之後以三年之近而考焉故必四不變而後屛之以九年之逺而簡焉則雖二不變屏之可也疏曰周立四代之學於國而以有虞氏之庠為鄉學僰步黑切音同匐大樂正論造士之秀者以告于王而升諸司馬曰進士疏曰司馬掌爵祿但入仕者皆司馬主之司馬辨論官材論進士之賢者以告于王而定其論論定然後官之任官然後爵之位定然後祿之劉氏曰古者鄉學教庶人國學教國子及庶人之俊而其仕進有二道鄉學秀者之升曰選士國學秀者之升曰進士其選士者不過用為鄉遂之吏而選用之權在司徒也其進士則必命為朝廷之官而爵祿之定其權皆在大司馬此鄉學國學教選之異所以為世家編户之别然庶人仕進亦是二道可為選士者司徒試用之此其一也司徒升之國學則論選之法與國子弟同矣此其二也任音壬別必列切大夫廢其事終身不仕死以士禮葬之廢其事如戰陳無勇而敗國殄民或荒淫失行而悖常亂俗生則擯棄死則貶降有發則命大司徒教士以車甲發師旅之役也辨方氏曰先王設官未嘗不亦未嘗不通司徒掌教司馬掌政是分職而辨之也有發則司徒教士以車甲造士則司馬辨論官材是聯事而通之也凡執技論力適四方裸股肱決射御射御之技四方惟所之然但論力之優劣而已所以擐衣而出其股肱者欲以決勝負而示武勇也論去聲裸力果切凡執技以事上者祝史射御醫卜及百工凡執技以事上者不二事不移官出鄉不與士齒仕於家者出鄉不與士齒不二事則所業彌至於精不移官恐他職非其所長以技名者賤為大夫之臣赤賤故不得與為士者齒列然必出鄉乃爾者於其本鄉有族人親戚之為士者或不忍卑之故也司冦正刑明辟以聽獄訟必三刺有旨無簡不聽附從輕赦從重周禮以三刺斷庶民獄訟之中一曰訊羣臣二曰訊羣吏三曰訊萬民刺殺也有罪當殺者先問之羣臣次問之羣吏又問之庶民然後決其輕重也若有發露之旨意而無簡核之實迹則難於聽斷矣於是有附有赦焉附而入之則施刑從輕赦而出之則宥罪從重所謂與其殺不辜寧失不經也辟婢亦切刺音次斷丁亂切凡制五刑必即天論郵罰麗於事制斷也天倫天理也天之理至公而無私斷獄者體而用之亦至公而無私郵與尤同責也凡有罪責而當誅罰者必使罰與事相附麗則至公無私而刑當其罪矣論倫同刑當當去聲凡聽五刑之訟必原父子之親立君臣之義以權之意論輕重之序慎測淺深之量以別之悉其聰明致其忠愛以盡之疑獄泛與衆共之衆疑赦之必察小大之比以成之父為子隱子為父隱而直在其中者以其有父子之親也刑亂國用重典以其無君臣之義也推類可以通其餘顧所以權之何如耳父子君臣人倫之重者故特舉以言之亦承上文天倫之意所犯雖同而有輕重淺深之殊者不可槩議也故別之所謂權也明視聰聽而察之於詞色之間忠愛惻怛而體之於言意之表庶可以盡得其情也泛猶廣也其或在所可疑則泛然而廣詢之衆見焉衆人共謂可疑則宥之矣比猶例也小者有小罪之比大者有大罪之比察而成之無往非公也論量並去聲別必列切比音俾成獄辭史以獄成告於正正聽之正以獄成告于大司寇大司寇聽之棘木之下大司寇以獄之成告於王王命三公參聽之三公以獄之成告於王王三又然後制刑成獄詞者謂治獄者責取犯者之言辭已成定也史掌文書者正士師之屬聽察也棘木外朝之卿位也又當作宥周禮一宥曰不識再宥曰過失三宥曰遺忘謂行刑之時天子猶欲以此三者免其罪也自下而上咸無異説而天子猶必三宥而後有司行刑者在君為愛下之仁在臣有守法之義也凡作刑罰輕無赦馮氏曰此言立法制刑之意雖輕無赦所以使人難犯也惟其當刑必刑輕且不赦而况於重者乎故君子不容不盡心焉刑者侀也侀者成也一成而不可變故君子盡心焉疏曰侀是形體也馬氏曰刑之所以為刑者猶人之有侀一辭不具不足以為刑一體不備不足以為成人辭之所成則刑有所加而不可變故君子盡心焉君子無所不盡其心至於用刑則尤慎焉者也侀音刑析言破律亂名改作執左道以亂政殺剖析言辭破壞法律所謂舞文弄法者也變亂名物更改制度或挾異端邪道以罔惑于人皆足以亂政故在所當殺作淫聲異服竒技奇器以疑衆殺行偽而堅言偽而辨學非而博順非而澤以疑衆殺假於鬼神時日卜筮以疑衆殺此四誅者不以聽淫聲非先王之樂也異服非先王之服也奇技奇器如偃師舞木之類書云紂作奇技淫巧以悅婦人所行雖偽而堅不可攻所言雖偽而辨不可屈如白馬非馬之類所學雖非正道而涉獵甚廣則亦難於窮詰順非文過也所行雖非而善於文飾其言滑澤無滯衆皆疑其為是也至於假託鬼神之禍福時日之吉凶卜筮之休咎皆足以使人惑於見聞而違悖禮法故亂政者一疑衆者三皆決然殺之不復審聽亦為其害大而辭不可明也凡執禁以齊衆不赦過立法有典司刑有官雖過失不赦所以齊衆人之不齊也若先示之以赦過之令則人將輕於犯禁矣豈能齊之乎有圭璧金璋不粥於市命服命車不粥於市宗廟之器不粥於市犧牲不粥於市戎器不粥於市方氏曰此所以禁民之不敬金璋以金飾之考工記大璋中璋黃金勺青金外者見矣用器不中度不粥於市兵車不中度不粥於市布帛精粗不中數幅廣狹不中量不粥於市姦色亂正色不粥於市此所以禁民之不法用器人生日用之器也數升縷多寡之數也布幅廣二尺二寸帛廣二尺四寸中去聲錦文珠玉成器不粥於市衣服飲食不粥於市此所以禁民之不儉五穀不時果實未熟不粥於市木不中伐不粥於市禽獸魚鱉不中殺不粥於市此所以禁民之不仁凡十有四事皆所以齊其衆而使風俗之同也關執禁以譏禁異服識異言劉氏曰凡上文所當禁戒之事雖有司刑司市之屬以治之然不有以譏察之則犯者衆而獲者寡矣故令司關者執禁戒之令以譏察之見異服則禁之聞異言則識之衣服易見故直曰禁言語難知故必曰識關境上門舉關則郊門城門亦在其中矣司徒之屬有司門司關者皆其職之大略也大史典禮執簡記奉諱惡天子齊戒受諫周官大史典歷代禮儀之籍國有禮事則豫執簡策記載所當行之禮儀及所當知之諱惡如廟諱忌日之類奉而進之天子天子重其事故齊戒以受其所教詔諫猶教詔也不言大宗伯者體貌尊惟詔相大禮於臨時耳大音泰惡去聲齊音齋相去聲司會以嵗之成質於天子冢宰齊戒受質司會冢宰之屬掌治法之財用會計及王與冢宰廢置等事故嵗之將終也質平其一嵗之計要於天子而先之冢宰冢宰重其事而齊戒以受其質質者質於上而考正其當否也會古外切齊音齋當去聲大樂正大司寇市三官以其成從質於天子大司徒大司馬大司空齊戒受質市司市也周官司市下大夫二人司會所質冢宰既受之矣此三官各以其計要之成從司會而質於天子則司徒司馬司空亦齊戒而受之百官各以其成質於三官大司徒大司馬大司空以百官之成質於天子百官齊戒受質然後休老勞農成嵗事制國用百官位卑不敢専達故但質於三官三官達於司徒司馬司空而為之質於天子天子與六卿受而平斷畢則還報其平於下故百官齊戒以受上之平報焉君臣上下莫不齊戒以致其敬者以天功天職不敢忽也六官獨不言大宗伯者宗伯禮樂事行則天子六卿皆在無可嵗會者惟大樂正教國子及一嵗禮樂之費用當質正之耳然雖不言宗伯而先言大史典禮於前則其尊重禮樂之意可見矣以上並劉氏説石梁王氏曰大史典禮以下至制國用此一節與周制異與夏殷無考勞去聲為去聲凡養老養老之禮其目有四養三老五更一也子孫死於國事則養其父祖二也養致仕之老三也養庶人之老四也一嵗之間凡七行之飲養陽氣則用春夏食養陰氣則用秋冬四時各一也凡大合樂必遂養老謂春入學舍菜合舞秋頒學合聲則通前為六又季春大合樂天子視學亦養老凡七也更平聲有虞氏以燕禮燕禮者一獻之禮既畢皆坐而飲酒以至於醉其牲用狗其禮亦有二一是燕同姓二是燕異姓也夏后氏以饗禮饗禮者體薦而不食爵盈而不飲立而不坐依尊卑為獻數畢而止然亦有四焉諸侯來朝一也王親戚及諸侯之臣來聘二也戎狄之君使來三也享宿衛及耆老孤子四也惟宿衛及耆老孤子則以酒醉為度酒正云使去聲殷人以食禮食禮者有飯有殽雖設酒而不飲其禮以飯為主故曰食也然亦有二焉大行人云食禮九舉及公食大夫之類謂之禮食其臣下自與賔客旦夕共食則謂之燕食也饗食禮之正故行之於廟燕以示慈惠故行之於寢也字食音嗣禮食共食燕食如周人修而兼用之春夏則則用虞之燕夏之饗秋冬則用殷之食周尚文故兼用三代之禮也五十養於鄉六十養於國七十養於學達於諸侯鄉鄉學也國國中小學也學大學也達於諸侯者天子養老之禮諸侯通得行之無降殺也八十拜君命一坐再至瞽亦如之九十使人受人君有命人臣拜受禮也惟八十之老與無目之人為難備禮故其拜也足一跪而首再至地以備再拜之數九十則又不必親拜特使又代受此言君致享食之禮於其家而受之之禮如此然他命則亦必然矣五十異粻六十宿肉七十二膳八十常珍九十飲食不離寢膳飲從於逰可也粻糧也異者精粗與少者殊也宿肉謂恆隔日備之不使求而不得也膳食之善者每有副二不使闕乏也常珍常食皆珍味也不離寢言寢處之所恆有庋閣之飲食也美善之膳水漿之飲隨其常遊之處而為之備具可也粻音張離去聲庋音几又音詭六十嵗制七十時制八十月制九十日修唯絞襟衾冒死而后制此言漸老則漸近死期當豫為送終之備也嵗制謂棺也不易可成故嵗制衣物之難得者須三月可辦故云時制衣物之易得者則一月可就故云月制至九十則棺衣皆具無事於制作但每日修理之恐或有不完整也絞所以收束衣服為堅急者也襟單被也絞與襟皆用十五升布為之凡衾皆五幅士小斂緇衾赬裏大斂則二衾冒所以韜尸制如直囊上曰質下曰殺其用之先以殺韜足而上次以質韜首而下齊于手士緇冒赬殺象生時玄衣纁裳也此四物須死乃制以其易成故也絞音爻襟其鴆切殺去聲五十始衰六十非肉不飽七十非帛不暖八十非人不暖九十雖得人不暖矣五十杖於家六十杖於鄉七十杖於國八十杖於朝九十者天子欲有問焉則就其室以珍從杖所以扶衰弱五十始衰故杖未五十者不得執也巡守而就見百年者泛言衆庶之老也此就見九十者專指有爵者也祭義又言八十君問則就之者亦異禮也珍與常珍之珍同從之以往致尊養之義也從去聲守去聲七十不俟朝八十月告存九十日有秩不俟朝者謂朝君之時入至朝位君出揖即退不待朝事畢也此謂當致仕之年而不得謝者告猶問也君每月使人致膳告問存否也秩常也日使人以常膳致之也五十不從力政六十不與服戎七十不與賔客之事八十齊喪之事弗及也方氏曰力政力役之政也服戎兵戎之事也力政事之常者故五十已不從矣服戎則事之變者必六十然後不與焉從謂行其事也與則與之而已及則旁有所加之謂以其老甚非特不能從與於事而事固不當及於我矣與去聲齊音齋五十而爵六十不親學七十致政唯衰麻為喪五十而爵命為大夫也不親學以其不能備弟子之禮也致政事以其不能勝職任之勞也或有死喪之事惟備衰麻之服而已其他禮節皆在所不責也衰音催勝平聲有虞氏養國老於上庠養庶老於下庠行養老之禮必於學以其為講明孝弟禮義之所也國老有爵有德之老庶老庶人及死事者之父祖也國老尊故於大學庶老卑故於小學上庠大學在西郊下庠小學在國中王宮之東弟去聲夏后氏養國老於東序養庶老於西序東序大學在國中王宮之東西序小學在西郊殷人養國老於右學養庶老於左學右學大學在西郊左學小學在國中王宫之東周人養國老於東膠養庶老於虞庠虞庠在國之西郊東膠大學在國中王宮之東虞庠小學在西郊有虞氏皇而祭深衣而養老皇收冔皆冠冕之名然制度詳悉則不可考矣深衣白布衣也夏后氏收而祭燕衣而養老燕衣黑衣也夏后氏尚黑君與羣臣燕飲之服即諸侯日視朝之服也其冠則玄冠而緇帶素韠白舄也殷人冔而祭縞衣而養老縞生絹亦名素此縞衣則謂白布深衣也切冔火羽周人冕而祭玄衣而養老玄衣亦朝服也緇衣素裳十五升布為之六入為玄七入為緇故緇衣亦名玄衣也又按夏后氏尚黑衣裳皆黑殷尚白則衣裳皆尚白周兼用之故玄衣而素裳凡諸侯朝服即天也子燕服而諸侯之行燕禮亦此服凡三王養老皆引年四海之內老者衆矣安得人人而養之待國老庶老之禮畢即行引户校年之令而恩賜其老者焉八十者一子不從政九十者其家不從政廢疾非人不養者一人不從政父母之喪三年不從政齊衰大功之喪三月不從政將徙於諸侯三月不從政自諸侯來徙家期不從政從政謂給公家之力役也於方氏曰將徙欲去者來徙已來者夫人莫衰老莫苦於疾莫憂於喪莫勞於徙此王政之所宜恤者故皆不使之從政焉舊説將徙於諸侯者謂大夫采地之民徙於諸侯為民自諸侯來徙者謂諸侯之民來徙於大夫之邑以其新徙當復除諸侯地寬役少故惟三月不從政大夫役多地狹欲令人貪慕故期不從政一説謂從大夫家出仕諸侯從諸侯退仕大夫未知孰是采去聲令平聲少而無父者謂之孤老而無子者謂之獨老而無妻者謂之矜老而無夫者謂之寡此四者天民之窮而無告者也皆有常餼左傳崔杼生成及強而寡是無妻者亦可言寡也皆有常餼謂君上養以餼廩有常制也少去聲矜音鰥瘖聾跛躃斷者侏儒百工各以其器食之瘖者不能言聾者不能聽跛者一足廢躃者兩足俱廢斷者支節脫絶侏儒身體短小者也百工衆雜技藝也器猶能也此六類者因其各有技藝之能足以供官之役使故遂因其能而以廩給食養之疏引國語戚施植鎛等六者為證食瘖音音跛彼我切躃音璧斷音段音嗣道路男子由右婦人由左車從中央凡男子婦人同出一塗者則男子常由婦人之右婦人常由男子之左為逺別也父之齒隨行兄之齒鴈行朋友不相踰父之齒兄之齒謂其人年與父等或與兄等也隨行隨其後也鴈行並行而稍後也朋友年相若則彼此不可相踰越而有先後言並行而齊也輕任並重任分斑白者不提挈並已獨任之也分析而二之也去並聲君子耆老不徒行庶人耆老不徒食方氏曰徒行謂無乘而行也徒食謂無羞而食也行應氏曰非人皆好德而士不失職安能使在路無徒之賢非人各有養而俗尚孝敬安能使在家無徒食之老方一里者為田九百畝步百為畝是長一百步闊一步畝百為夫是一頃長闊一百步夫三為屋是三頃闊三百步長一百步屋三為井則九百畝也長闊一里孟子曰方里而井井九百畝方十里者為方一里者百為田九萬畝方百里者為方十里者百為田九十億畝一箇十里之方既為田九萬畝則十箇十里之方為田九十萬畝一百箇十里之方為田九百萬畝今云九十億畝是一億有十萬十億有一百萬九十億乃九百萬畝也方千里者為方百里者百為田九萬億畝計千里之方為方百里者百一箇百里之方既為九十億畝則十箇百里之方為九百億畝百箇百里之方為九千億畝今乃云九萬億畝與數不同者若以億言之當云九千億畝若以萬言之當云九萬萬畝經文誤也及應氏曰自此至篇末皆覆解篇首中間井田封建地里之界自恆山至於南河千里而近自南河至於江千里而近自江至於衡山千里而遙自東河至於東海千里而遙自東河至於西河千里而近自西河至於流沙千里而遙西不盡流沙南不盡衡山東不盡東海北不盡恆山方氏曰不足謂之近有餘謂之遙應氏曰此獨言東海者東海在中國封疆之內而西南北則夷徼之外也南以江與衡山為限百越未盡開也河舉東西南北者河流縈帶周繞雖流沙分際亦與河接也自秦而上西北袤而東南蹙秦而下東南展而西北縮先王盛時四方各有不盡之地不勞中國以事外也禹貢東漸西被朔南咸暨特聲教所及非貢賦所限也茂分音問袤音漸平聲凡四海之內斷長補短方三千里為田八十萬億一萬億畝方百里者為田九十億畝山陵林麓川澤溝瀆城郭宮室塗巷三分去一其餘六十億畝為田八十萬億一萬億畝者以一州方千里九州方三千里三三為九為方千里者九一箇千里有九萬億畝九箇千里九九八十一故有八十一萬億畝於八十整數之下云萬億是八十箇萬億又云一萬億言八十箇萬億之外更有一萬億是共為八十一萬億畝先儒以萬億二字為衍非也此並疏義然愚按方百里為田九十億畝則方三千里當云八萬一千億畝如疏義亦承誤釋之也斷音短去上聲古者以周尺八尺為步今以周尺六尺四寸為步古者百畝當今東田百四十六畝三十步古者百里當今百二十一里六十步四尺二寸二分疏曰古者八寸為尺以周尺八尺為步則一步有六尺四寸今以周尺六尺四寸為步則一步有五十二寸是今步比古步每步剩出一十二寸以此計之則古者百畝當今東田百五十二畝七十一步有餘與此百四十六畝三十步不相應又今步每步剩古步十二寸以此計之則古之百里當今百二十三里一百一十五步二十寸與此百二十一里六十步四尺二寸二分又不相應經文錯亂不可用也尺愚按疏義所算亦誤當云古者八寸為尺以周尺八為步則一步有六尺四寸今以周尺六尺四寸為步則一步有五尺一寸二分是今步比古步每步剩出一尺二寸八分以此計之則古者百畝當今東田百五十六畝二十五步一寸六分十分寸之四與此百四十六畝三十步不相應里亦倣此推之方氏曰東田者即詩言南東其畝也言南則以廬在其北而向南言東則以廬在其西而向東嚴氏説南東其畝云或南其畝或東其畝順地勢及水之所趨也方千里者為方百里者百天下九州王畿居中外八州每州各方千里是一百箇百里以開方之法推之合萬里也封方百里者三十國其餘方百里者七十公侯皆方百里封三十箇百里剩七十箇百里又封方七十里者六十為方百里者二十九方十里者四十伯七十里封六十箇七十里是占二十九箇百里四十箇十里於三十箇百里內剩六十箇十里其餘方百里者四十方十里者六十又封方五十里者百二十為方百里者三十其餘方百里者十方十里者六十除上封二等國共占六十箇百里外止剩四十箇百里及六十箇十里於此地內封子男五十里之國者百二十箇每一百里封四箇實占三十箇百里通三等封止剩十箇百里六十箇十里伯國方七十里七七四十九是四十九箇十里十子男方五十里五五二十五是二五箇十里名山大澤不以封其餘以為附庸間田諸侯之有功者取於間田以祿之其有削地者歸之間田除名山大澤之外皆為附庸之國及間田間音間天子之縣內方千里者為方百里者百封方百里者九其餘方百里者九十一又封方七十里者二十一為方百里者十方十里者二十九其餘方百里者八十方十里者七十一又封方五十里者六十三為方百里者十五方十里者七十五其餘方百里者六十四方十里者九十六此倣上章畿外之法推之可見畿外封國多少而餘地少廣封建之制於天下也畿內封國而餘地多備采邑之分於王朝也采分並去聲諸侯之下士祿食九人中士食十八人上士食三十六人下大夫食七十二人卿食二百八十八人君食二千八百八十人此言大國之數次國之卿食二百一十六人君食二千一百六十人次國大夫亦食七十二人卿三大夫祿故食二百一十六人小國之卿食百四十四人君食千四百四十人小國大夫亦食七十二人卿倍大夫祿故食百四十四人次國之卿命於其君者如小國之卿降於天子所命也天子之大夫為三監監於諸侯之國者其祿視諸侯之卿其爵視次國之君其祿取之於方伯之地祿視諸侯之卿可食二百八十八人者也上監如字下監平聲方伯為朝天子皆有湯沐之邑於天子之縣內視元士謂之湯沐者言入至畿內即暫止頓於此齊潔而往也春秋傳謂之朝宿之邑惟方伯有之其餘否許慎云周千八百諸侯若皆有之則盡京師地亦不能容為去聲諸侯世子世國大夫不世爵使以德爵以功未賜爵視天子之元士以君其國諸侯之大夫不世爵祿世子世國畿外之制也天子大夫不世爵而世祿先王使人爵人必取其有德有功者列國之君薨其子未得爵賜則其衣服禮數視天子之元士賜爵而後得如先君之舊也諸侯之大夫不世爵祿而有大功德者亦世之左傳言官有世功則有官族六禮冠昏喪祭鄉相見今所存者士冠士昏士喪特牲少牢饋食鄉飲酒士相見冠去聲少去聲七教父子兄弟夫婦君臣長幼朋友賔客八政飲食衣服事為異別度量數制六禮七教八政皆司徒所掌禮節民性教興民德修則不壞明則不渝然非齊八政以防淫則亦禮教之害也事為者百工之技藝有正有邪異別者五方之械器有同有異度量則不使有長短小大之殊數制則不使有多寡廣狹之異若夫飲食衣服尤民生日用之不可闕者所以居八政之首齊之則不使有僣擬詭異之端矣此篇先儒謂雜舉歷代之典雖一一分別而不能皆有明證又且多祖緯書豈可謂決然無疑哉朱子有言漢儒説制度有不合者多推從殷禮去此亦疑其無徴矣然只據大綱而言興學以上修六禮以下其坦明者亦可為後王之法也長上聲別必列切量去聲月令第六呂不韋集諸儒著十二月紀名曰呂氏春秋篇首皆有月令言十二月政令所行也月用夏正令則雜舉三代及秦事禮家記事者抄合為此篇孟春之月日在營室昏參中旦尾中孟春夏正建寅之月也營室在亥娵訾之次也昏時參星在南方之中旦則尾星在南方之中疏曰月令昏明中星皆大略而言不與厯同但一月之內有中者即得載之二十八宿星體有廣狹相去有逺近或月節月中之日昏明之時前星已過於午後星未至正南又星有明暗見有早晚所以昏明之星不可正依厯法但舉大略耳參如字俗讀森過平聲見音現其日甲乙春於四時屬木日之所繫十干循環獨言甲乙者木之屬也四時皆然其帝太皥其神句芒太皥伏羲木德之君句芒少皥氏之子曰重木官之臣聖神繼天立極生有功德於民故後王於春祀之四時之帝與神皆此義句芒音勾亡少去聲重平聲其蟲鱗其音角律中太蔟其數八其味酸其臭羶其祀户祭先脾鱗蟲木之屬五聲角為木單出曰聲雜比曰音調樂於春以角為主也律者候氣之管以銅為之或云竹為之中猶應也太蔟寅律長八寸陰陽之氣距地面各有淺深故律之長短如其數律管入地以葭灰實其端其月氣至則灰飛而管通是氣之應也天三生木地八成之其數八成數也通於鼻者謂之臭臭即氣也在口者謂之味酸羶皆木之屬户者人所出入司之有神此神是陽氣在户之內春陽氣出故祀之祭先脾者木克土也蔡雍獨斷曰户春為少陽其氣始出生養祀之於户祀户之禮南面設主於門內之西中去聲篇內並同蔟七寇切比音畀應去聲斷丁玩切少去聲東風解凍蟄蟲始振魚上冰獺祭魚鴻鴈來此記寅月之候振動也來自南而北也上上聲天子居青陽左個青陽左個注云太寢東堂北偏也疏云是明堂北偏而云太寢者明堂與太廟太寢制同北偏者近北也四面旁室謂之個制朱子曰論明堂之制者非一竊意當有九室如井田之東之中為青陽太廟東之南為青陽右個東之北為青陽左個南之中為明堂太廟南之東即東之南為明堂左個南之西即西之南為明堂右個西之中為總章太廟西之南即南之西為總章左個西之北即北之西為總章右個北之中為玄堂太廟北之東即東之北為玄堂右個北之西即西之北為玄堂左個中為太廟太室凡四方之太廟異方所其左右個則青陽左個即玄堂之右個青陽右個即明堂之左個明堂右個即總章之左個總章之右個乃玄堂之左個也但隨其時之方位開門耳太廟太室則每季十八日天子居正歟古人制事多用井田遺意此恐然也乘鸞路駕倉龍載青旗衣青衣服倉玉食麥與羊其器疏以達鸞路有虞氏之車有鸞鈴也春言鸞則夏秋冬皆鸞也夏云朱冬云玄則春青秋白可知倉與蒼同馬八尺以上為龍服玉冠冕之飾及佩也麥以金王而生火王而死當屬金而鄭云屬木兌為羊當屬金而鄭云火畜皆不可曉疏云鄭本五行傳言之然陰陽多塗不可一定故今於四時所食及彘嘗麥雛嘗黍之類皆略之以俟知者疏以達者春物將貫土而出故器之刻鏤者使文理粗疏直而通達也載音戴上衣去聲下衣如字篇內並同王去聲是月也以立春先立春三日太史謁之天子曰某日立春盛德在木天子乃齊立春之日天子親帥三公九卿諸侯大夫以迎春於東郊還反賞公卿大夫於朝命相布德和令行慶施惠下及兆民慶賜遂行毋有不當謁告也春為生天地生育之盛德在於木位也迎春東郊祭太皥句芒也後倣此推之疏曰節氣有早晚是月者謂是月之氣不謂是月之日也去先去聲齊音齋帥入聲篇內並同還音旋相去聲當聲乃命太史守典奉法司天日月星辰之行宿離不貸毋失經紀以初為常宿猶止也離猶行也言占候躔次不可差貸貸與忒同經紀者天文進退遲速之度數也初者厯家推步之舊法以此為占候之常也離去聲貸音忒後又音二二音通用是月也天子乃以元日祈穀于上帝乃擇元辰天子親載耒耜措之于參保介之御間帥三公九卿諸侯大夫躬耕帝籍天子三推三公五推卿諸侯九推反執爵于太寢三公九卿諸侯大夫皆御命曰勞酒元日上辛也郊祭天而配以后稷為祈穀也元辰郊後吉日也日以干言辰以支言互文也參參乘之人也保介衣甲也以勇士為車右而衣甲御者御車之人也車右及御人皆是參乘天子在左御者居中車右在右以三人故曰參也置此耕器於參乘保介及御者之間天子藉田千畝收其穀為祭祀之粢盛故曰帝籍九推之後庶人終之反而行燕禮羣臣皆侍士賤不與耕故亦不與勞酒之賜也盛帥入聲推吐回切勞去聲為祈為去聲乘衣並去聲平聲與去聲是月也天氣下降地氣上騰天地和同草木萌動王命布農事命田舍東郊皆修封疆審端徑術善相丘陵阪險原隰土地所宜五穀所殖以教道民必躬親之田事既飭先定準直農乃不惑田田畯也舍居也天子命田畯居東郊以督耕者皆使修理其封疆謂井田之限域也步道曰徑術與遂同田之溝洫也審而端之使無迂壅封疆有界限徑術有闊狹土地有高下五種有宜否皆須田畯躬親教飭之以定其準直則農民無所疑惑也上上聲術音遂相去聲阪音反隰音習道去聲畯音俊種上聲是月也命樂正入學習舞教學者以習舞之事乃修祭典命祀山林川澤犧牲毋用牝不欲傷其生育禁止伐木以盛德在木也毋覆巢毋殺孩蟲胎夭飛鳥毋麛毋卵毋聚大衆毋置城郭掩骼埋胔孩蟲蟲之稚者胎未生者夭方生者飛鳥初學飛之鳥麛獸子之通稱胔骨之尚有肉者夭烏老切骼音格胔音漬是月也不可以稱兵稱兵必天殃兵戎不起不可從我始毋變天之道毋絶地之理毋亂人之紀天地大德曰生春者生德之盛時也兵凶器戰危事不得已而禦冦猶可也兵自我起以殺戮之心逆生育之氣是變易天之生道斷絶地之生理而紊亂生人之紀敘矣其殃也宜哉斷上聲孟春行夏令則雨水不時草木蚤落國時有恐此已火之氣所泄也言人君於孟春之月而行孟夏之政令則感召咎證如此後皆倣此疏曰孟月失令則三時孟月之氣乘之仲月失令則仲月之氣乘之季月失令則季月之氣乘之所以然者以同為孟仲季氣情相通如其不和則迭相乘之行秋令謂孟秋之令則其民大疫猋風暴雨總至藜莠蓬蒿並興此申金之氣所傷也爾雅扶搖謂之猋風謂風之回轉也藜莠蓬蒿並興者以生氣逆亂故惡物乘之而茂也猋音標莠音有行冬令謂孟冬之令則水潦為敗雪霜大摯首種不入此亥水之氣所淫也摯傷折也與摯獸摯蟲之義同百穀惟稷先種故云首種摯音至種上聲仲春之月日在奎昏弧中旦建星中奎宿在戌降婁之次建疏曰餘月昏旦中星皆舉二十八宿此云弧與星者以弧星近井建星近斗井斗度多星體廣不可的指故舉弧建以定昏旦之中其日甲乙其帝太皥其神句芒其蟲鱗其音角律中夾鍾其數八其味酸其臭羶其祀户祭先脾夾鍾卯律長七寸二千一百八十七分寸之千七十五始雨水桃始華倉庚鳴鷹化為鳩此記卯月之候倉庚鸝黃也鳩布穀也王制言鳩化為鷹秋時也此言鷹化為鳩以生育氣盛故鷙鳥感之而變耳孔氏云化者反歸舊形之謂故鷹化為鳩鳩復化為鷹如田鼠化為鴽則鴽又化為田鼠若腐草為螢雉為蜃爵為蛤皆不言化是不再復本形者也天子居青陽太廟乘鸞路駕倉龍載青旗衣青衣服倉玉食麥與羊其器疏以達青陽太廟東堂當太室是月也安萌芽養幼少存諸孤生氣之可見者莫先於草木故首言之安謂無所摧折之也存亦安也擇元日命民社令民祭社也郊特牲言祭社用甲日此言擇元日是又擇甲日之善者歟召誥社用戊日命有司省囹圄去桎梏毋肆掠止獄訟囹牢也圄止也疏云周曰圜土殷曰羑里夏曰鈞臺囹圄泰獄名也在手曰梏在足曰桎皆木械肆陳尸也掠捶治也止謂諭使息爭也省息井切囹圄音零語掠音亮是月也玄鳥至至之日以太牢祠于高禖天子親往后妃帥九嬪御乃禮天子所御帶以弓韣授以弓矢于高禖之前玄鳥燕也燕以施生時巢人堂宇而生乳故以其至為祠禖祈嗣之候高禖先媒之神也高者尊之之稱變媒言禖神之也古有禖氏祓除之祀位在南郊禋祀上帝則亦配祭之故又謂之郊禖詩天命玄鳥降而生商但謂簡狄以玄鳥至之時祈于郊禖而生契故本其為天所命若自天而降下耳鄭注乃有墮卵吞孕之事與生民詩注所言薑嫄履巨迹而生棄之事皆怪妄不經削之可也后妃帥九嬪御者從往而侍奉禮事也禮天子所御者祭畢而酌酒以飲其先所御幸而有娠者顯之以神賜也韣弓衣也弓矢者男子之事也故以為祥禖音梅帥音率乳去聲飲去聲是月也日夜分盡夜各五十刻雷乃發聲始電蟄蟲咸動啓户始出謂始穿其穴而出也先雷三日以節氣言在春分前三日先去聲奮木鐸以令兆民曰雷將發聲有不戒其容止者生子不備必有凶災容止猶言動靜不戒容止謂房室之事褻瀆天威也生子不備謂形體有損缺凶災謂父母日夜分則同度量鈞衡石角斗甬正權概丈尺曰度斗斛曰量稱上曰衡百二十斤為石甬斛也權稱錘也概執以平量器者同則齊其長短小大之制鈞則平其輕重之差角則較其同異正則矯其欺枉是月也耕者少舍乃修闔扇寢廟畢備毋作大事以妨農之事少舍暫息也門户之蔽以木曰闔以竹葦曰扇凡廟前曰廟後曰寢寢是衣冠所藏之處大事謂軍旅之事是月也毋竭川澤毋漉陂池毋焚山林漉亦竭也三者之禁皆謂傷生意鹿漉音天子乃鮮羔開冰先薦寢廟古者日在虛則藏冰至此仲春則獻羔以祭司寒之神而開冰先薦寢廟者不敢以人之餘奉神也鮮音獻上丁此月上旬之丁日必用丁者以先庚三日後甲三日也命樂正習舞釋菜天子乃帥三公九卿諸侯大夫親往視之仲丁又命樂正入學習樂樂正樂官之長也習舞釋菜謂將教習舞者則先以釋菜之禮告先師也是月也祀不用犧牲用圭璧更皮幣不用牲謂祈禱小祀耳如大牢祀高禖乃大典禮不在此限稍重者用圭璧稍輕者則以皮幣更易之也泰更平聲大音仲春行秋令則其國大水寒氣總至寇戎來征酉金之氣所傷也行冬令則陽氣不勝麥乃不熟民多相掠子水之氣所淫也掠音亮行夏令則國乃大旱暖氣早來蟲螟為害午火之氣所泄也螟食苗心者季春之月日在胃昏七星中旦牽牛中胃宿在酉大梁之次也七星二十八宿之星宿也其日甲乙其帝太皥其神句芒其蟲鱗其音角律中姑洗其數八其味酸其臭羶其祀户祭先脾姑洗辰律長七寸九分寸之一洗蘇典切桐始華田鼠化為鴽虹始見萍始生此記辰月之候鴽鶉䳺之屬鴽音如見音現天子居青陽右個乘鸞路駕倉龍載青旗衣青衣服倉玉食麥與羊其器疏以達青陽右個東堂南偏是月也天子乃薦鞠衣于先帝鞠衣衣色如鞠花之黃也注云黃桑之服者色如鞠塵象桑葉始生之色也鞠字一音去六反先帝先代木德之君薦此衣于神坐以祈蠶事命舟牧覆舟五覆五反乃告舟備具于天子焉天子始乘舟薦鮪于寢廟乃為麥祈實舟牧主乘舟之官五覆五反所以詳視其罅漏傾側之處也因薦鮪并祈麥實鮪音偉為去聲是月也生氣方盛陽氣發泄句者畢出萌者盡達不可以內句屈生者萌直生者不可以內言當施散恩惠以順生道之宣泄不宜吝嗇閉藏也句音勾天子布德行惠命有司發倉廩賜貧窮振乏絶開府庫出幣帛周天下勉諸侯聘名士禮賢者長無謂之貧窮暫無謂之乏絶振猶救也周濟其不足也在內則命有司奉行在外則勉諸侯奉行皆天子之德惠也是月也命司空曰時雨將降下水上騰循行國邑周視原野修利隄防道達溝瀆開通道路毋有障塞司空掌邦土此皆其職也上上聲行去聲道去聲塞入聲田獵罝罘羅網畢翳餧獸之藥毋出九門罝罘皆捕獸之罟羅網皆捕鳥之罟小網長柄謂之畢以其似畢星之形故名用以掩兔也翳射者用以自隱也餧啖之也藥毒藥也七物皆不得施用於外以其逆生道也路門應門雉門庫門臯門城門近郊門逺郊門關門凡九門也音罝音嗟罘音浮翳曀餧音偽應去聲是月也命野虞毋伐桑柘鳴鳩拂其羽戴勝降于桑具曲植籧筐野虞主田及山林之官拂羽飛而翼拍身也戴勝織紝之鳥一名戴鵀鵀即頭上勝也此時恆在桑言降者重之若自天而下也曲薄也植槌也所以架曲與籧筐者籧圓而筐方切植音治籧音舉槌直類后妃齊戒親東鄉躬桑禁婦女毋觀省婦使以勸蠶事東鄉迎時氣也躬桑親自采桑也禁婦女毋觀者禁止婦女使不得為容觀之飾也省婦使者減省其針線縫製之事也此二者皆為勸勉之使盡力於蠶事也齊音齋鄉去聲觀去聲蠶事既登分繭稱絲效功以共郊廟之服毋有敢惰登成也分繭分布於衆婦之繅者稱絲效功以多寡為功之上下共音供是月也命工師令百工審五庫之量金鐵皮革筋角齒羽箭幹脂膠丹漆毋或不良工師百工之長也五庫者金鐵為一庫皮革筋為一庫角齒為一庫羽箭幹為一庫脂膠丹漆為一庫視諸物之善惡皆有舊法謂之量一説多寡之數也審而察之故云審五庫之量也幹者諸器所用之木材也量去聲百工咸理監工日號毋悖于時毋或作為淫巧以蕩上心此時百工皆各理治其造作之事工師監臨之每日號令必以二事為戒一是造作器物不得悖逆時序如為弓必春液角夏治筯秋合三材寒定體之類是也二是不得為淫過竒巧之器以搖動君心使生奢侈也監平聲是月之末擇吉日大合樂天子乃帥三公九卿諸侯大夫親往視之鄭氏曰其禮亡是月也乃合纍牛騰馬遊牝于牧犧牲駒犢舉書其數春陽既盛物皆産育故合其纍繫之牛騰躍之馬而逰縱之使牝者就牝者于芻牧之地欲其孳生之蕃也若其中犧牲之用者及馬之駒牛之犢皆書其數者以備稽校多寡也纍平聲中去聲命國難九門磔攘以畢春氣難之事在周官則方相氏掌之裂牲謂之磔除禍謂之攘春者隂氣之終故磔攘以終畢厲氣也舊説大陵八星在胃北主死喪昴中有大陵積尸之氣氣佚則厲鬼隨之而行此月初日在胃從胃歷昴故驅疫之事當于此時行之也九門説見上章難音那磔音責篇內並同季春行冬令則寒氣時發草木皆肅國有大恐丑土之氣所應也肅者枝葉減縮而急栗也大恐訛言相驚動也舊説孟春有恐是火訛以其行夏令也此行冬令當致水訛漢王商嘗止之矣行夏令則民多疾疫時雨不降山林不收未土之氣所應也行秋令則天多沈陰淫雨蚤降兵革並起戌土之氣所應也不收謂無所成遂也孟夏之月日在畢昏翼中旦婺女中畢宿在申實沈之次其日丙丁其帝炎帝炎帝大庭氏即神農也赤精之君其神祝融顓頊氏之子名黎火官之臣其蟲羽其音徵律中中呂其數七其味苦其臭焦其祀竈祭先肺羽蟲飛鳥之屬徵音屬火中呂已律長六寸萬九千六百八十三分寸之萬二千九百七十四地二生火天七成之七者火之成數也苦焦皆火屬夏祭竈火之養人者也祭先肺火克金也外蔡雍獨斷曰竈夏為太陽其氣長養祀竈之禮在廟門之東先席于門奧面東設主于竈陘也徵音止篇內並同上中仲音衆下中音螻蟈鳴蚯蚓出王瓜生苦菜秀此記巳月之候王瓜注云萆挈本草作菝葜音同謂之瓜者以根之似也亦可釀酒朱氏曰王瓜色赤盛火之色而生苦菜味苦感火之味而成切萆扶厯切菝步末天子居明堂左個太寢南堂東偏乘朱路駕赤駵載赤旗衣朱衣服赤玉食菽與雞其器高以粗駵馬名色淺者赤色深者朱用器高而粗大象物之盛長也駵音留衣音見孟冬是月也以立夏先立夏三日太史謁之天子曰某日立夏盛德在火天子乃齊立夏之日天子親帥三公九卿大夫以迎夏於南郊還反行賞封諸侯慶賜遂行無不欣説立春言諸侯大夫而此不言諸侯者或在或否不可必同故略之也迎夏南郊祭炎帝祝融也先去聲齊音齋還音旋説音悅乃命樂師習合禮樂以將飲酎故也命太尉贊桀俊遂賢良舉長大行爵出祿必當其位太尉秦官也桀俊以才言贊則引而升之之謂賢良以德言遂謂使之得行其志也長大以力言王制言執技論力舉謂選而用之也當其位者爵必當有德之位祿必當有功之位也當去聲是月也繼長增髙毋有壞墮毋起土功毋發大衆毋伐大樹長者繼之而使益長商者增之而使益高壞墮則傷已成之氣起土功發大衆皆妨蠶農之事故禁止之伐樹則傷條達之氣故亦在所禁一説伐大木謂營宮室壞音怪墮許規切是月也天子始絺絺葛布之細者命野虞出行田原為天子勞農勸民毋或失時火時謂失農時行為勞並去聲命司徒循行縣鄙命農勉作毋休于都勉其興作於田野之內禁其休息于都邑之間皆恐其失農時也聲行去是月也驅獸毋害五穀毋大田獵夏獵曰苗正為驅獸之害禾苗者耳與三時之大獵自不同農乃登麥天子乃以彘嘗麥先薦寢廟登升之於場也是月也聚畜百藥靡草死麥秋至聚藥為供醫事也靡草草之枝葉靡細者隂類陽盛則死秋者百穀成熟之期此於時雖夏於麥則秋故云麥秋也斷薄刑決小罪出輕繫刑者上之所施罪者下之所犯斷者定其輕重而施刑也決如決水之決謂人以小罪相告者即決遣之不收繫也其有輕罪而在繫者則直縱出之也斷丁玩切蠶事畢后妃獻繭乃收繭稅以桑為均貴賤長幼如一以給郊廟之服后妃獻繭謂后妃受內命婦之獻繭也收繭稅者外命婦養蠶亦用國北近郊之公桑近郊之稅十一故亦稅其繭十之一其餘入已而為其夫造祭服一説再命受服服者公家所給故稅其十一者為給其夫祭服也受桑多則稅繭多少則稅亦少皆以桑為均齊也貴謂卿大夫之妻賤謂士妻長幼婦之老少也如一皆稅十一也郊廟之服天子祭服也是月也天子飲酎用禮樂重釀之酒名之曰酎稠醲之義也春而造至此始成用禮樂而飲之蓋盛會也酎直又切重平聲孟夏行秋令則苦雨數來五穀不滋四鄙入保申金之氣所泄也數音朔行冬令則草木蚤枯後乃大水敗其城郭亥水之氣所傷也行春令則蝗蟲為災暴風來格秀草不實寅木之氣所淫也以孟夏之月而行孟秋孟冬孟春之令故盛召災異如此四鄙四面邊鄙之邑也保與堡同小城也入保入而依以為安也格至也仲夏之月日在東井昏亢中旦危中東井在未鶉首之次亢音剛其日丙丁其帝炎帝其神祝融其蟲羽其音徵律中蕤賔其數七其味苦其臭焦其祀竈祭先肺蕤賔午律長六寸八十一分寸之二十六小暑至螳蜋生鶪始鳴反舌無聲此記午月之候小暑暑氣未盛也螳蜋一名蚚父一名天馬言其飛捷如馬也鵙博勞也反舌百舌鳥凡物皆稟隂陽之氣而成質其陰類者宜隂時陽類者宜陽時得時則興背時則廢疏又以反舌為蝦蟇未知是否鶪古役切蚚巨衣切背音佩天子居明堂太廟乘朱路駕赤駵載赤旗衣朱衣服赤玉食菽與雞其器高以粗明堂太廟南堂當太室也養壯佼壯謂容體碩大者佼謂形容佼好者擇此類而養之亦順長養之令佼音絞是月也命樂師修鞀鞞鼓均琴瑟管簫執干戚戈羽調竽笙竾簧飭鍾磬柷敔凡十九物皆樂器也鞀鞞鼓三者皆革音鞀即鼗也鞞所以禆助鼓節琴瑟皆絲音管簫皆竹音管如笛而小干戚戈羽皆舞器干盾戚斧也竽笙竾皆竹音竽三十六簧笙十三簧竾即箎也長尺四寸簧笙之舌蓋管中之金薄鍱也竽笙竾三者皆有簧也鍾金音磬石音柷敔皆木音柷如漆桶敔狀如伏虎柷以合樂之始敔以節樂之終修者理其弊均者平其聲執者操持習學調者調和音曲飭者整治之也以將用盛樂雩祀故謹備之鞀音逃鞞駢迷切竾音池柷昌六切敔音語操治並平聲命有司為民祈祀山川百源大雩帝用盛樂山者水之源將欲禱雨故先祭其本源三王祭川先河後海示重夲也雩者吁嗟其聲以求雨之祭周禮女巫凡邦之大災歌哭而請亦其義也帝者天之主宰盛樂即鞀鞞以下十九物並奏之也為去聲乃命百縣雩祀百辟卿士有益於民者以祈穀實百縣畿內之邑也百辟卿士謂古者上公句龍后稷之類句音勾是月也農乃登黍天子乃以雛嘗黍羞以含桃先薦寢廟今用登麥穀例移農乃登黍四字在是月也之下舊注以內則之雛為小鳥此雛為雞未詳孰是含桃櫻桃也令民毋艾藍以染藍之色青青者赤之母刈之亦是傷時氣艾音刈毋燒灰火之滅者為灰禁之亦為傷火氣也毋暴布暴暴之於日也布者隂功所成不可以小功干盛陽也暴入聲門閭毋閉一則順時氣之宣通一則使暑氣之宣散關市毋索索者搜索商旅匿稅之物蓋當時氣盛大之際人君亦當體之而行寬大之政也索音色挺重囚益其食挺者拔出之義重囚禁繫嚴密故特加寬假輕囚則不如是益其食者加其養也遊牝別羣則縶騰駒班馬政季春逰牝于牧至此妊孕已遂故不使同羣拘縶騰躍之駒者止其踶囓也班布也馬政養馬之政令也周禮圉人圉師所掌遞別必列切縶音執踶音是月也日長至陰陽爭死生分至猶極也夏至日長之極陽盡午中而微隂眇重淵矣此隂陽爭辨之際也物之感陽氣而方長者生感隂氣而已成者死此死生分判之際也重平聲君子齊戒處必掩身毋躁止聲色毋或進薄滋味毋致和節耆欲定心氣齊戒以定其心掩蔽以防其身毋或輕躁於舉動毋或御進於聲色薄其調和之滋味節其諸事之愛欲凡以定心氣而備隂疾也和齊音齋處上聲去聲耆音嗜百官靜事毋刑以定晏隂之所成刑隂事也舉隂事則是助隂抑揚故百官府刑罰之事皆止靜而不行也凡天地之氣順則和競則逆故能致災咎此隂陽相爭之時故須如此謹備晏安也隂道靜故云晏隂及其定而至於成則循序而往不為災矣是以未定之前諸事皆不可忽也晏伊見切鹿角解蟬始鳴半夏生木堇榮比又言五月之候解脫也解音駭堇音謹是月也毋用火南方南方火位又因其位而盛其用則為微隂之害故戒之可以居高明可以逺眺望可以升山林可以處臺榭凡此皆順陽明之時處上聲仲夏行冬令則雹凍傷穀道路不通暴兵來至子水之氣所傷也行春令則五穀晚熟百螣時起其國乃飢卯木之氣所淫也螣音特行秋令則草木零落果實早成民殃於疫酉金之氣所泄也螣食苗葉之蟲也百螣者言害稼之蟲非一類季夏之月日在柳昏火中旦奎中柳宿在午鶉火之次也火大火心宿其日丙丁其帝炎帝其神祝融其蟲羽其音徵律中林鍾其數七其味苦其臭焦其祀竈祭先肺林鍾未律長六寸溫風始至蟋蟀居壁鷹乃學習腐草為螢此記未月之候至極也蟋蟀生於土中此時羽翼猶未能逺飛但居其穴之壁至七月則能逺飛而在野矣學習雛學數飛也腐草得暑濕之氣故變而為螢離朱氏曰溫風溫厚之極涼風嚴凝之始腐草為螢明之極故幽類化為明類也數音朔天子居明堂右個乘朱路駕赤駵載赤旗衣朱衣服赤玉食菽與雞其器高以粗明堂右個南堂西偏也命漁師伐蛟取鼉登龜取黿蛟言伐以其暴惡不易攻取也龜言登尊異之也鼉黿言取易而賤之也命澤人納材葦蒲葦之屬生於澤中而可為用器故曰材澤人納之職也此皆煩細之事非專一月所為故不以是月起之是月也命四監大合百縣之秩芻以養犧牲令民無不咸出其力以共皇天上帝名山大川四方之神以祠宗廟社稷之靈以為民祈福四監即周官山虞澤虞林衡川衡之官也前言百縣兼內外而言此百縣鄉遂之地也秩常也斂此芻為養犧牲之用各有常數故云秩芻也共音供為去聲是月也命婦官染采黼黻文章必以法故無或差貸黑黃倉赤莫不質良毋敢詐偽以給郊廟祭祀之服以為旗章以別貴賤等給之度周禮典婦功典枲染人等皆婦官此指染人也白與黑謂之黼黑與青謂之黻青與赤謂之文赤與白謂之章染造必用舊法故事毋得有參差貸變皆欲質正良善也旗旌旗也章者畫其象以別名位也詳見春官司常石梁王氏曰給當為級貸音二是月也樹木方盛命虞人入山行木毋有斬伐以其方盛故也行去聲不可以興土功不可以合諸侯不可以起兵動衆毋舉大事以搖養氣毋發令而待以妨神農之事也水潦盛昌神農將持功舉大事則有天殃大事即興土功合諸侯起兵動衆之事搖養氣謂動散長養之氣也發令而待謂未及徭役之期而豫發召役之令使民廢己事而待上之會期也神農農之神也季夏屬中央土土神得位用事之時謂之神農者土神主成就農事也東井主水在未故未月為水潦盛昌之月此時神農將主持稼穡之功舉大事而傷其功則是干造化施生之道矣故有天殃也是月也土潤溽暑大雨時行燒剃行水利以殺草如以熱湯可以糞田疇可以美土疆溽濕也土之氣潤故蒸鬱而為濕暑大雨亦以之而時行皆東井之所主也除草之法先芟剃之俟乾則燒之燒剃者燒所剃之草也大雨既行於所燒之地則草不復生矣故云利以殺草時暑日烈其水之熱如湯草之燒爛者可以為田疇之糞可以使土疆之美凡土之磊磈難耕者謂之疆切剃音替疆其兩季夏行春令則穀實鮮落鮮潔而墮落也鮮音仙國多風咳風咳因風而致咳疾也咳苦代切民乃遷徙辰土之氣所應也行秋令則丘隰水潦禾稼不熟乃多女災妊孕多敗戌土之氣所應也行冬令則風寒不時鷹隼蚤鷙四鄙入保丑土之氣所應也隼音笋中央土土寄旺四時各十八日共七十二日除此則木火金水亦各七十二日矣土於四時無乎不在故無定位無專氣而寄旺於辰戌丑未之末未月在火金之間又居一嵗之中故特揭中央土一令於此以成五行之序焉其日戊己戊己十干之中其帝黃帝黃精之君軒轅氏也其神后土土官之臣顓頊氏之子黎也句龍初為后土後祀以為社后土官闕黎雖火官實兼后土也舊説如此其蟲倮人為倮蟲之長鄭氏以為虎豹之屬倮力果切其音宫律中黃鍾之宮宮音屬土又為君故配之中央黃鍾夲十一月律諸律皆有宮音而黃鍾之宮乃八十四調之首其聲最尊而大餘音皆自此起如土為木火金水之根夲故以配中央之土土寄旺於四時宮音亦冠於十二律非如十二月以候氣言也調冠並去聲其數五天五生土地干成之四時皆舉成數此獨舉生數者四時之物無土不成而土之成數又積水一火二木三金四以成十也四者成則土無不成矣其味甘其臭香甘香皆屬土其祀中霤祭先心古者陶復陶穴皆開其上以漏光明故雨霤之後因名室中為中霤亦土神也祭先心者心居中君之象又火生土也蔡雍獨斷曰季夏土氣始盛其祀中霤霤神在室祀中霤設主于牖下天子居太廟太室中央之室也乘大路駕黃駵載黃旗衣黃衣服黃玉食稷與牛其器圜以閎圜者象土之周匝四時閎者寬廣之義象土之容物也圜音圓孟秋之月日在翼昏建星中旦畢中翼宿在己鶉尾之次建星説見仲春其日庚辛其帝少皥其神蓐收其蟲毛其音商律中夷則其數九其味辛其臭腥其祀門祭先肝少皥白精之君金天氏也蓐收金官之臣少皥氏之子該也夷則申律長五寸七百二十九分寸之四百五十一九金之成數也辛腥皆屬金秋隂氣出故祀門祭先肝金克木也之蔡雍獨斷曰門秋為少隂其氣收成祀於門祀門之禮北面設主于門左樞涼風至白露降寒蟬鳴鷹乃祭鳥用始行戮此記申月之候鷹欲食鳥之時先殺鳥而不食似人之食而祭先代為食之人也用始行戮順時令也天子居總章左個太寢西堂南偏乘戎路兵車也駕白駱白馬黑鬛日駱載白旗衣白衣服白玉食麻與犬其器廉以深廉稜角也亦矩之義深則收藏之意是月也以立秋先立秋三日太史謁之天子曰某日立秋盛德在金天子乃齊立秋之日天子親帥三公九卿諸侯大夫以迎秋於西郊還反賞軍帥武人於朝天子乃命將帥選士厲兵簡練桀俊專任有功以征不義詰誅暴慢以明好惡順彼逺方簡練簡擇而練習之也專任有功謂大將有己試之功乃使之專主其事也詰者問其罪誅者戮其人殘下謂之暴慢上謂之慢順服也好惡明則逺方順服先去聲齊音齋帥上入聲下二如字還音旋朝音潮將去聲好惡並去聲是月也命有司修法制繕囹圄具桎梏禁止姦慎罪邪務搏執繕治也姦在人心故當有以禁止之邪見於行故慎以罪之務事也搏戮也執拘也命理瞻傷察創視折審斷決獄訟必端平戮有罪嚴斷刑理治獄之官也傷者損皮膚創者損血肉折者損筋骨也嚴者謹重之意非峻急之謂也玩創平聲折音哲斷丁切天地始肅不可以贏朱氏曰陽道常饒隂道常乏故贊化者不可使隂氣之贏也是月也農乃登穀天子嘗新先薦寢廟命百官始收斂完隄坊謹壅塞以備水潦修宮室壞垣牆補城郭所以為水潦之備者以月建在酉酉中有畢星好雨也坊音防塞入聲壞音培是月也毋以封諸侯立大官記者但知賞以春夏刑以秋冬之義不知古者嘗祭之時則有出田邑之制故注謂禁封諸侯及割地為失其義也毋以割地行大使出大幣以其違收斂之令也使去聲孟秋行冬令則隂氣大勝介蟲敗穀戎兵乃來此亥水之氣所泄也大音泰行春令則其國乃旱蟹有食稻者謂之稻蟹亦介蟲敗穀之類寅中箕星好風能散雲雨故致旱陽氣復還五穀無實寅木之氣所損也復扶又反行夏令則國多火災寒熱不節民多瘧疾已火之氣所傷也仲秋之月日在角昏牽牛中旦觜觿中角在辰夀星之次也觜音兹觿音攜其日庚辛其帝少皥其神蓐收其蟲毛其音商律中南呂其數九其味辛其臭腥其祀門祭先肝南呂酉律長五寸三分寸之一盲風至鴻鴈來玄鳥歸羣鳥養羞此記酉月之候盲風疾風也孟春言鴻鴈來自南而來北也此言來自北而來南也仲春言玄鳥至此言歸明春來而秋去也羞者所美之食養羞者藏之以備冬月之養也天子居總章太廟乘戎路駕白駱載白旗衣白衣服白玉食麻與犬其器廉以深總章太廟西堂當太室也是月也養衰老授几杖行糜粥飲食月至四隂隂已盛矣時以陽衰隂盛為秋人以陽衰隂盛為老養衰老順時令也几杖所以安其身飲食所以養其體行猶賜也糜即粥也乃命司服具飭衣裳文繡有恆制有小大度有長短衣服有量必循其故冠帶有常司服官名具飭條具而飭正之也上曰衣下曰裳衣繪而裳繡祭服之制也有恆有定制也小大小則玄冕之一章大則衮冕之九章也長短謂衣長而裳短也衣服謂朝服燕服及他服之當為寒備者也各有劑量必率循故法不得更為新異也冠與帶亦各有常制因造衣并作之乃命有司申嚴百刑斬殺必當毋或枉橈枉橈不當反受其殃刑罰之令前月已行此月又申戒之也枉橈皆屈曲之義謂不申正理而違法斷之以逆理故必反受殃禍也當去聲橈女教切是月也乃命宰祝循行犧牲視全具按芻豢瞻肥瘠察物色必比類量小大視長短皆中度五者備當上帝其饗宰主牲者祝告神者全謂色不雜具謂體無損也養牛羊曰芻養犬豕曰豢得其養則肥失其養則瘠物色或騂或黝陽祀用騂牲隂祀用黝牲比類者比附隂陽之類而用之也小大以體言長短以角言皆欲中法度也所視所案所瞻所察所量五者悉備而當於事上帝且歆饗之矣况羣神乎行中當並去聲天子乃難以達秋氣以犬嘗麻先薦寢廟季春命國難以畢春氣此獨言天子難者此為除過時之陽暑陽者君象故諸侯以下不得難也暑氣退則秋之涼氣通達故云以達秋氣也為去聲是月也可以築城郭建都邑穿竇窖修囷倉四者皆為斂藏之備穿地圓曰竇方曰窖窖音教乃命有司趨民收斂務畜菜多積聚孟秋已有收斂之命矣此又趨之以時不可緩故也菜所以助穀之不足故蓄之為備多積聚者凡可為嵗備者無不貯儲也趨音促畜音蓄積音恣乃勸種麥毋或失時其有失時行罪無疑麥所以續舊穀之盡而及新穀之登尤利於民故特勸種而罰其惰者是月也日夜分雷始收聲蟄蟲壞户殺氣浸盛陽氣日衰水始涸壞益其蟄穴之户使通明處稍小至寒甚乃墐塞之也水本氣之所為春夏氣至故長秋冬氣返故涸也日夜分則同度量平權衡正鈞石角斗甬此與仲春同是月也易關市來商旅納貨賄以便民事四方來集逺鄉皆至則財不匱上無乏用百事乃遂朱氏曰關者貨之所入市者貨之所聚易謂無重征以致其難也易關市所以來商旅貨謂化之以為利賄謂有之以為利來商旅所以納貨賄也凡此皆以便民用也四方散而不一故言來集逺鄉邈而在外故言皆至此言貢賦職修也財所以待用財不匱則無乏用也用所以作事無乏用則事皆遂也聲易去凡舉大事毋逆大數必順其時慎因其類大事如土功徭役合諸侯舉兵衆之事皆不可悖隂陽之大數因猶依也如慶賞者乃發生之類刑罰者乃肅殺之類必順時令而謹依其類以行之也仲秋行春令則秋雨不降草木生榮國乃有恐卯木之氣所應也卯中有房心心為大火故不雨且有火訛之驚恐也行夏令則其國乃旱蟄蟲不藏五穀復生午火之氣所傷也復扶又切行冬令則風災數起收雷先行草木蚤死子水之氣所泄也收雷收聲之雷也先行先期而動也數音朔季秋之月日在房昏虗中旦柳中房在卯大火之次也其日庚辛其帝少皥其神蓐收其蟲毛其音商律中無射其數九其味辛其臭腥其祀門祭先肝無射戌律長四寸六千五百六十一分寸之六千五百二十四射音亦鴻鴈來賔爵入大水為蛤鞠有黃華豺乃祭獸戮禽此記戌月之候鴈以仲秋先至者為主季秋後至者為賔如先登者為主人從之以登者為客也爵為蛤飛物化為潛物也鞠色不一而專言黃者秋令在金金自有五色而黃為貴故鞠色以黃為正也祭獸者祭之於天戮禽者殺之以食也禽者鳥獸之總名鳥不可曰獸獸亦可曰禽故鸚鵡不曰獸而猩猩通曰禽也蛤古答切華音花天子居總章右個乘戎路駕白駱載白旗衣白衣服白玉食麻與犬其器廉以深總章右個西堂北偏也是月也申嚴號令命百官貴賤無不務內以會天地之藏無有宣出務內謂專務收斂諸物於內會合也合天地閉藏之令也宣出則悖時令乃命冢宰農事備收舉五穀之要藏帝籍之收於神倉祗敬必飭農事備收百穀皆斂也要者租賦所入之數籍田所收歸之神倉將以供粢盛也祗謂謹其事敬謂一其心飭謂致其力也是月也霜始降則百工休乃命有司曰寒氣總至民力不堪其皆入室總至凝聚而至也上丁命樂正入學習吹吹主樂聲而言同吹去聲篇內並是月也大饗帝句嘗句犧牲告備于天子仲夏大雩祈也此月大饗報也饗嘗皆用犧牲仲秋已視全具至此則告備而後用焉合諸侯制百縣為來嵗受朔日與諸侯所稅於民輕重之法貢職之數以逺近土地所宜為度以給郊廟之事無有所私石梁王氏曰合諸侯制百縣注云合諸侯制絶句不可從諸劉氏曰合諸侯者總命諸侯之國也制猶敕也百縣侯所統之縣也天子總命諸侯各敕百縣為來嵗受朔日與稅法貢數各以道路逺近土地所宜為度以給上之事而不可有私也言郊廟者舉其重也蓋朔日與稅貢等事皆天子總命之諸侯而諸侯頒之百縣使奉行也舊説秦建亥此月為嵗終故行此數事者得之或疑是時秦未并天下未有諸侯百縣此仍是古制愚按呂不韋相秦十餘年此時已有必得天下之勢故大集羣儒損益先王之禮而作此書名曰春秋將欲為一代興王之典禮也故其間亦多有未見與禮經合者又按昭襄王之時封魏冉穰侯公子市宛侯悝鄧侯則分封諸侯行王者事久矣不韋作相時已滅東周君六國削甚秦已得天下大半故其立制欲如此也其後徙死始皇并天下李斯作相盡廢先王之制而呂氏春秋亦無用矣然其書也亦當時儒生學士有志者所為猶能倣佛古制故記禮者有取焉為來為去聲是月也天子乃教於田獵以習五戎班馬政教於田獵謂因獵而教之以戰陳之事習用弓矢殳矛戈戟之五兵班布乘馬之政令其毛色之同異力之強弱各以類相從也陳去聲命僕及七騶咸駕載旌旐授車以級整設于屛外司徒搢撲北面誓之僕戎僕也天子馬有六種各一騶主之并總主六騶者為七騶也皆以馬駕車又載析羽之旌龜蛇之旐既畢而授車于乘者以尊卑為等級各使正其行列向背而設于軍門之屏外於是司徒插撲于帶於陳前北面誓戒之此時六軍皆向南而陳也撲即夏楚二物也周禮戎僕中大夫二人種上聲行音杭背音佩天子乃厲飾執弓挾矢以獵命主祠祭禽于四方天子戎服而嚴厲其威武之飾親用弓矢以殺禽獸蓋奉祭祀之物當親殺也獵竟則命典祀之官取獵地所獲之獸祭於郊以報四方之神禽者獸之通名也挾子協切是月也草木黃落乃伐薪為炭備禦寒也蟄蟲咸俯在內皆墐其户俯垂頭也內穴之深處也墐塞也墐音覲乃趣獄刑毋留有罪刑於罪相得即決之留而不決亦悖時令也促趣音收祿秩之不當供養之不宜者收如漢法收印綬之收謂索之使還各依夲等祿秩不當謂不應得而恩命濫賜之者也供養膳服之具也貴賤各有宜用不宜謂侈僭踰制者此亦順秋令之嚴肅也當養並去聲索音色是月也天子乃以犬嘗稻先薦寢廟季秋行夏令則其國大水未中東井主之冬藏殃敗竇窖之藏為水所侵民多鼽嚏未土之氣所應也鼽者氣窒於鼻嚏者聲發於口皆肺疾以夏火克金故病此也帝鼽嚏音求行冬令則國多盜賊邊竟不寧土地分裂丑土之氣所應也裂圻也竟音境篇內並同行春令則暖風來至民氣解惰師興不居辰土之氣所應也不居不得止息也解音懈孟冬之月日在尾昏危中旦七星中尾在寅析木之次也七星見季春其日壬癸其帝顓頊其神玄冥其蟲介其音羽律中應鍾其數六其味鹹其臭朽其祀行祭先腎顓頊黑精之君玄冥水官之臣少皥氏之子曰修曰熙相代為水官左傳云修及熙為玄冥是也介甲也介蟲龜為長水物也羽音屬水應鍾亥律長四寸二十七分寸之二十水成數六鹹朽皆水屬水受惡穢故有朽腐之氣也行者道路往來之處冬隂往而陽來故祀行也春夏秋皆祭先所勝冬當先心以中央祭心故但祭所屬又以冬主靜不尚克制故也蔡雍獨斷曰行冬為太隂盛寒為水祀之於行在廟門外之西軷壤厚二尺廣五尺輪四尺北面設主於軷上應去聲軷音鈸水始冰地始凍雉入大水為蜃虹藏不見此記亥月之候蜃蛟屬此亦飛物化潛物也晉武庫中忽有雉雊張華曰此必蛇化為雉也開視雉側果有蛇蛻類書有言雉與蛇交而生子子必為蟂不皆然也然則雉之為蜃理或有之隂陽氣交而為虹此時隂陽極乎辨故虹伏虹非有質而曰藏亦言其氣之下伏耳稅見音現蛻音退又音蟂音梟天子居玄堂左個北堂之西偏也乘玄路駕鐵驪鐵色之馬載玄旗衣黑衣黑深而玄淺如朱深而赤淺也服玄玉食黍與彘其器閎以奄閎者中寬奄者上窄是月也以立冬先立冬三日太史謁之天子曰某日立冬盛德在水天子乃齊立冬之日天子親帥三公九卿大夫以迎冬於北郊還反賞死事恤孤寡死事為國事而死也孤寡即死事者之妻子不言諸侯與夏同是月也命太史釁龜策句占兆句審卦吉凶馮氏曰釁龜策者殺牲取血而塗龜與著策也古者器成而釁以血所以攘卻不祥也占兆者玩龜書之繇文審卦者審易書之休咎皆所以豫明其理而待用也釁龜而占兆釁策而審卦吉凶太史之職也繇直又切是察阿黨則罪無有掩蔽獄吏治獄寧無阿私必是正而省察之庶幾犯罪者不至掩蔽其曲直也是月也天子始裘周禮季秋獻功裘至此月乃衣之也衣去聲命有司曰天氣上騰地氣下降天地不通閉塞而成冬不交則不通不通則閉塞上上聲塞入聲命百官謹蓋藏命有司循行積聚無有不斂申嚴仲秋積聚之令漬行去聲積音壞城郭戒門閭修鍵閉慎管籥壞補其缺薄處也城郭欲其厚實故言壞門閭備禦非常故言戒鍵鎖須也閉鎖筒也管籥鎖匙也鍵閉或有破壞故云修管籥不可妄開故云慎鍵音蹇固封疆備邊竟完要塞謹關梁塞徯徑要塞邊城要害處也關境上門梁橋也徯徑野獸往來之路也下塞入聲飭喪紀辨衣裳審棺槨之厚薄塋丘壟之大小高卑句厚薄之度貴賤之等級飭喪紀者飭正喪事之紀律也即辨衣裳以下諸事是已上衰下裳以布之精粗為親疏故曰辨亦謂襲斂之衣數多寡也棺槨厚薄有貴賤之等塋有大小丘壟有高卑皆不可踰越厚薄之度主禮而言貴賤之等級主人而言故總曰審而朱氏曰喪者人之終冬者嵗之終故於此時飭喪紀焉是月也命工師效功陳祭器按度程毋或作為淫巧以蕩上心必功致為上物勒工名以考其誠功有不當必行其罪以窮其情工師百工之長效呈也諸器皆成獨主祭器祭器尊也度法也程式也淫巧指諸器而言致讀為緻謂功力密緻也一讀如字亦通勒刻也刻名於器以考工人之誠偽也行猶治也窮其情者究詰其詐偽之情也音致按洪武正韻引此文治當去聲是月也大飲蒸因蒸祭而與羣臣大為燕飲也舊説蒸升也此乃饗禮升牲體於俎上謂之房蒸未知是否天子乃祈來年于天宗大割祠于公社及門閭臘先祖五祀勞農以休息之天宗日月星辰也割祠割牲以祭也社以上公配祭故云公社又祭及門閭之神也臘之言獵以田獵所獲之物而祭先祖及五祀之神故曰臘也又蔡雍云夏曰清祀殷曰嘉平周曰臘秦曰臘然左傳言虞不臘是周亦名臘也勞農即周禮黨正屬民飲酒之禮也天子乃命將帥講武習射御角力以仲冬大閲也將去聲是月也乃命水虞漁師收水泉池澤之賦毋或敢侵削衆庶兆民以為天子取怨于下其有若此者行罪無赦水虞澤虞也漁師漁人也見周禮水冬涸故以冬時收賦為去聲孟冬行春令則凍閉不密地氣上泄民多流亡寅木之氣所泄也上上聲行夏令則國多暴風方冬不寒蟄蟲復出已火之氣所損也復扶又切行秋令則雪霜不時小兵時起土地侵削申金之氣所淫也仲冬之月日在斗昏東辟中旦軫中斗在丑星紀之次也辟音璧其日壬癸其帝顓頊其神玄冥其蟲介其音羽律中黃鍾其數六其味鹹其臭朽其祀行祭先腎黃鍾子律長九寸冰益壯地始坼鶡旦不鳴虎始交此記子月之候鶡旦夜鳴求旦之鳥也坼俗作拆誤天子居玄堂太廟乘玄路駕鐵驪載玄旗衣黑衣服玄玉食黍與彘其器閎以奄玄堂太廟北堂當太室也飭死事誓戒六軍之士以戰陳當厲必死之志也命有司曰土事毋作慎毋發蓋毋發室屋及起大衆以固而閉順閉藏之令以安伏蟄之性也固堅也而猶其也周禮仲冬教大閲此言毋起大衆是誠呂氏之書矣地氣沮泄是謂發天地之房諸蟄則死民必疾疫又隨以喪命之曰暢月沮者壞散之義因破壞而宣泄故云沮泄也天地之閉固氣類猶房室之安藏人也若發散天地之所藏則諸蟄皆死是干犯隂陽之令疾疫必為民災喪禍隨之而見一説喪讀去聲謂民因避疾疫而逃亡也暢月未詳舊説暢充也言所以不可發泄者以此月萬物皆充實於內故也朱氏謂陽久屈而後伸故云暢月也未知孰是沮上聲是月也令奄尹申宮令審門閭謹房室必重閉省婦事毋得淫雖有貴戚近習毋有不禁奄尹羣奄之長也以其精氣奄閉故名閹人宮令宮中之政令也重閉內外皆閉也減省婦人之事務順隂靜也淫謂女功之過巧者貴戚天子之族姻近習其嬖幸者乃命大酋秫稻必齊麴糵必時湛熾必潔水泉必香陶器必良火齊必得兼用六物大酋監之毋有差貸大酋酒官之長也秫稻酒材也必齊多寡中度也必時制造及時也湛漬而滌之也熾蒸炊也必潔無所汚也必香無穢惡之氣也必良無罅漏之失也必得適生熟之宜也物事也六物謂必齊以下六事差貸不中法式也酋音揫齊上如字下去聲湛音尖監平聲貸音二坊夲音忒按正韻二音通用中去聲天子命有司祈祀四海大川名源淵澤井泉冬令方中水德至盛故為民祈而祀之也是月也農有不收藏積聚者馬牛畜獸有放佚者取之不詰取之不詰罪在不收斂也積音漬詰起吉切山林藪澤有能取蔬食田獵禽獸者野虞教道之其有相侵奪者罪之不赦罪之不赦惡其不相共利也道去聲惡去聲是月也日短至隂陽爭諸生蕩短至短之極也隂陽之爭與夏至同諸生者萬物之生機也蕩者動也君子齊戒處必掩身身欲寧去聲色禁耆欲安形性事欲靜以待隂陽之所定此皆與夏至同而有謹之至者彼言止聲色而此言去彼言節耆欲而此言禁蓋仲夏之隂猶微而此時之隂猶盛隂微則盛陽未至於甚傷隂盛則微陽當在於善保故也藝始生荔挺出蚯蚓結麋角解水泉動此又言子月之候藝與荔挺皆香草結猶屈也解脫也水者天一之陽所生陽生而動言枯涸者漸滋發也十二月惟子午之月皆再記其候者詳於隂陽之萌也日短至則伐木取竹箭隂盛則材成故伐而取之大曰竹小曰箭是月也可以罷官之無事去器之無用者官以權宜而設器以權宜而造皆暫焉之事此閉藏休息之時故可罷去塗闕廷門閭築囹圄此以助天地之閉藏也仲冬行夏令則其國乃旱火氣乘之應於來年氛霧冥冥亦火氣所蒸雷乃發聲隂不能固陽也午火之氣所克也行秋令則天時雨汁瓜瓠不成雨雪雜下曰汁音雨去聲汁執國有大兵酉金之氣所淫也行春令則蝗蟲為敗水泉咸竭卯中大火之所主也民多疥癘卯木之氣所泄也季冬之月日在婺女昏婁中旦氐中女在子玄枵之次也枵音囂其日壬癸其帝顓頊其神玄冥其蟲介其音羽律中大呂其數六其味鹹其臭朽其祀行祭先腎大呂丑律長八寸二百四十三分寸之百四鴈北鄉鵲始巢雉雊雞乳此記丑月之候去鄉去聲雊古侯切乳聲天子居玄堂右個乘玄路駕鐵驪載玄旗衣黑衣服玄玉食黍與彘其器閎以奄玄堂右個北堂東偏也命有司大難旁磔出土牛以送寒氣季春惟國家之難仲秋惟天子之難此則下及庶人又以隂氣極盛故云大難也旁磔謂四方之門皆披磔其牲以攘除隂氣不但如季春之九門磔攘而已舊説此月日經虗危司命二星在虗北司祿二星在司命北司危二星在司祿北司中二星在司危北此四司者鬼官之長又墳四星在危東南墳墓四司之氣能為厲鬼將來或為災厲故難磔以攘除之事或然也出猶作也月建丑丑為牛土能制水故特作土牛以畢送寒氣也征鳥厲疾征鳥鷹隼之屬以其善擊故曰征厲疾者猛厲而迅疾也乃畢山川之祀及帝之大臣天之神祗帝之大臣謂五帝之佐句芒祝融之屬也孟冬言祈天宗此或司中司命風師雨師之屬歟是月也命漁師始漁天子親往乃嘗魚先薦寢廟獵而親殺為奉祭也則漁而親往亦為薦先歟冰方盛水澤腹堅命取冰冰以入冰之初凝惟水面而已至此則徹上下皆凝故云腹堅腹猶內也藏冰正在此時故命取冰冰入則隂事之終也令告民出五種命農計耦耕事修耒耜具田器冰入之後大寒將退令典農之官告民出其所藏五穀之種計度耦耕之事耦謂二人相偶也揉木為耒斫木為耜今之耜以鐵為之田器鎡基之屬凡治田所用者也此皆豫備東作之事陽事之始也種上聲度入聲命樂師大合吹而罷鄭氏曰嵗將終與族人大飲作樂於太寢以綴恩也王居明堂禮季冬命國為酒以合三族疏曰此用禮樂於族人最盛後年季冬乃復如此作樂以一年頓停故云罷吹去聲乃命四監收秩薪柴以共郊廟及百祀之薪燎四監説見季夏秩常也謂有常數也大而可析者謂之薪小而東者謂之柴薪燎炊爨及夜燎之用也共音供是月也日窮于次月窮于紀星回于天數將幾終嵗且更始日窮于次者去年季冬次玄枵至此窮盡還次玄枵也紀會也去年季冬月與日相會於玄枵至此窮盡還復會於玄枵也二十八宿隨天而行每日雖周天一匝而早晚不同至此月而復其故處與去年季冬早晚相似故云回于天也幾近也以去年季冬至今年季冬三百五十四日未滿三百六十五日不為正終故云幾於終也嵗且更始者所謂終則有始也幾更並平聲専而農民毋有所使而汝也在上者當專一汝農之事毋得徭役使之也天子乃與公卿大夫共飭國典論時令以待來嵗之宜朱氏曰國典有常飭之以應來嵗之變時令有序論之以防來嵗之差嵗既更始故事亦有異宜者共如字論去聲應去聲乃命太史次諸侯之列賦之犧牲以共皇天上帝社稷之饗列謂大小之等差也宜共音供下並同差楚切乃命同姓之邦共寢廟之芻豢人本乎祖故祖廟之牲使同姓諸侯供之命宰歷卿大夫至於庶民土田之數而賦犧牲以共山林名川之祀歷者序次其多寡之數也凡在天下九州之民者無不咸獻其力以共皇天上帝社稷寢廟山林名川之祀禮有五經莫重於祭故也季冬行秋令則白露蚤降介蟲為妖四鄙入保畏介蟲為兵之象也戌土之氣所應行春令則胎夭多傷胎未生者夭方生者國多固疾固謂久而不差辰上之氣所應差楚懈切命之曰逆以嵗終而行嵗始之令也行夏令則水潦敗國時雪不降冰凍消釋火奪水之令也未土之氣所應禮記集説卷三
