body:
  text: 禮記集說禮類三禮記之屬提要臣等謹案禮記集說十卷元陳澔撰澔字可大都昌人宋亡不仕教授鄉里學者稱雲莊先生其書衍繹舊聞附以已見欲以坦明之說取便初學而於度數品節擇焉不精語焉不詳後人病之蓋自漢以來治戴記者百數十家惟衛湜集說徴引極審頗為學者所推許澔是書雖襲其名而用意不侔博約亦異觀其自序謂鄭氏祖䜟緯孔疏惟鄭之從為可恨又以應鏞纂義於雜記等篇闕而不釋為非亦不為無見第述其家學稱其父師事雙峯以是經三領鄉書為名進士則其志趣固專為帖括之助耳明初與注疏並頒學官用以取士後乃專用是書迄今因之朱睦㮮授經圖作十六卷朱彛尊經義考作三十卷殆本各不同今卷蓋仍明時監板之舊云乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀禮記集說序前聖繼天立極之道莫大於禮後聖垂世立教之書亦莫先於禮禮儀三百威儀三千孰非精神心術之所寓故能與天地同其節四代損益世逺經殘其詳不可得聞矣儀禮十七篇戴記四十九篇先儒表章學庸遂為千萬世道學之淵源其四十七篇之文雖純駁不同然義之淺深同異誠未易言也鄭氏祖讖緯孔疏惟鄭之從雖有他說不復收載固為可恨然其灼然可據者不可易也近世應氏集解於雜記大小記等篇皆闕而不釋噫慎終追逺其關於人倫世道非細故而可略哉先君子師事雙峰先生十有四年以是經三領鄉書為開慶名進士所得於師門講論甚多中罹煨燼隻字不遺不肖孤僭不自量㑹萃衍繹而附以臆見之言名曰禮記集說蓋欲以坦明之說使初學讀之即了其義庶幾章句通則藴奧自見正不必髙為議論而卑視訓詁之辭也書成甚欲就正於四方有道之士而衰年多疾逰歷良艱姑藏巾笥以俟來哲治教方興知禮者或有取焉亦愚者千慮之一爾至治壬戌良月既望後學東匯澤陳澔序
